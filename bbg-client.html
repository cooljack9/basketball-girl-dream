/* ============================================================
   瘦客户端接入层 —— 前端只读取后端数据
   后端（server/）是状态(G) 的唯一真实来源、引擎执行者与持久化层。
   本文件仍随附完整引擎代码，但所有「用户动作」均重定向到后端执行，
   前端只负责渲染后端返回的状态。后续 Batch 会把引擎抽取为独立
   server/engine.js，前端不再随附引擎（见 engine-loader.js 注释）。
   ============================================================ */

var __API = '';   // 同源部署留空；跨域时填 'http://localhost:8787'
function apiCall(method, path, body){
  return fetch(__API + path, {
    method: method,
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    return r.text().then(function(t){
      var d; try{ d = JSON.parse(t); }catch(e){ d = {raw:t}; }
      // 非 2xx，或返回的不是 JSON（如静态托管的 HTML 兜底页）→ 视为“无后端”
      if(!r.ok || d.raw !== undefined) return Promise.reject(d);
      return d;
    });
  });
}

var LOCAL_MODE = false;   // 后端不可达时降级为本地单机模式（双击即玩）
function isValidState(s){ return !!s && typeof s==='object' && !!s.stats && (!!s.screen || !!s.tpl); }
async function boot(){
  // 优先尝试连接后端；无后端（含静态托管返回 HTML 兜底页）则自动降级为本地模式
  try{
    var r = await apiCall('GET','/api/games/active');
    if(r && r.state && isValidState(r.state)){ G = r.state; hasSave = true; }
    else {
      var c = await apiCall('POST','/api/games',{name:'小岚', template: pendingTemplate, grow: growSliderMul(pendingGrowT)});
      if(c && c.state && isValidState(c.state)){ G = c.state; hasSave = false; }
      else throw new Error('backend returned no valid state');
    }
    enterBackendMode();
  }catch(e){
    LOCAL_MODE = true;
    try{
      if(!loadGame()){ newGame('小岚', Math.floor(Math.random()*1e9), pendingTemplate); /* screen 保持 title，先命名 */ hasSave=false; }
    }catch(e2){ renderFatal(); return; }
  }
  installShell();
  render();
}
function renderFatal(){
  var el = (typeof document!=='undefined') ? document.getElementById('app') : null;
  if(el) el.innerHTML = '<div class="overlay"><div class="modal"><h2>无法连接后端</h2><p>请先启动服务：<code>node server/server.js</code>（默认端口 8787）。</p></div></div>';
}

async function dispatch(action, args){
  if(LOCAL_MODE){
    try{
      var fn = (window.__GAME && window.__GAME[action]) || window[action];
      if(typeof fn === 'function') fn.apply(null, Array.isArray(args)?args:[]);
    }catch(e){ if(typeof console!=='undefined') console.error('local action failed:', action, e); }
    render();
    return;
  }
  var r = await apiCall('POST','/api/games/active/actions', {action: action, args: args || []});
  G = r.state; try{ showSaveToast(); }catch(e){} render(); return r.result;
}

/* 后端模式：存档由后端负责，UI 动作重定向到后端 dispatch（本地模式下这些重定向不生效，保留原生函数） */
function enterBackendMode(){
  saveGame = function(){ /* 后端在每次动作派发后已持久化，本地 no-op */ };
  loadGame = function(){ return false; };
  hasSavedGame = function(){ return !!G; };
  continueGame = function(){ render(); };
  startGame = function(){
    var nm = ($('pname') && $('pname').value) ? $('pname').value.trim() : '小岚';
    return apiCall('POST','/api/games', {name: nm, template: pendingTemplate, grow: growSliderMul(pendingGrowT)})
      .then(function(c){ G = c.state; hasSave = false; render(); });
  };
  restart = function(){
    return apiCall('POST','/api/games', {name:'小岚', template: pendingTemplate})
      .then(function(c){ G = c.state; hasSave = false; render(); });
  };
  var ACTS = ['toggleOffer','openTransfer','proceedToMatch','confirmChoice','resolveEvent','lockerChoice','pickMinutes','prematchDecision','prematchPick','setQuarterInten','revealQuarter','matchContinue','leagueContinue','cupContinue','pickDream','staySchool','transferSchool','pickMiddleSchool','pickHighSchool'];
  ACTS.forEach(function(n){
    if(typeof window[n] === 'function'){ window[n] = function(){ return dispatch(n, Array.prototype.slice.call(arguments)); }; }
  });
}

/* ============ 轻量音效（GAP-02，零依赖 WebAudio） ============ */
var Sfx = (function(){
  var ctx=null, muted=false;
  try{ muted = (localStorage.getItem('bbg_mute_v1')==='1'); }catch(e){}
  function ac(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function beep(freq, dur, type, vol){
    if(muted) return; var c=ac(); if(!c) return;
    try{ var o=c.createOscillator(), g=c.createGain(); o.type=type||'square'; o.frequency.value=freq;
      var t=c.currentTime; g.gain.setValueAtTime(vol||0.04, t); o.connect(g); g.connect(c.destination);
      o.start(t); g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.08)); o.stop(t+(dur||0.08)); }catch(e){}
  }
  return {
    setMuted:function(m){ muted=m; try{ localStorage.setItem('bbg_mute_v1', m?'1':'0'); }catch(e){} },
    isMuted:function(){ return muted; },
    click:function(){ beep(420,0.05,'square',0.03); },
    win:function(){ beep(523,0.12,'triangle',0.06); setTimeout(function(){ beep(784,0.18,'triangle',0.06); },120); },
    lose:function(){ beep(300,0.18,'sawtooth',0.05); },
    achv:function(){ beep(880,0.10,'triangle',0.06); setTimeout(function(){ beep(1175,0.14,'triangle',0.06); },110); },
    fanfare:function(){ beep(659,0.10,'triangle',0.06); setTimeout(function(){ beep(880,0.10,'triangle',0.06); },90); setTimeout(function(){ beep(1319,0.22,'triangle',0.07); },210); }
  };
})();
if(typeof document!=='undefined' && document.addEventListener){
  document.addEventListener('click', function(e){
    var t=e.target; if(t && t.closest && t.closest('.btn, .tpl, .scho, .choice, .dream-card, [onclick]')){ try{ Sfx.click(); }catch(_){} }
  });
}

/* ============ 设置层（齿轮 + 覆盖层）：难度 / 静音 / 清空存档 ============ */
function installShell(){
  if(typeof document==='undefined' || document.getElementById('gear-btn')) return;
  var g=document.createElement('button'); g.id='gear-btn'; g.className='gear-btn'; g.innerHTML='⚙'; g.title='设置';
  g.onclick=openSettings; document.body.appendChild(g);
  updateSyncPill();
}
function updateSyncPill(){
  try{
    var el=document.getElementById('sync-pill');
    if(!el){ el=document.createElement('div'); el.id='sync-pill'; document.body.appendChild(el); }
    el.textContent = LOCAL_MODE ? '💾 本地存档' : '☁ 已同步云端';
    el.className='sync-pill '+(LOCAL_MODE?'local':'cloud');
  }catch(e){}
}
function loadDiffPref(){ try{ return localStorage.getItem('bbg_diff_v1')||'normal'; }catch(e){ return 'normal'; } }
function openSettings(){
  var layer=document.getElementById('settings-layer');
  if(!layer){ layer=document.createElement('div'); layer.id='settings-layer'; layer.className='overlay settings-layer'; document.body.appendChild(layer); }
  var diff = (G&&G.difficulty)||loadDiffPref()||'normal';
  var muted = (Sfx?Sfx.isMuted():false);
  var opts = ['easy','normal','hard'].map(function(k){ return '<button class="diff-opt'+(diff===k?' on':'')+'" onclick="applyDifficulty(\''+k+'\')">'+DIFF[k].label+'</button>'; }).join('');
  layer.innerHTML = '<div class="modal settings-modal">'+
    '<div class="who">⚙ 设置</div>'+
    '<div class="set-row"><span class="set-label">难度</span><div class="diff-row">'+opts+'</div></div>'+
    '<p class="muted" style="font-size:12px;margin:-4px 0 10px">休闲：瓶颈更温和、婷婷稍弱；硬核：瓶颈更深、婷婷更强。</p>'+
    '<div class="set-row"><span class="set-label">音效</span><button class="btn ghost" onclick="toggleMute()">'+(muted?'🔇 已静音':'🔊 开启')+'</button></div>'+
    '<div class="set-row"><span class="set-label">存档</span><button class="btn ghost" onclick="clearSave()">清空存档</button></div>'+
    '<p class="muted" style="font-size:12px;margin:-4px 0 10px">本地存档保存在浏览器 localStorage；清空后将无法继续当前进度。</p>'+
    '<div class="set-actions"><button class="btn" onclick="closeSettings()">关闭</button></div>'+
    '</div>';
  layer.style.display='flex';
}
function closeSettings(){ var l=document.getElementById('settings-layer'); if(l) l.style.display='none'; }
function applyDifficulty(k){
  if(!DIFF[k]) k='normal';
  if(G) G.difficulty=k;
  try{ localStorage.setItem('bbg_diff_v1', k); }catch(e){}
  if(LOCAL_MODE){ try{ saveGame(); }catch(e){} }
  else { try{ apiCall('PUT','/api/games/active/sync', G); }catch(e){} }
  openSettings();
  if(G && G.screen && G.screen!=='title') render();
}
function toggleMute(){ if(Sfx) Sfx.setMuted(!Sfx.isMuted()); openSettings(); }
function clearSave(){
  try{ localStorage.removeItem('bbg_save_v1'); }catch(e){}
  if(LOCAL_MODE){ hasSave=false; newGame('小岚', Math.floor(Math.random()*1e9), pendingTemplate); G.screen='title'; }
  else { try{ apiCall('DELETE','/api/games/active'); }catch(e){} try{ apiCall('POST','/api/games',{name:'小岚',template:pendingTemplate}).then(function(x){ G=x.state; hasSave=false; }); }catch(e){} }
  closeSettings(); render();
}
function showSaveToast(){
  try{
    var el=document.getElementById('save-indicator');
    if(!el){ el=document.createElement('div'); el.id='save-indicator'; el.className='save-indicator'; document.body.appendChild(el); }
    el.textContent = LOCAL_MODE ? '💾 已存档' : '☁ 已同步云端'; el.classList.add('show');
    clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('show'); }, 1200);
  }catch(e){}
}

/* 全局兜底：任何未捕获的同步/异步错误都可见地显示在页面上（防白屏静默失败） */
(function(){
  function report(msg){ try{ var f=document.getElementById('err-layer'); if(!f){ f=document.createElement('div'); f.id='err-layer'; f.style.cssText='position:fixed;left:8px;bottom:8px;max-width:90vw;z-index:99999;background:#fff3f3;border:1px solid #e0506a;color:#a02030;font:12px/1.5 monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;box-shadow:0 2px 10px rgba(0,0,0,.15)'; document.body.appendChild(f);} f.textContent='⚠ '+(msg||'未知错误')+'  （请截图反馈此信息）'; }catch(e){} }
  window.addEventListener('error', function(e){ report((e&&e.message||'错误')+(e&&e.filename?(' @ '+e.filename+':'+e.lineno):'')); });
  window.addEventListener('unhandledrejection', function(e){ report('未处理的异步异常：'+((e&&e.reason&&(e.reason.stack||e.reason.message))||e&&e.reason||'未知')); });
})();

boot();
