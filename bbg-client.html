<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>篮球女孩梦工场 · 校队联赛</title>
<style>
  :root{
    color-scheme: light;
    --pink:#e8609a; --pink-soft:#fbeaf0; --blue:#5aa0e0; --blue-soft:#e6f1fb;
    --amber:#e89a2a; --green:#6fae46; --red:#e0506a; --text:#3a3340; --muted:#8a8390;
    --line:#ece6ec; --bg:#fbf7fb; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;padding:18px;}
  #app{max-width:1160px;margin:0 auto;}
  h1{font-size:24px;font-weight:700;color:var(--pink);}
  h2{font-size:17px;font-weight:700;margin-bottom:8px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .btn{border:none;border-radius:12px;padding:10px 20px;font-size:15px;font-weight:600;
    cursor:pointer;background:var(--pink);color:#fff;transition:.15s;}
  .btn:hover{filter:brightness(1.06);}
  .btn.ghost{background:var(--blue-soft);color:var(--blue);}
  .btn.alt{background:var(--blue);}
  .btn.gold{background:linear-gradient(90deg,#e8a02a,#e87a2a);color:#fff;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
  /* title */
  .title-wrap{text-align:center;padding:30px 20px;}
  .title-wrap .big{font-size:38px;margin:8px 0;}
  .title-wrap .lead{color:var(--muted);max-width:680px;margin:0 auto 18px;font-size:14px;}
  .name-row{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:16px;}
  .name-row input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;width:200px;}
  .tpl-row{display:flex;gap:12px;justify-content:center;margin:6px 0 18px;flex-wrap:wrap;}
  .tpl{border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:170px;cursor:pointer;background:#fff;transition:.15s;}
  .tpl:hover{border-color:var(--blue);}
  .tpl.on{border-color:var(--pink);box-shadow:0 4px 16px rgba(232,96,154,.16);background:var(--pink-soft);}
  .tpl .tn{font-weight:800;font-size:16px;}
  .tpl .td{color:var(--muted);font-size:12px;margin-top:4px;}
  .tpl .em{font-size:11.5px;margin-top:6px;color:var(--blue);font-weight:600;}
  .focus-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
  .focus-row .fc{font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);background:#faf7f8;}
  .focus-row .fc.on{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:700;}
  /* layout */
  .topbar{display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(90deg,var(--pink-soft),var(--blue-soft));
    border-radius:14px;padding:12px 18px;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .topbar .who{font-weight:700;font-size:16px;}
  .topbar .meta{color:var(--muted);font-size:13px;}
  .rank-badge{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;}
  .rank-badge b{color:var(--pink);}
  .coach{background:var(--blue-soft);border-radius:12px;padding:8px 16px;margin-bottom:16px;
    font-size:13px;color:#3a4a5a;display:flex;gap:8px;align-items:center;}
  .coach .face{font-size:18px;}
  .grid{display:grid;grid-template-columns:310px 1fr 300px;gap:16px;align-items:start;}
  @media(max-width:980px){.grid{grid-template-columns:1fr;}}
  .stage-tag{display:inline-block;background:var(--blue-soft);color:var(--blue);
    border-radius:8px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:6px;}
  .avatar-box{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;}
  .ht{font-size:30px;font-weight:800;color:var(--pink);margin-top:4px;}
  .ht small{font-size:14px;color:var(--muted);font-weight:500;}
  .delta{font-size:13px;font-weight:600;}
  .delta.up{color:var(--green);} .delta.flat{color:var(--muted);}
  .spark{margin-top:6px;}
  .stat-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;}
  .stat-row .lab{width:74px;color:var(--muted);}
  .stat-row .bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;}
  .stat-row .bar i{display:block;height:100%;border-radius:6px;background:var(--blue);}
  .stat-row .val{width:42px;text-align:right;font-weight:600;}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:560px){.acts{grid-template-columns:repeat(2,1fr);}}
  .act{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;
    transition:.13s;position:relative;overflow:hidden;}
  .act:hover{transform:translateY(-2px);border-color:var(--pink);box-shadow:0 4px 14px rgba(232,96,154,.14);}
  .act .nm{font-weight:700;font-size:14px;}
  .act .ds{color:var(--muted);font-size:11.5px;margin:3px 0;}
  .act .ef{font-size:11.5px;color:var(--blue);font-weight:600;}
  .act .cat{position:absolute;top:0;left:0;width:100%;height:4px;}
  .act.combo{border-color:var(--green);box-shadow:0 0 0 2px rgba(111,174,70,.25);}
  .act .combo-tag{position:absolute;top:6px;right:6px;background:var(--green);color:#fff;
    font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;}
  .act.tpl{box-shadow:0 0 0 2px rgba(232,96,154,.3);}
  .act .tpl-tag{position:absolute;top:6px;right:6px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;}
  .panel h3{font-size:14px;margin:4px 0 8px;}
  .diary{max-height:150px;overflow:auto;font-size:12.5px;}
  .diary .e{padding:6px 0;border-bottom:1px dashed var(--line);color:#5a5260;}
  .diary .e .y{color:var(--pink);font-weight:700;margin-right:6px;}
  /* 宿敌对比 */
  .vs-card{background:linear-gradient(135deg,#fff,#fbeaf0);border:1px solid #f3c9da;border-radius:14px;padding:12px;margin-bottom:14px;}
  .vs-card .ttl{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  .vs-card .ttl .badge{font-size:11px;background:var(--pink);color:#fff;border-radius:8px;padding:2px 8px;}
  .vs-row{display:flex;justify-content:space-between;font-size:13px;margin:7px 0 3px;}
  .vs-row .me{color:var(--pink);font-weight:700;}
  .vs-row .her{color:var(--blue);font-weight:700;}
  .vs-bar{height:16px;border-radius:8px;overflow:hidden;display:flex;background:var(--line);}
  .vs-bar .you{background:var(--pink);height:100%;}
  .vs-bar .her{background:var(--blue);height:100%;}
  .vs-status{font-size:12.5px;margin-top:6px;font-weight:600;}
  .vs-status.lead{color:var(--green);} .vs-status.behind{color:var(--blue);} .vs-status.slack{color:var(--red);}
  .ting-talk{font-size:12px;color:#7a5a6a;background:#fff;border-radius:10px;padding:7px 9px;margin-top:8px;
    border:1px dashed #f0c8d8;}
  /* 联赛榜 */
  .rival{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 0;
    border-bottom:1px dashed var(--line);}
  .rival .htv{color:var(--muted);font-size:11px;width:54px;text-align:right;}
  .rival.me{background:var(--pink-soft);border-radius:8px;padding:4px 8px;font-weight:700;}
  .rival .rn{width:18px;color:var(--muted);font-weight:700;}
  .rival .rnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rival .rp{width:42px;text-align:right;font-weight:700;}
  .trend{width:34px;text-align:right;font-size:11px;font-weight:700;}
  .trend.up{color:var(--green);}
  .trend.dn{color:var(--red);}
  .trend{color:var(--muted);}
  /* 本季战力风云 */
  .season-story .sr-wrap{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;}
  .season-story .sr-col{flex:1;min-width:150px;}
  .season-story .sr-h{font-size:12px;font-weight:800;margin-bottom:4px;}
  .season-story .up-col .sr-h{color:var(--green);}
  .season-story .dn-col .sr-h{color:var(--red);}
  .season-story .story-row{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line);}
  .season-story .sr-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .season-story .sr-tag{font-size:9.5px;padding:1px 6px;border-radius:6px;background:var(--pink-soft);color:var(--pink);font-weight:700;}
  .player-star .star-row{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line);}
  .player-star .sr-name{flex:1;font-weight:700;color:#5a5260;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .player-star .sr-school{font-size:10px;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .player-star .sr-pos{font-size:10px;background:#eee;color:#666;border-radius:5px;padding:1px 5px;}
  .player-star .sr-h{font-weight:800;color:#3a8fb0;font-size:12px;min-width:46px;text-align:right;}
  .player-star .sr-ovr{font-weight:800;color:#5aa0e0;font-size:12px;min-width:22px;text-align:right;}
  .rrow .hgt{font-size:10.5px;color:#3a8fb0;font-weight:700;min-width:40px;text-align:right;}
  .rrow .hgt.giant{color:#c0392b;}
  .rrow .ptag{font-size:11px;}
  /* 阵容表：首发 / 替补 标记（依据 G.lineup） */
  .rrow .sttag{font-size:9.5px;font-weight:800;color:#fff;background:#5aa0e0;border-radius:5px;padding:1px 5px;flex:none;}
  .rrow .btag{font-size:9.5px;color:#8a86c0;background:#efeef6;border-radius:5px;padding:1px 5px;flex:none;}
  .rrow.st{background:rgba(90,160,224,.08);}
  /* 先天特征 / 发育类型 / 国际学生 标签 */
  .ftag{font-size:9px;font-weight:800;border-radius:6px;padding:1px 4px;white-space:nowrap;background:#eef2f7;color:#5b6b7c;}
  .ftag.t-genius{background:#fdf3d4;color:#a5822b;}
  .ftag.t-horse{background:#e9e2fb;color:#6b4fb5;}
  .ftag.t-speed{background:#e0f5f1;color:#2f8a78;}
  .ftag.t-power{background:#fdeadb;color:#b96a2c;}
  .ftag.t-tech{background:#e2eefb;color:#3a72ad;}
  .ftag.t-iron{background:#e8ecef;color:#5a6a75;}
  .ftag.t-smart{background:#f3ecdd;color:#8a7233;}
  .mtag{font-size:9px;font-weight:800;border-radius:6px;padding:1px 4px;white-space:nowrap;}
  .mtag.late{background:#e6f6e2;color:#3f8a34;}
  .mtag.early{background:#f2f0ee;color:#8d867e;}
  .itag{font-size:10px;margin-right:2px;}
  .leg{font-size:9.5px;color:#9a6fb0;font-weight:700;margin-left:3px;}
  .rdiv{font-size:9.5px;color:var(--muted);letter-spacing:1px;margin:5px 0 2px;padding-top:4px;border-top:1px solid var(--line);}
  .tm-h{font-size:10.5px;color:#3a8fb0;font-weight:700;margin-left:4px;}
  .ba{font-size:9.5px;color:#8a7f5a;background:#f6f1e2;border-radius:6px;padding:1px 5px;margin-left:4px;font-weight:700;}
  .ba.shut{color:#a05252;background:#f7e8e6;}
  .sr-tag.beyond{background:#ffe9d6;color:#c9622a;}
  /* 像素外景 · 校园全景 */
  .pixel-scene{padding:0;overflow:hidden;margin-bottom:14px;}
  .ps-stage{position:relative;line-height:0;}
  .ps-stage svg{display:block;width:100%;height:auto;}
  .ps-name{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center;z-index:3;
    background:rgba(255,255,255,.88);border:2px solid var(--ink);border-radius:10px;padding:4px 14px;
    box-shadow:3px 3px 0 rgba(46,36,51,.14);line-height:1.25;max-width:44%;}
  .ps-name b{display:block;font-size:15px;color:var(--ink);letter-spacing:1px;}
  .ps-name span{display:block;font-size:10px;color:var(--muted);}
  .ps-panel{position:absolute;top:8px;z-index:3;width:154px;padding:6px 8px;line-height:1.5;
    background:rgba(255,255,255,.86);border:2px solid var(--ink);border-radius:10px;
    box-shadow:3px 3px 0 rgba(46,36,51,.12);}
  .ps-left{left:8px;} .ps-right{right:8px;}
  .ps-h{font-size:10.5px;font-weight:800;color:var(--pink);border-bottom:1px dashed #e6dfe6;padding-bottom:3px;margin-bottom:3px;}
  .ps-k{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);}
  .ps-k b{color:var(--ink);font-weight:700;}
  .ps-empty{font-size:10px;color:var(--muted);padding:4px 0;}
  .ps-tro{font-size:16px;letter-spacing:1px;margin:2px 0 3px;}
  .ps-tl{font-size:9.5px;color:var(--ink);display:flex;justify-content:space-between;gap:4px;}
  .ps-tl i{font-style:normal;color:var(--muted);}
  .ps-more{font-size:9px;color:var(--muted);}
  .ps-cap{display:flex;flex-wrap:wrap;gap:5px;padding:7px 9px;border-top:2px dashed #ece6ec;background:#fffdfe;}
  .ps-cap .pc{font-size:10px;color:#5b5360;background:#f4f0f5;border-radius:7px;padding:2px 7px;line-height:1.6;}
  .ps-cap .pc i{font-style:normal;color:#9a92a0;margin:0 4px;}
  .ps-cap .pc.you{background:var(--pink-soft);color:var(--pink);font-weight:800;}
  .ps-cap .pc.tall{background:#ffe6e2;color:#c0392b;font-weight:700;}
  .ps-cap .pc em{font-style:normal;margin-left:5px;color:#2e8b57;font-weight:700;}
  .ps-cap .pc em.shut{color:#a05252;}
  @media(max-width:760px){
    .ps-panel{width:120px;padding:4px 6px;} .ps-h{font-size:9.5px;} .ps-k{font-size:9px;}
    .ps-name b{font-size:12px;} .ps-name span{font-size:9px;}
  }
  .grow-watch{margin-top:8px;padding:7px 9px;border-radius:9px;background:var(--pink-soft);
    font-size:11px;line-height:1.7;color:#6a5f70;}
  .grow-watch b{color:#4a4250;}
  .grow-watch .gw-up{color:#c0392b;}
  .grow-watch .gw-dn{color:#2e8b57;}
  .season-story .sr-pow{font-size:10.5px;color:var(--muted);width:56px;text-align:right;}
  /* 剧情 / 高光 */
  .story{max-height:170px;overflow:auto;font-size:12.5px;}
  .story .e{padding:7px 0;border-bottom:1px dashed var(--line);}
  .story .e .y{color:var(--amber);font-weight:700;margin-right:6px;}
  .story .e .t{color:#5a5260;}
  .hl{font-size:12px;}
  .hl .e{padding:5px 0;border-bottom:1px dashed var(--line);color:#5a5260;}
  .hl .e .y{color:var(--green);font-weight:700;margin-right:6px;}
  .achv{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .achv .a, .achv-grp .a{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--muted);}
  .achv .a.on, .achv-grp .a.on{background:linear-gradient(90deg,#fbe6c8,#fbeaf0);border-color:var(--amber);color:var(--amber);font-weight:700;}
  .achv-grp{margin:8px 0 4px;}
  .achv-grp-h{font-size:11px;font-weight:800;margin-bottom:4px;letter-spacing:.5px;}
  .recap{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .recap .p{font-size:11.5px;background:var(--green);color:#fff;border-radius:8px;padding:2px 8px;font-weight:600;}
  .recap .none{font-size:12px;color:var(--muted);}
  /* 连携 meter */
  .flow{margin-top:8px;}
  .flow .lab{font-size:12px;color:var(--muted);margin-bottom:3px;}
  .flow .bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;}
  .flow .bar i{display:block;height:100%;background:linear-gradient(90deg,#6fae46,#3fb0a0);}
  /* 雷达 */
  .radar-box{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:14px;}
  /* banner / slump */
  .banner{background:var(--amber);color:#fff;border-radius:12px;padding:10px 14px;
    font-weight:700;margin-bottom:14px;text-align:center;}
  .banner.big{background:linear-gradient(90deg,#e8a02a,#e8609a);font-size:16px;}
  .banner.win{background:linear-gradient(90deg,#6fae46,#3fb0a0);}
  .slump{background:#fff1f0;border:1px solid #f3c9c9;color:#b04a4a;border-radius:12px;padding:9px 14px;
    font-weight:600;margin-bottom:14px;font-size:13px;}
  .overlay{position:fixed;inset:0;background:rgba(58,51,64,.5);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:#fff;border-radius:18px;padding:24px;max-width:560px;width:100%;}
  .modal h2{color:var(--amber);}
  .modal .who{font-size:12px;color:var(--muted);margin-bottom:6px;}
  /* 梦想宣言 modal（赛马娘式目标 / 梦工厂式志向） */
  .dream-modal .dream-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .dream-card{text-align:left;background:linear-gradient(135deg,#fff,#fbeaf0);border:1px solid #f3c9da;color:var(--text);padding:12px 14px;}
  .dream-card:hover{background:var(--pink);color:#fff;}
  .dream-card .dicon{font-size:22px;}
  .dream-card .dt{display:block;font-weight:800;font-size:14px;margin:2px 0;}
  .dream-card .dd{display:block;font-size:11.5px;opacity:.85;}
  .dream-card .dhint{display:block;font-size:11px;margin-top:4px;color:var(--muted);}
  .dream-card:hover .dhint{color:#fff;}
  @media(max-width:560px){.dream-modal .dream-grid{grid-template-columns:1fr;}}
  /* 才能开花（觉醒）modal */
  .modal.awake{background:linear-gradient(160deg,#fff7fb,#fff);border:2px solid var(--pink);box-shadow:0 0 0 4px rgba(232,96,154,.15),0 8px 30px rgba(232,96,154,.25);}
  .modal.awake h2{color:var(--pink);}
  .awake-tag{display:inline-block;background:linear-gradient(90deg,#e8609a,#e89a2a);color:#fff;font-weight:800;font-size:12px;padding:3px 12px;border-radius:20px;margin-bottom:8px;letter-spacing:1px;animation:awakePulse 1.4s ease-in-out infinite;}
  .modal.conflict{background:linear-gradient(160deg,#fff8f6,#fff);border:2px solid #e8605a;box-shadow:0 0 0 4px rgba(232,96,90,.14),0 8px 30px rgba(232,96,90,.22);}
  .modal.conflict h2{color:#d8453f;}
  .conflict-tag{display:inline-block;background:linear-gradient(90deg,#e8605a,#e89a2a);color:#fff;font-weight:800;font-size:12px;padding:3px 12px;border-radius:20px;margin-bottom:8px;letter-spacing:1px;animation:conflictShake 1.6s ease-in-out infinite;}
  @keyframes conflictShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  @keyframes awakePulse{0%,100%{transform:scale(1);opacity:.95;}50%{transform:scale(1.04);opacity:1;}}
  /* 羁绊面板新增 */
  .frd-note{font-size:11px;color:var(--muted);margin:-4px 0 6px 2px;}
  .flvl{font-size:10.5px;color:var(--pink);font-weight:700;}
  .aw-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .aw-chip{display:inline-block;background:linear-gradient(90deg,#fbeaf0,#fff3e6);border:1px solid #f3c9da;color:#b5537e;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;}
  .choice{display:block;width:100%;text-align:left;background:var(--blue-soft);color:var(--text);
    border:none;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14px;cursor:pointer;}
  .choice:hover{background:var(--blue);color:#fff;}
  .choice .hint{display:block;font-size:11.5px;opacity:.8;margin-top:3px;}
  .choice:hover .hint{opacity:.95;}
  /* 比赛 / 杯赛画面 */
  .match-screen{text-align:center;padding:8px;}
  .match-screen .mt{font-size:21px;font-weight:800;color:var(--pink);}
  .match-screen .mopp{color:var(--muted);font-size:13px;margin-bottom:10px;}
  .scoreboard{display:flex;justify-content:center;gap:30px;font-size:40px;font-weight:800;margin:14px 0;}
  .scoreboard .you{color:var(--pink);} .scoreboard .opp{color:var(--blue);}
  .qline{font-size:13px;color:#5a5260;margin:5px 0;text-align:left;max-width:380px;margin-left:auto;margin-right:auto;}
  .qline .q{color:var(--amber);font-weight:700;}
  .qline .win{color:var(--green);font-weight:700;} .qline .lose{color:var(--red);font-weight:700;}
  .result{font-size:28px;font-weight:800;margin:10px 0;}
  .result.win{color:var(--green);} .result.lose{color:var(--red);}
  .reward{background:var(--green);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;margin:10px 0;}
  .reward.lose{background:var(--blue);}
  .flex-end{display:flex;gap:10px;justify-content:center;margin-top:14px;}
  .muted{color:var(--muted);font-size:12px;}
  /* 联赛结果 */
  .league-tbl{font-size:12.5px;max-height:300px;overflow:auto;}
  .league-tbl .r{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px dashed var(--line);}
  .league-tbl .r.me{background:var(--pink-soft);font-weight:700;border-radius:8px;}
  .league-tbl .r .pos{width:28px;color:var(--muted);}
  .league-tbl .r .nm{flex:1;}
  .league-tbl .r .rec{width:70px;text-align:right;color:var(--muted);}
  .league-tbl .r .pts{width:46px;text-align:right;font-weight:600;}
  .ending{text-align:center;padding:30px;}
  .ending .et{font-size:30px;font-weight:800;color:var(--pink);margin:10px 0;}
  .ending .body{color:#5a5260;max-width:600px;margin:0 auto 18px;white-space:pre-line;}
  /* 赛前探敌 / 策略 / 赛果 / 技术统计 */
  .match-screen .strats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:520px;margin:0 auto;}
  @media(max-width:560px){.match-screen .strats{grid-template-columns:1fr;}}
  .strat{background:linear-gradient(135deg,#fff,#fbeaf0);border:1px solid #f3c9da;color:#33293a;}
  .strat .sn{font-weight:800;font-size:15px;}
  .strat:hover{background:var(--pink);color:#fff;}
  .strat.on{background:linear-gradient(135deg,#e8609a,#e89a2a);border-color:#e8609a;color:#fff;
            box-shadow:2px 2px 0 rgba(232,96,154,.35);transform:translate(-1px,-1px);}
  .strat.on .hint{opacity:.95;}
  .strat.on:hover{color:#fff;}
  .scout{background:var(--blue-soft);border-radius:12px;padding:10px 14px;margin:10px auto;max-width:520px;text-align:left;}
  .scout.me{background:var(--pink-soft);}
  .sc-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin:4px 0;}
  .sc-lab{color:var(--muted);}
  .sc-val{font-weight:700;}
  .sc-news{font-size:12px;margin-top:6px;color:#7a5a6a;font-weight:600;}
  .sc-news.warn{color:var(--red);}
  .tier{font-size:11px;font-weight:700;border-radius:8px;padding:2px 9px;}
  .tier.bad{background:var(--red);color:#fff;}
  .tier.good{background:var(--green);color:#fff;}
  .tier.mid{background:#d9c9a0;color:#5a4a2a;}
  .vs-line{color:var(--muted);font-size:13px;margin-bottom:6px;}
  .boxscore{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:0 auto;}
  .bx{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;}
  .bx .bv{display:block;font-size:20px;font-weight:800;color:var(--pink);}
  .bx .bl{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .comment{background:#fff7fb;border:1px dashed #f0c8d8;border-radius:10px;padding:9px 12px;margin:12px auto;max-width:520px;font-size:13px;color:#7a5a6a;text-align:left;}
  .seas-chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:14px auto;max-width:520px;}
  .seas-chart h3{font-size:13px;margin:2px 0 8px;text-align:center;color:#8a8390;}
  /* 三轴成长面板 */
  .axis-box h3{font-size:14px;margin:4px 0 8px;}
  .axrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px;}
  .axrow .axlab{width:36px;font-weight:700;color:var(--muted);}
  .axrow .axbar{flex:1;height:12px;background:var(--line);border-radius:6px;overflow:hidden;}
  .axrow .axbar i{display:block;height:100%;border-radius:6px;}
  .axrow .axval{width:34px;text-align:right;font-weight:700;font-size:12px;}
  .axfeed{margin-top:8px;font-size:11px;color:#9a7a8a;max-height:72px;overflow:auto;}
  .axfeed .e{padding:2px 0;border-bottom:1px dashed var(--line);}
  .axis-legend{display:flex;gap:12px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:4px;}
  .axis-legend b{font-weight:700;}
  /* 好友关系面板 */
  .frd-card h3{font-size:14px;margin:4px 0 8px;}
  .frd-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px;}
  .frd-row .fn{width:62px;font-weight:600;}
  .frd-row .fbar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;}
  .frd-row .fbar i{display:block;height:100%;background:linear-gradient(90deg,#e8609a,#e89a2a);}
  .frd-row .fv{width:30px;text-align:right;color:var(--muted);font-size:11px;}
  .frd-rel{font-size:11px;color:#8a6a78;margin-top:4px;}
  /* 结局三轴 */
  .end-axes{display:flex;gap:10px;justify-content:center;margin:10px 0;flex-wrap:wrap;}
  .end-axes .ea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:center;min-width:120px;}
  .end-axes .ea .en{font-size:12px;color:var(--muted);}
  .end-axes .ea .ev{font-size:22px;font-weight:800;}

  /* ===== 像素风增强 ===== */
  :root{
    --pink:#ff5d8f; --pink-soft:#ffe3ee; --blue:#3fa7e8; --blue-soft:#e2f2ff;
    --amber:#ff9b2f; --green:#46c46b; --red:#ff5d6c; --text:#33293a; --muted:#938aa0;
    --line:#f0e6ee; --bg:#fff6ec; --card:#ffffff; --ink:#2e2433; --wood:#caa06a;
  }
  body{
    background:#fff6ec;
    background-image:
      radial-gradient(#ffe6cf 1.5px, transparent 1.5px),
      repeating-linear-gradient(0deg, #fff6ec, #fff6ec 26px, #fdeedd 26px, #fdeedd 52px);
    background-size: 18px 18px, 100% 52px;
  }
  #app{max-width:1180px;}
  h1,h2{letter-spacing:.5px;}
  /* 像素按钮 */
  .btn{border:2.5px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);
    transition:transform .08s, box-shadow .08s, filter .15s;font-family:inherit;}
  .btn:hover{filter:brightness(1.06);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);}
  .btn.gold{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);}
  .btn.ghost{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);}
  /* 像素卡片描边 */
  .card{border:2.5px solid #ffd0e2;border-radius:12px;box-shadow:5px 5px 0 #ffeaf2;padding:16px;}
  .banner,.slump,.coach{border:2.5px solid var(--ink);box-shadow:3px 3px 0 rgba(46,36,51,.12);}
  .banner.win{border-color:#2c7a45;}
  .modal{border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(46,36,51,.15);border-radius:16px;}
  .choice{border:2.5px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 rgba(46,36,51,.12);}
  .choice:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  /* 选择卡像素化 */
  .tpl{border:2.5px solid #e7d8e3;border-radius:12px;box-shadow:3px 3px 0 #f3e9f0;}
  .tpl:hover{border-color:var(--blue);transform:translate(-1px,-1px);box-shadow:4px 4px 0 #bfe0f5;}
  .tpl.on{border-color:var(--pink);box-shadow:3px 3px 0 var(--pink);}
  .focus-row .fc{background:#241e29;color:#c9bcd0;border-color:#3a3340;}
  .focus-row .fc.on{background:var(--pink);color:#fff;border-color:var(--pink);}
  .act{border:2.5px solid #e7d8e3;border-radius:10px;box-shadow:3px 3px 0 #f3e9f0;}
  .act:hover{transform:translateY(-2px);box-shadow:3px 5px 0 #f3a9c4;}
  .act.combo{border-color:var(--green);box-shadow:3px 3px 0 #9bd6a3;}
  /* 像素进度条（硬边分段感） */
  .stat-row .bar,.axrow .axbar,.frd-row .fbar,.flow .bar{
    border:2px solid var(--ink);border-radius:0;background:#f3ecf2;image-rendering:pixelated;}
  .stat-row .bar i,.axrow .axbar i,.frd-row .fbar i,.flow .bar i{border-right:2px solid rgba(46,36,51,.22);}
  /* 标题屏像素风 */
  .title-wrap{border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 rgba(46,36,51,.1);
    background:linear-gradient(135deg,#fff,#ffeef5);}
  .title-wrap .big{font-size:42px;color:var(--pink);text-shadow:3px 3px 0 #ffd0e2, 6px 6px 0 rgba(46,36,51,.08);letter-spacing:2px;}
  /* 主界面头像像素立绘 */
  .avatar-box{border:2.5px solid #ffd0e2;box-shadow:4px 4px 0 #ffeaf2;}
  .px-portrait{font-size:44px;line-height:1.1;filter:drop-shadow(2px 2px 0 #ffd0e2);margin:2px 0;}
  /* 顶部条像素 */
  .topbar{border:2.5px solid #cfe6ff;box-shadow:4px 4px 0 #e2f0ff;border-radius:12px;}
  .rank-badge{border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(46,36,51,.12);}
  /* 像素比赛动画 */
  .court-wrap{position:relative;max-width:520px;margin:6px auto 12px;border:3px solid var(--ink);
    border-radius:10px;overflow:hidden;box-shadow:5px 5px 0 rgba(46,36,51,.12);background:#caa06a;}
  .pxcourt{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;}
  .court-score{position:absolute;top:5px;left:0;right:0;display:flex;justify-content:center;gap:16px;
    font-family:"Courier New",monospace;font-size:28px;font-weight:800;color:#fff;
    text-shadow:2px 2px 0 var(--ink);pointer-events:none;}
  .court-score .ys{color:#ffd6e6;} .court-score .os{color:#cfe9ff;} .court-score .sep{color:#fff;}
  .court-flag{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:11px;color:#fff;
    text-shadow:1px 1px 0 var(--ink);font-weight:700;}
  .score-pop{position:absolute;font-family:"Courier New",monospace;font-size:16px;font-weight:800;color:#fff;
    text-shadow:2px 2px 0 var(--ink);animation:pop 1s ease-out forwards;pointer-events:none;}
  @keyframes pop{0%{transform:translateY(0) scale(.6);opacity:0;}20%{opacity:1;transform:translateY(-6px) scale(1.1);}100%{transform:translateY(-26px) scale(1);opacity:0;}}
  .scoreboard.bump .you{animation:bump .4s ease;}
  .scoreboard.bump .opp{animation:bump .4s ease;}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  .result.win{animation:glow 1.4s ease-in-out infinite;}
  @keyframes glow{0%,100%{text-shadow:0 0 0 #fff;}50%{text-shadow:0 0 14px #9bf0ad;}}
  .comment{animation:fadein .45s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .axbar i{transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .fbar i{transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .pxdot{display:inline-block;width:6px;height:6px;background:var(--pink);box-shadow:8px 0 0 var(--blue),16px 0 0 var(--amber);margin:0 12px;vertical-align:middle;}
  .float{animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  /* 赛前双方阵容 */
  .roster-wrap{display:flex;gap:10px;margin:10px 0;}
  .roster{flex:1;border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;}
  .roster.me{border-color:#ffb3d1;}
  .roster.opp{border-color:#a9d4f5;}
  .roster .rh{font-weight:800;font-size:13px;margin-bottom:5px;color:#5a5260;display:flex;align-items:center;gap:6px;}
  .roster .rtag{font-size:10px;background:#fff3d6;color:#a9722a;border:1px solid #f0d49a;border-radius:6px;padding:1px 6px;font-weight:700;}
  .rrow{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0;border-bottom:1px dashed #eee;}
  .rrow .pos{width:34px;flex:none;font-size:10px;background:#eee;color:#666;border-radius:5px;text-align:center;padding:1px 0;}
  .rrow .pos.you{background:#ff5d8f;color:#fff;}
  .rrow .nm{flex:1;color:#5a5260;}
  .rrow .ovr{font-weight:800;color:#5aa0e0;font-size:12px;}
  .rrow.you .nm{color:#e0447f;font-weight:700;}
  .sc-row.sm{padding:1px 0;font-size:11px;}
  /* 选校界面 */
  .school-wrap .big{font-size:24px;}
  .scho-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;}
  .scho{border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;cursor:pointer;transition:transform .12s, box-shadow .12s, border-color .12s;text-align:center;}
  .scho:hover{transform:translateY(-3px);border-color:var(--pink);box-shadow:0 6px 0 rgba(229,96,154,.25);}
  .scho .sn{font-weight:800;font-size:12.5px;color:#5a5260;}
  .scho .st{font-size:11px;color:var(--pink);font-weight:700;margin:2px 0;}
  .scho .sd{font-size:10px;color:#908a96;line-height:1.25;min-height:26px;}
  .scho .stier{display:inline-block;margin-top:4px;font-size:10px;font-weight:800;border-radius:6px;padding:1px 7px;}
  .scho .tag{display:block;margin-top:4px;font-size:10px;color:#c0392b;}
  .scho.disabled{opacity:.55;cursor:not-allowed;background:#faf7f8;}
  .tier-group{margin:14px 0 4px;}
  .tier-h{font-size:13px;font-weight:800;padding:5px 10px;border-radius:8px;margin-bottom:8px;display:inline-block;}
  .tier-h.bad{background:#fdecef;color:#c0392b;border:1px solid #f3b6c2;}
  .tier-h.good{background:#eafaf0;color:#1e8e4f;border:1px solid #a9e2c2;}
  .tier-h.mid{background:#fff6e6;color:#b7791f;border:1px solid #f0d49a;}
  .scho .sstyle{font-size:10px;color:#3a6ea5;font-weight:700;margin:2px 0 1px;}
  .scho .srow{display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:4px;}
  .scho .sbase{font-size:9.5px;color:#8a8590;font-weight:700;}
  .scho .gtag{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 6px;line-height:1.4;}
  .scho .gtag.sleeper{background:#eaf0ff;color:#2b59c7;border:1px solid #b9c8f5;}
  .scho .gtag.riser{background:#eafaf0;color:#1e8e4f;border:1px solid #a9e2c2;}
  .scho .gtag.decliner{background:#fdecef;color:#c0392b;border:1px solid #f3b6c2;}
  .ostyle{font-size:11px;color:#3a6ea5;font-weight:700;margin:-2px 0 4px;padding-left:2px;}
  /* 多选养成卡片 */
  .act{position:relative;cursor:pointer;user-select:none;transition:transform .08s,box-shadow .12s;}
  .act:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.10);}
  .act.sel{outline:3px solid #e8609a;outline-offset:-3px;background:#fff2f7;}
  .act .pick-no{position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:#e8609a;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .choose-bar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:12px;}
  .choose-bar .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn.cprimary{background:#e8609a;color:#fff;border:none;}
  .btn.cprimary:hover{filter:brightness(1.06);}
  .btn.cghost{background:#fff;border:2px solid #e3d4df;color:#a06f8a;}
  .comp-ready{text-align:center;padding:18px 16px;margin-top:4px;background:linear-gradient(180deg,#fff,#f7fdff);border:2px dashed var(--blue);}
  .comp-ready h3{margin:0 0 6px;}
  .comp-ready .sub{margin:0 0 12px;color:#5a6b78;}
  .rest-row{margin-top:10px;}
  .choice.ghost{background:#fff;border:2px solid #cdd7de;color:#5a6b78;}
  .choice.ghost:hover{filter:brightness(.98);border-color:var(--blue);}
  .bg-grow{margin-top:7px;font-size:11px;color:#5a9a6f;line-height:1.5;background:#f3faf4;border-radius:8px;padding:4px 6px;}
  /* 体质档案（开局掷骰：成长资质 / 潜力上限 / 发育体质） */
  .tal-card{margin-top:8px;background:linear-gradient(180deg,#fdf7fb,#f7f2fa);border:1px solid #ecdcea;border-radius:10px;padding:7px 9px;}
  .tal-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;font-size:11px;line-height:1.6;}
  .tal-row b.late{color:#4e9a63;font-size:12px;}
  .tal-row b.early{color:#d08030;font-size:12px;}
  .tal-row .muted{color:#948c9c;}
  .tal-lab{font-size:11px;color:#8a8390;font-weight:700;min-width:52px;}
  .tal-card em{font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .tal-card em.up{background:#e9f6ec;color:#3f8a56;border:1px solid #cfe9d6;}
  .tal-card em.dn{background:#fdeef0;color:#b8566a;border:1px solid #f2d5db;}
  .tal-foot{font-size:10.5px;color:#9a92a2;line-height:1.55;border-top:1px dashed #ecdcea;padding-top:5px;margin-top:2px;}
  .tal-foot b{color:#7d6a8e;}
  .awards-row{display:flex;align-items:center;gap:8px;margin:8px 0 2px;flex-wrap:wrap;}
  .awards-lab{font-size:12px;color:#8a8390;font-weight:700;}
  .award-badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;}
  .award-badge.mvp{background:linear-gradient(90deg,#e8a02a,#e8609a);}
  .award-badge.imp{background:linear-gradient(90deg,#6fae46,#3fa0c0);}
  /* 身体数据网格 */
  .bio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0 4px;}
  .bio-grid .bg-cell{background:#fff;border:2px solid #f0e6ee;border-radius:8px;padding:3px 2px;text-align:center;}
  .bio-grid .bg-lab{display:block;font-size:10px;color:#938aa0;}
  .bio-grid .bg-val{display:block;font-size:12px;font-weight:800;color:#3a3340;}
  /* 更衣室动态 */
  .tm-line{font-size:12.5px;color:#5a5260;padding:5px 0;border-bottom:1px dashed var(--line);}
  .tm-line:last-child{border-bottom:none;}
  .tm-line .tm-pos{font-size:10px;background:#eee;color:#666;border-radius:5px;padding:1px 5px;margin-left:4px;}
  .tm-line .tm-rel{font-size:10px;font-weight:700;margin-left:6px;}
  .btn.ghost{background:#fff;color:var(--blue);border:2.5px solid var(--blue);box-shadow:3px 3px 0 rgba(63,167,232,.18);}
  .btn.ghost:hover{background:var(--blue);color:#fff;}
  /* 四节记分牌 */
  .qtable{display:grid;grid-template-columns:1.5fr repeat(5,1fr);gap:2px;margin:10px 0 4px;font-size:13px;text-align:center;}
  .qcol{padding:6px 2px;background:#f6f2f4;border-radius:4px;color:#6a6170;}
  .qcol.on{background:#fff0f5;color:#c0397a;font-weight:700;}
  .qcol.tot{background:#efe9ee;font-weight:700;color:#3a3340;}
  .qcol.qh{background:#f0eaf0;font-weight:700;color:#5a5260;}
  .run-line{text-align:center;font-weight:700;margin:8px 0;color:#5a5260;font-size:15px;}
  .qmoment{background:#fff7fb;border-left:3px solid #e8609a;padding:9px 11px;margin:8px 0 12px;border-radius:6px;font-size:14px;color:#5a3a4a;line-height:1.5;}
  .qadjust{background:#f3f8ff;border:1px solid #cfe0f5;border-radius:8px;padding:8px 10px;margin:6px 0 4px;}
  .qadjust-lab{font-size:12px;font-weight:700;color:#3a6ea5;margin-bottom:6px;}
  .btn.big{font-size:16px;padding:12px 20px;}

  /* ===== 成就解锁庆祝弹窗 ===== */

  .toast-silver{border-color:#9fb0c0;} .toast-silver .tr{background:#9fb0c0;}
  .toast-gold{border-color:#e8b32a;box-shadow:4px 4px 0 rgba(232,179,42,.25);} .toast-gold .tr{background:#e8b32a;}
  .toast-legend{border-color:#e8609a;box-shadow:4px 4px 0 rgba(232,96,154,.3);} .toast-legend .tr{background:#e8609a;}
  @keyframes toastIn{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:none;}}
  /* ===== 爽点庆祝弹窗（身高超越 / 实力质变 / 大胜）===== */
  .toast-fanfare{border-color:#e89a2a;box-shadow:4px 4px 0 rgba(232,154,42,.28);background:linear-gradient(135deg,#fff,#fff4e3);animation:fanIn .35s cubic-bezier(.2,.9,.2,1.2);}
  .toast-fanfare .ti{font-size:22px;animation:fanPop .5s ease;}
  .toast-fanfare .tt b{color:#b8650b;}
  .toast-fanfare .tr{background:linear-gradient(135deg,#e89a2a,#e8609a);font-size:11px;}
  .fan-height{border-color:#e8609a!important;box-shadow:4px 4px 0 rgba(232,96,154,.25)!important;background:linear-gradient(135deg,#fff,#ffeef6)!important;}
  .fan-height .tt b{color:#c2255c!important;}
  .fan-power{border-color:#6fae46!important;box-shadow:4px 4px 0 rgba(111,174,70,.25)!important;background:linear-gradient(135deg,#fff,#eefaf0)!important;}

  .fan-win .tt b{color:#b8650b!important;}
  @keyframes fanIn{from{opacity:0;transform:translateY(-16px) scale(.9);}to{opacity:1;transform:none;}}
  @keyframes fanPop{0%{transform:scale(.4) rotate(-12deg);}60%{transform:scale(1.25) rotate(8deg);}100%{transform:scale(1);}}
  /* 主界面：身高对决小标签 */
  .hduel{margin:4px 0 2px;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:9px;line-height:1.4;}

  @keyframes growPulse{0%{transform:scale(.7);opacity:.4;}60%{transform:scale(1.15);}100%{transform:scale(1);}}
  /* 宿敌卡：身高对比行 */
  .vs-row.ht-row{font-size:12.5px;color:#6a5f70;margin:3px 0;}

  /* ===== 主界面：生涯目标 / 双婷剧情线进度 ===== */

  /* ===== 移动端适配（窄屏 ≤600px） ===== */

  /* ============ 设置齿轮 + 设置层（优化界面 / 用户体验） ============ */
  .gear-btn{position:fixed;top:12px;right:12px;z-index:60;width:42px;height:42px;border-radius:50%;

  /* ===== 开局“成长天赋”拖动条（弱→强→怪物，直观呈现四种开局） ===== */

  .tm-info{flex:1;min-width:0;}

  .tm-pos{font-size:10px;font-weight:800;border-radius:5px;background:#eef2f7;color:#5b6b7c;padding:1px 5px;margin-left:4px;}

  .winprob{display:flex;flex-direction:column;gap:2px;margin:8px 0;}

  /* ===== 移动端专用：名册/阵容/队友行防溢出 + 弹层与触控适配 =====
     放在样式表末尾，确保在 max-width:600px 时覆盖前面的基础 .rrow/.ln-row 规则 */

<body>
<div id="toast"></div>
<div id="app"></div>
<script>
'use strict';
var $ = function(id){return document.getElementById(id);};
var clamp = function(v,a,b){return Math.max(a,Math.min(b,v));};
/* 体力上限：随年龄成长（12 岁约 60，18 岁成年达 100），训练可扩充，最大 140 */
function natCap(age){ return clamp(60 + (age-12)/6*40, 60, 100); }
function stamCap(){ return Math.min(140, natCap(G.age) + (G.stamCapBonus||0)); }
/* 训练随机系数：体力长期过低（低于上限 30% / 20%）时，成长等随机增益被压到 0.8~0.95（更低则 0.7~0.9） */
function growthRandom(){
  var ratio = G.stats.stamina / stamCap();
  if(ratio < 0.20) return 0.70 + rng()*0.20;   // 0.70~0.90
  if(ratio < 0.30) return 0.80 + rng()*0.15;   // 0.80~0.95
  return 1 + (rng()*0.70 - 0.30);              // 正常 0.70~1.40
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng = Math.random;
/* 正态分布（Box-Muller），用于 3σ 比分 */
function gauss(mean, sd){
  var u=0,v=0; while(u===0)u=rng(); while(v===0)v=rng();
  var n=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  return mean + n*sd;
}

/* ================= 主角开局天赋掷骰 =================
   三个职业各自有一份「基准」：BASE_STATS + tpl.mod（初始属性偏置）+ tpl.train（训练倍率）。
   每次开局都在这份基准上重新掷骰，让每一周目都是一个不同的 build：
   · 成长资质 apt[k]：基准 ±30%。掷完做「零和归一」——某项掷高，必有另一项掷低，
     全身资质预算恒定，永远不会出现"全项拉满"或"全项废柴"的开局。
   · 潜力上限 pot[k]：基准 ±30%，且与 apt **负相关**——长得快的天花板低、起步慢的后劲足。
     （pot 直接放大 dimRet 的边际递减阈值，即"这项属性能堆到多高"。）
   这一正一反两条线构成负反馈平衡：短期爽感与长期上限互相对冲，不同开局强度接近但手感迥异。
   · 体质抽签：初始身高 / 体重 / 骨龄全部随机，且**大概率**落在「中等偏上身高 + 晚发育体质」——
     骨龄落后同龄人却已经比同龄人高，意味着生长板闭合更晚、最终身高非常可观（本作主角的设定基调）。 */
var APT_KEYS = ['skill','stamina','strength','agility','pop','study','conf','height'];
var APT_LAB  = {skill:'技术',stamina:'体力',strength:'力量',agility:'敏捷',pop:'人气',study:'学习',conf:'自信',height:'身高'};
function rollTalent(tplKey, r){
  var tpl = TEMPLATES[tplKey] || TEMPLATES.guard;
  // ① 每项掷一个 -0.30 ~ +0.30 的资质偏移（正态，极端值稀有）
  var dev={}, sum=0;
  APT_KEYS.forEach(function(k){ var d=clamp(gaussR(r)*0.17, -0.30, 0.30); dev[k]=d; sum+=d; });
  // ② 零和归一：抹平总偏移 → "有得必有失"的反馈平衡
  var avg = sum/APT_KEYS.length, apt={}, pot={};
  APT_KEYS.forEach(function(k){
    apt[k] = clamp(1 + (dev[k]-avg), 0.70, 1.30);
    pot[k] = clamp(2 - apt[k] + gaussR(r)*0.06, 0.70, 1.30);   // ③ 潜力与资质负相关
  });
  // ④ 本职业的看家本领保底 0.88（后卫不至于手残、中锋不至于没力量），抬升额从其它项等额扣回
  var lift=0;
  for(var tk in tpl.train){ if(apt[tk]!=null && apt[tk]<0.88){ lift += 0.88-apt[tk]; apt[tk]=0.88; } }
  if(lift>0){
    var others = APT_KEYS.filter(function(k){ return !tpl.train[k]; });
    if(others.length) others.forEach(function(k){ apt[k]=clamp(apt[k]-lift/others.length, 0.70, 1.30); });
  }
  // ⑤ 体质抽签
  var tall = r() < 0.78;                                        // 78% 中等偏上身高
  var hRoll = tall ? (2.0 + Math.abs(gaussR(r))*3.6)            // 偏上：+2 ~ +9cm
                   : (gaussR(r)*2.6 - 1.4);                     // 其余：中位线上下
  var late  = r() < 0.72;                                       // 72% 晚发育体质
  var baLag = late ? -(0.8 + r()*1.5) : (r()*1.1 - 0.5);        // 骨龄落后 / 常规
  var growEnd = late ? (19.2 + r()*1.4) : (17.5 + r()*1.1);     // 生长板闭合骨龄
  var baRate  = late ? (0.72 + r()*0.16) : (0.92 + r()*0.22);   // 骨龄推进倍率（1 = 常人 0.25/季）
  if(late) pot.height = clamp(pot.height + 0.10 + r()*0.12, 0.70, 1.45);   // 晚发育 → 身高天花板更高
  var pt = rollPTrait(r);                                       // 主角也和全联盟共用同一套先天特征
  return {apt:apt, pot:pot, late:late, tall:tall,
          ptrait:pt.id, ptraitN:pt.n, ptraitTag:pt.tag,
          hRoll: Math.round(hRoll),
          baLag: Math.round(baLag*10)/10,
          growEnd: Math.round(growEnd*10)/10,
          baRate: Math.round(baRate*100)/100,
          wJit: 0.92 + r()*0.16};
}

function gaussR(r){

            roster: genRoster(nm, base, i+1, tr.id, isHigh), growth:'steady', target:base, gStart:0, gEnd:12};
  });

  // 婷婷的校队：强度挂钩其个人成长；作为头号宿敌锁定，玩家不可选（高于所有普通强队，不参与成长剧本）。
  // 固定落在“强队”档位（计为第 10 所强队），其余 9 所普通强队承接成长剧本，保证弱/中档配额不被占用。
  var strongIdx = [];
  schools.forEach(function(s,idx){ if(s.tier==='strong') strongIdx.push(idx); });
  var tingIdx = strongIdx[Math.floor(r()*strongIdx.length)];
  var tingBase = Math.round(430 + r()*120);
  schools[tingIdx] = {name:'实验中学·婷婷队', trait:'allround', traitN:'宿敌之师',
    base:tingBase, base0:tingBase, tier:'ace', growth:'ace', target:tingBase,
    gStart:(isHigh?12:0), gEnd:(isHigh?24:12), isTing:true,
    roster: genRoster('实验中学·婷婷队', 470, 99, 'allround', isHigh)};

  // 按档位分组，套用各档的成长剧本（随机分布到具体学校；婷婷已独立为 ace 档，不占普通强队配额）
  var byTier={strong:[],mid:[],weak:[],ace:[]};
  schools.forEach(function(s){ if(byTier[s.tier]) byTier[s.tier].push(s); });
  assignGrow(byTier.weak,   {sleeper:2, riser:3});   // 弱队：2 黑马 + 3 上升（余 5 留弱旅）
  assignGrow(byTier.strong, {decliner:3});            // 强队：3 掉队（余 6 留强队）
  assignGrow(byTier.mid,    {sleeper:2, decliner:5}); // 中游：2 黑马 + 5 掉队（余 5 留中游）

  // 球员个人成长剧本：在本学段 32 队中，随机涌现出“巨人中锋 / 顶级中锋 / 强力后卫 / 强力中锋”，
  // 其余球员按平均水准自然成长。每名球员都有 hTarget/ovrTarget 与成长窗口，逐季推进（见 applyPlayerGrowth）。
  PLAYER_EXPECT[isHigh?'high':'mid'] = assignPlayerArchetypes(schools, r);

  // 计算各队“终点战力” target（base 将在 postSeason 中由 base0 线性推进到 target）；
  // 同步把成长窗口与初始平均战力下发给每名球员（供“球星加成”与逐季成长使用）。
  schools.forEach(function(s){
    if(isHigh){ s.gStart=12; s.gEnd=24; } else { s.gStart=0; s.gEnd=12; }
    var tg = s.base0;
    if(s.tier==='weak'){
      if(s.growth==='sleeper') tg = Math.round(strongAvg*1.06);   // 黑马：终将超出强队平均水平
      else if(s.growth==='riser') tg = midAvg;                     // 上升：达到中游水平
    } else if(s.tier==='strong'){
      if(s.growth==='decliner') tg = midAvg;                       // 掉队：退为中游
    } else { // mid
      if(s.growth==='sleeper') tg = Math.round(strongAvg*1.12);    // 黑马：超过普通强队水平
      else if(s.growth==='decliner') tg = weakAvg;                 // 掉队：退为弱队
    }
    s.target = tg;
    // 球员成长窗口与所属球队一致；记录初始平均战力，用于“球星加成”（对手强度随队内球星水涨船高）
    var so=0;
    (s.roster||[]).forEach(function(p){ p.gStart=s.gStart; p.gEnd=s.gEnd; so+=p.ovr0; });
    s.rosterOvr0 = (s.roster&&s.roster.length)? so/s.roster.length : 50;
  });

  return schools;
}
/* 球员个人成长剧本：在 32 队里随机分配“巨人中锋 / 顶级中锋 / 强力后卫 / 强力中锋”，其余平均成长。
   计数随种子在以下区间随机：高个大中锋 3~15、顶级中锋 0~5、强力后卫 4~12、强力中锋 3~15。
   身高目标：高个>2.0m、顶级>2.1m；强力后卫/中锋为战力（ovr）突出。其余球员自然小幅成长。 */
function assignPlayerArchetypes(schools, r){
  var all=[];
  schools.forEach(function(s){ (s.roster||[]).forEach(function(p){ all.push(p); }); });
  var centers = all.filter(function(p){ return p.pos==='中锋'; });
  var guards  = all.filter(function(p){ return p.pos==='后卫'; });
  // 从候选池里随机抽出 n 名并打上成长标签（抽出即从池中移除，避免重复）
  function take(pool, n, set){
    n=Math.min(n, pool.length);
    for(var k=0;k<n;k++){ var idx=Math.floor(r()*pool.length); var p=pool.splice(idx,1)[0]; set(p); }
  }
  /* —— 晚发育个体：全联盟随机 5~10% ——
     她们的生长板在整个学段里都不会闭合，从入学到毕业「一直在有效增长」：
     骨龄推进只有常人的一半，发育曲线接近匀速且高峰后移。
     入学时骨龄落后同龄人 1~2 岁 → 身高、体格、战力的**初始值都明显低于同位置平均**，
     常被当成"没长开的小个子"埋没在替补席；却因为长得久，往往在最后几个赛季完成反超。 */
  // 先给全员掷「早熟 / 普通」并据此校准骨龄增速：
  //   早熟者初二（第 4~7 季）生长板就闭合、身高从此停摆；普通者初三到高二之间陆续长完。
  var seg = (schools[0] && schools[0].gStart>=12) ? 'high' : 'mid';
  var season0 = (seg==='high')?12:0;
  all.forEach(function(p){ rollMaturity(p, r, seg); calibrateBone(p, season0); });

  var nLate = Math.round(all.length * (0.05 + r()*0.05));
  var latePool = all.slice();
  for(var li=0; li<nLate && latePool.length; li++){
    var lp = latePool.splice(Math.floor(r()*latePool.length), 1)[0];
    lp.lateBloom = true;
    lp.matType = 'late';
    lp.closeSeason = 25 + Math.floor(r()*4);   // 读到高三毕业都还没长完
    // ① 骨龄落后同龄人 0.9~2.1 岁（这才是"晚发育"的根因）
    var baLag = 0.9 + r()*1.2;
    lp.boneAge0 = lp.boneAge0 - baLag;
    lp.boneAge  = lp.boneAge0;
    // ② 起始身高偏矮：骨龄每落后 1 岁 ≈ 矮 3.4cm，另加个体差
    var hDrop = Math.round(baLag*3.4 + r()*3);       // 约 -4 ~ -10cm
    lp.hDrop  = hDrop;  lp.hPre = lp.h0;             // hPre/oPre：未被压低前的"同龄人水准"，供发育播报对照
    lp.height = lp.h0 = lp.hF = lp.h0 - hDrop;
    var nlg   = Math.round(lp.h0 * lp.legRatio);
    lp.legs   = lp.legs0 = lp.legF = nlg;            // 腿长同步缩回
    // ③ 起始战力偏低：身板没长开，对抗、护框、终结全都吃亏
    var oDrop = Math.round(2 + hDrop*0.55 + r()*3);  // 约 -4 ~ -10
    lp.oDrop  = oDrop;  lp.oPre = lp.ovr0;
    lp.ovr    = lp.ovr0 = Math.max(15, lp.ovr0 - oDrop);
    if(lp.ovrF!=null) lp.ovrF = lp.ovr0;
    // ④ 发育节奏：骨龄推进慢一大截、高峰后移、曲线接近匀速 → 高三读完仍在长
    calibrateBone(lp, season0);                      // closeSeason>23 → 骨龄推得极慢
    lp.baClose = lp.boneAge0 + 99;                   // 在校期间永不闭合
    lp.spurtM  = 0.46 + r()*0.26;
    lp.spurtK  = 1.0  + r()*0.5;
  }
  // 数量只是“预计水平”，按正态抽样；而且这只是赛季初的“预计”——
  // 最终真正长到该水平的人数，还要由后面十几个赛季的促进/抑制因素决定（可能更多，也可能更少）
  var nTall = aroundN(r, 3, 15);   // 预计：高个大中锋（成年身高潜能均值 2.03m 上下）
  var nTop  = aroundN(r, 0,  5);   // 预计：顶级中锋（成年身高潜能均值 2.13m 上下）
  var nSG   = aroundN(r, 4, 12);   // 预计：强力后卫
  var nSC   = aroundN(r, 3, 15);   // 预计：强力中锋
  // 遗传身高潜能 hPot0 = “如果发育顺利，预计能长到的成年身高”。给定的 2.0m / 2.1m 只是均值；
  // 早熟（骨龄增速快）者潜能略打折、晚熟者略上浮——早长早停、晚长后发。
  function hGoal(p, mean, sd){
    return Math.round(mean + gaussR(r)*sd + (0.25 - p.baRate)*28);
  }
  // 预计战力 = 该剧本的平均水准 + 个体天赋的适度加权（天赋越好上限越高）+ 正态随机（不封顶）
  function ovrGoal(p, mean){ return Math.round(Math.max(p.ovr0+6, mean + (p.ovr0-60)*0.3 + gaussR(r)*7)); }
  take(centers, nTall, function(p){ p.pgrowth='tallC';  p.hPot0=hGoal(p,203,4.5); p.ovrTarget=ovrGoal(p,86); });
  take(centers, nSC,   function(p){ p.pgrowth='strongC';p.hPot0=hGoal(p,190,5);   p.ovrTarget=ovrGoal(p,89); });
  take(centers, nTop,  function(p){ p.pgrowth='topC';   p.hPot0=hGoal(p,213,4.5); p.ovrTarget=ovrGoal(p,93); });
  take(guards,  nSG,   function(p){ p.pgrowth='strongG';p.hPot0=Math.round(p.h0+6+gaussR(r)*4); p.ovrTarget=ovrGoal(p,89); });
  // 其余（含前锋与未被选中的中锋/后卫）保持 avg：按平均水平自然生长，同样带个体随机
  all.forEach(function(p){
    if(p.pgrowth==='avg'){
      // 发育类型直接决定还剩多少身高空间：早熟者(baRate 大)几乎已经长完，晚熟者空间更大
      p.hPot0     = Math.round(p.h0 + 9 + gaussR(r)*5 + (0.25 - p.baRate)*20);
      p.ovrTarget = Math.round(Math.max(p.ovr0, p.ovr0 + 6 + gaussR(r)*4));
    }
    // 先天特征的终点战力偏移：黑马低开高走，天才/技术型上限更高
    var pt0 = PTRAIT_BY[p.ptrait];
    if(pt0) p.ovrTarget = Math.round(p.ovrTarget + pt0.tgtD[0] + r()*(pt0.tgtD[1]-pt0.tgtD[0]));
    /* 晚发育者：起点被压低了，但生长窗口比别人长一大截 ——
       ① 把入学时"欠"的身高全额补回（相对目标的剧本才需要补，绝对目标如 tallC/topC 本身就是终点值）
       ② 再额外上浮 5~13cm / 3~9 战力：这才是她们后来居上、反超同批的本钱 */
    if(p.lateBloom){
      // 相对目标（avg / strongG）：先把入学时"欠"的补回，再额外上浮 2~8cm；
      // 绝对目标（tallC / topC / strongC 的终点身高本就是定值）：起点低本身已放大生长空间，只再微调 1~4cm
      var relTarget = (p.pgrowth==='avg' || p.pgrowth==='strongG');
      p.hPot0     += relTarget ? ((p.hDrop||0) + 2 + Math.round(r()*6)) : (1 + Math.round(r()*3));
      p.ovrTarget  = Math.round(p.ovrTarget + (p.oDrop||0) + 2 + r()*5);
    }
    // 潜能不设硬上限，但保证不缩水；hTarget 作为“赛季初预计成年身高”供界面展示
    if(p.hPot0 < p.h0+1) p.hPot0 = p.h0+1;
    p.hTarget = p.hPot0;
    p.legsTarget = Math.round(p.hPot0 * clamp(p.legRatio1!=null?p.legRatio1:p.legRatio, 0.42, 0.56));
    // 青春期腿部先于躯干拔节：腿长增幅至少占身高增幅的 35%（比例只是平均，个体仍可更长）
    var minLeg = p.legs0 + Math.max(1, Math.round((p.hPot0-p.h0)*0.35));
    if(p.legsTarget < minLeg) p.legsTarget = minLeg;
    // 每 1cm 身高增长带动的腿长增长（青春期腿先拔节）
    p.legShare = clamp((p.legsTarget-p.legs0)/Math.max(1,(p.hPot0-p.h0)), 0.30, 0.62);
  });
  return {tallC:nTall, topC:nTop, strongG:nSG, strongC:nSC};
}
/* 各校“成长剧本”：每季把 base 从 base0 线性推进到 target（仅当前学段的学校在对应窗口内生长，
   另一学段学校窗口未到 → 进度 0 保持初始；窗口过后进度封顶 1 保持终点战力）。
   由于 oppEff / computeRank / leagueHTML 都直接读 t.base，联赛排名、对手强度、榜单会随之自然变化。 */
function applySchoolGrowth(season){
  function grow(arr){
    if(!arr) return;
    for(var i=0;i<arr.length;i++){
      var s=arr[i];
      s.prevBase = s.base;   // 记录本季更新前的战力，供“本季风云/趋势箭头”显示
      if(s.growth==='ace'){ s.base=s.base0; continue; }
      var span=(s.gEnd - s.gStart)||1;
      var p=clamp((season - s.gStart)/span, 0, 1);
      s.base=Math.round(s.base0 + (s.target - s.base0)*p);
    }
  }
  grow(G.allMid); grow(G.allHigh);
}
/* 本季“战力风云”：挑出本季战力变动最大的崛起队/掉队队，让联赛格局的演变可见可感 */
function computeSeasonStory(){
  var arr = (isHigh()? G.allHigh : G.allMid) || [];
  var movers = arr.filter(function(s){ return s.growth!=='ace' && (s.base - (s.prevBase!=null?s.prevBase:s.base))!==0; });
  movers.forEach(function(s){ s._delta = s.base - (s.prevBase!=null?s.prevBase:s.base); });
  movers.sort(function(a,b){ return Math.abs(b._delta) - Math.abs(a._delta); });
  var risers = movers.filter(function(s){ return s._delta>0; }).slice(0,2);
  var fallers = movers.filter(function(s){ return s._delta<0; }).slice(0,2);
  G.seasonStory = {risers:risers, fallers:fallers};
  if(risers.length || fallers.length){
    var parts=[];
    risers.forEach(function(s){ parts.push('🔥 '+s.name+' 崛起 +'+s._delta); });
    fallers.forEach(function(s){ parts.push('📉 '+s.name+' 掉队 '+s._delta); });
    addHighlight('📊 本季战力风云：'+parts.join('，'));
  }
}
/* 球员个人成长：每季把每名球员的 ovr/height 从初始值线性推进到目标值（hTarget/ovrTarget）。
   - 联盟各队（对手）按所属球队成长窗口推进（mul=1）；
   - 你所在的校队队友额外受“战绩激励”加成：战绩越好，队友涨得越快（mul=战绩激励系数），
     且每名队友有随机的基础成长速率（mateVar），体现“本身有随机的基础成长”。 */
function recordIncentive(){
  var cs=G.careerStats||{w:0,l:0}; var tot=cs.w+cs.l;
  var wr = tot>0 ? cs.w/tot : 0.5;          // 生涯胜率
  return clamp(0.8 + wr*0.55, 0.8, 1.35);   // 胜率 50%→1.075，90%→1.295，10%→0.855
}
/* 本季的“成长促进 / 抑制因素”合力：
   赛季初给出的“预计涌现人数”只是期望值，真正长成什么样由这些因素逐季累积决定——
   打上比赛、赢球、球队上升期、天赋好、运气佳的人会不断上修潜能（少数优势高度集中者可逼近 2.3m）；
   反之出场少、球队溃败、伤病营养不良的人会被下修，连“预计的高个”也可能长不到 2 米。
   ctx = {rec:战绩激励, team:球队势头(-1~1), load:出场负荷(0~1.4 以 1 为常规), rnd:随机源} */
function growthFactors(p, ctx){
  var r = ctx.rnd || rng;
  var f = 0;
  f += (ctx.rec  - 1.0) * 0.90;   // 战绩激励：赢球带来自信、资源与更高强度的训练
  f += (ctx.team       ) * 0.34;  // 球队势头：崛起之师水涨船高，掉队球队人心涣散
  f += (ctx.load - 1.0) * 0.42;   // 出场负荷：比赛打得多才长得快，坐冷板凳则停滞
  if(ctx.load > 1.25) f -= (ctx.load-1.25)*1.1;   // 但超负荷会透支身体，反而抑制发育
  f += (p.talentG||0);            // 个体天赋成长偏置（有人怎么练都长，有人补什么都不长）
  f += (r()*0.30 - 0.15);         // 本季随机：营养 / 伤病 / 作息 / 意外
  p.growF = f; p.growFSum = (p.growFSum||0) + f;
  return {
    // 潜能修正：促进因素持续集中的人，预计身高被逐季上修（累积有界，极端者约 +28%）
    pot: clamp(1 + f*0.052, 0.958, 1.062),
    ovr: clamp(1 + f*0.060, 0.950, 1.075),
    // 骨龄推进修正：高强度对抗会略微加速骨成熟（早熟早停），休养充足则放缓（长得更久）
    mat: clamp(1 + (ctx.load-1)*0.13 - f*0.05, 0.84, 1.20),
    // 本季生长速度扰动：有人这一年猛窜一截，有人原地踏步
    vel: clamp(1 + f*0.34, 0.45, 1.75),
    f: f
  };
}
/* 骨龄驱动的个人发育：每季先推进骨龄，再由骨龄换算“成年身高已兑现的比例”。
   生长板闭合（骨龄到 baClose）后完全停长——最终身高不设硬上限，由骨龄走势自然封顶。 */
function growPlayer(p, season, ctx){
  if(p.boneAge==null) return;
  p.prevOvr = p.ovr; p.prevH = p.height; p.prevLegs = p.legs; p.prevBA = p.boneAge;
  p.prevClosed = p.closed;   // 上季末是否已闭合（闭合满一季后必须完全停长）
  var f = growthFactors(p, ctx);
  // ① 促进/抑制因素累积改写“预计成年身高”（这就是实际人数与预计不一致的根源）
  p.potMul = clamp((p.potMul||1) * f.pot, 0.74, 1.28);
  p.ovrMul = clamp((p.ovrMul||1) * f.ovr, 0.78, 1.34);
  // ② 骨龄推进（生长板闭合后不再推进，避免骨龄无上限累加；闭合事件由 baClose 锁定）
  p.boneAge += p.baRate * f.mat;
  if(p.baClose!=null && p.boneAge > p.baClose) p.boneAge = p.baClose;
  // ③ 骨龄 → 已兑现的身高比例（个体发育节奏曲线：早长 / 晚长走势不同）
  var raw = clamp((p.boneAge - p.boneAge0)/(p.baFull||2.4), 0, 1);
  var prog;
  if(p.lateBloom){
    /* 晚发育个体：生长板全程不闭合。改用“学段进度”驱动、略微后段加速的匀速生长，
       保证从入学到毕业每一季都有实打实的增量，不会像常人那样中途长满就停摆。 */
    var lspan = (p.gEnd - p.gStart)||1;
    var lp2 = clamp((season - p.gStart)/lspan, 0, 1);
    prog = lp2*0.55 + Math.pow(lp2, 1.55)*0.45;
    if(raw > 0.985) raw = 0.985;
  } else {
    prog = sCurve(raw, p.spurtM!=null?p.spurtM:0.5, p.spurtK!=null?p.spurtK:2);
  }
  var boost = ctx.boost || 1;                      // 黑马队红利 × 类型适应性 × 特征成长倾向
  var d = prog - (p._hProg||0);
  if(d>0 && p.boneAge < p.baClose){
    var room = (p.hPot0 - p.h0) * p.potMul;        // 潜能空间随促进因素放大/收缩
    var gain = room * d * f.vel * boost;
    p.hF = (p.hF!=null?p.hF:p.h0) + gain;
    p.legF = (p.legF!=null?p.legF:p.legs0) + gain*(p.legShare||0.45);
    p._hProg = prog;
  }
  p.closed = !p.lateBloom && ((p.boneAge >= p.baClose) || raw>=0.999);   // 晚发育者全程不闭合
  p.height = Math.round(p.hF!=null?p.hF:p.h0);
  p.legs   = Math.round(p.legF!=null?p.legF:p.legs0);
  // 多维身体属性随本季身高增量同步生长（体重、臂展、鞋码），保持与身高一致
  var _dH = (p.height!=null && p.prevH!=null) ? (p.height - p.prevH) : 0;
  if(_dH > 0){
    if(p.weight!=null) p.weight = Math.round(clamp(p.weight + _dH*0.34*(p.ptrait==='power'?1.2:1), 42, 92));
    if(p.reach!=null)  p.reach  = Math.round(p.reach + _dH*0.95 + (p.ptrait==='power'?0.3:0));
    if(p.shoe!=null)   p.shoe   = Math.round(clamp(p.shoe + _dH*0.05, 33, 47));
  }
  // ④ 战力：技术打磨按赛季推进（生长板闭合后仍可继续变强），再叠加“长个红利”
  var sspan=(p.gEnd-p.gStart)||1;
  var sraw=clamp((season-p.gStart)/sspan, 0, 1);
  var sprog=sCurve(sraw, clamp((p.spurtM!=null?p.spurtM:0.5)-0.06,0.08,0.92), (p.spurtK!=null?p.spurtK:2)*0.9);
  var od = sprog - (p._oProg||0);
  if(od>0){
    p.ovrF = (p.ovrF!=null?p.ovrF:p.ovr0) + (p.ovrTarget-p.ovr0)*p.ovrMul*od*f.vel*boost;
    p._oProg = sprog;
  }
  var hBonus = clamp((p.height - p.hPot0)*0.45, -7, 14);   // 长得超出/不及预期，直接反映在实战强度上
  p.ovr = Math.round(Math.max(12, (p.ovrF!=null?p.ovrF:p.ovr0) + hBonus));
}
/* 球员本季的「额外成长加成」boost：
   ① 黑马队红利：所在球队成长剧本为 sleeper（黑马）时，队员属性增长额外 +3~10%
      —— 每人首次进入黑马队时掷一次并固定下来，换队后重掷（体现"这支队伍的上升气流"）
   ② 类型适应性：先天特征与所在【高中】特性契合时，额外 +3~5%
      （速度型进青训基地、力量型进体育特长、技术型进进攻名校、天才进全能体校…）
   ③ 特征自带成长倾向 gm（天才 1.10、学霸 0.98，其余 1.00） */
function playerBoost(p, school, season){
  var b = 1;
  if(school && school.growth==='sleeper'){
    if(p.sleeperMul==null) p.sleeperMul = 1.03 + rng()*0.07;   // 3%~10%
    b *= p.sleeperMul;
  } else if(p.sleeperMul!=null && school && school.growth!=='sleeper'){
    p.sleeperMul = null;                                        // 离开黑马队即失去红利
  }
  if(school && school.trait && season>=12){                     // 适应性成长只在高中段生效
    if(p._fitFor !== school.trait){ p._fitFor = school.trait; p.fitMul = fitMulOf(p.ptrait, school.trait, rng); }
    b *= (p.fitMul||1);
  }
  var pt = PTRAIT_BY[p.ptrait];
  if(pt) b *= (pt.gm||1);
  return b;
}
/* 球队势头：成长剧本决定球员所处环境是上升期还是溃败期（黑马队队员被激励，掉队队队员被拖累） */
function teamMomentum(s){
  if(!s || s.growth==='ace') return 0.25;
  var d = (s.target - s.base0) / Math.max(60, Math.abs(s.base0));
  return clamp(d*1.6, -1, 1);
}
function applyPlayerGrowth(season){
  function growRoster(arr){
    if(!arr) return;
    arr.forEach(function(s){
      // 只有“本学段在读”的球员才发育：另一学段的球员尚未入学 / 已经毕业，骨龄不推进
      if(season <= s.gStart || season > s.gEnd) return;
      var mom = teamMomentum(s);
      (s.roster||[]).forEach(function(p, i){
        // 对手球员：轮换里位置越靠前打得越多（出场负荷），并叠加球队战绩/势头
        var load = clamp(1.18 - i*0.055 + (p.talent||0)/160, 0.55, 1.30);
        growPlayer(p, season, {rec: 1 + mom*0.16, team: mom, load: load, rnd: rng, boost: playerBoost(p, s, season)});
        growStamina(p);
      });
    });
  }
  growRoster(G.allMid); growRoster(G.allHigh);     // 对手阵容逐季成长
  if(G.teammates && G.teammates.length){            // 你校队友：战绩激励 + 出场负荷 + 各自随机基础成长
    var rec = recordIncentive();
    var pool = (isHigh()? G.allHigh : G.allMid) || [];
    var my  = pool.filter(function(t){ return t.name===G.school; })[0];
    var mom = my ? teamMomentum(my) : 0;
    G.teammates.forEach(function(p, i){
      if(season <= p.gStart || season > p.gEnd) return;
      // 你上场时间越长，队友分到的球权/出场就越少（此消彼长），但赢球会整体抬升
      var mine = clamp((G.minutes||30)/40, 0.3, 1);
      var load = clamp((1.22 - i*0.05) * (1.12 - mine*0.22) * (p.mateVar||1), 0.5, 1.35);
      if(season===p.gStart) p.stam = p.stamMax;   // 升段首季体力补满
      growPlayer(p, season, {rec: rec, team: mom, load: load, rnd: rng, boost: playerBoost(p, my, season)});
      growStamina(p);
    });
  }
}
/* 统计本学段“实际长成”的人数，与赛季初的“预计人数”对照（体现促进/抑制因素带来的偏差） */
function actualArchetypeCount(){
  var arr = (isHigh()? G.allHigh : G.allMid) || [];
  var c = {over200:0, over210:0, over225:0, strong:0, closed:0, total:0};
  arr.forEach(function(s){ (s.roster||[]).forEach(function(p){
    c.total++;
    if(p.height>=200) c.over200++;
    if(p.height>=210) c.over210++;
    if(p.height>=225) c.over225++;
    if(p.ovr>=85) c.strong++;
    if(p.closed) c.closed++;
  }); });
  return c;
}
/* 对手“球星加成”：队内球员平均战力相对初始的提升，会水涨船高地带高该队实战强度。
   赛季初增量为 0，不干扰既有的学校成长剧本，只在球员成长过程中逐步叠加。 */
function rosterBonus(t){
  if(!t.roster || !t.roster.length) return 0;
  var s=0; for(var i=0;i<t.roster.length;i++) s+=t.roster[i].ovr;
  var avg=s/t.roster.length;
  var d=avg-(t.rosterOvr0!=null?t.rosterOvr0:avg);
  return d*1.5;
}
/* ===================== 初中 → 高中：队友随机进级 =====================
   高中不再凭空生成一批新人，而是由「初中这批人」升上来的：
     ① 汇总全部 32 所初中的在校球员（你自己校队用 G.teammates 那份带成长/关系的数据）
     ② 战力最低的 30 人被淘汰 —— 没能继续打球，从此消失在联赛里
     ③ 其余按「实力档 + 强随机扰动」分流进 31 所高中（婷婷队原班人马直升，宿敌关系延续）
     ④ 再插入 20~40 名国际学生，打乱原有格局
     ⑤ 每人按高中段重新基线化：保留骨龄 / 发育类型 / 先天特征
        → 早熟型在初二就闭合了生长板，升上高中身高基本停摆，只能靠技术涨战力
        → 晚熟型骨龄还差一大截，整个高三都还在长，往往在这三年完成惊人反超 */
var CUT_COUNT = 30;   // 初中段末位淘汰人数
/* 高中段重新基线化：把当前身高/战力设为新起点，并按「剩余发育窗口」重算这三年还能长多少 */
function rebaseForHigh(p, r){
  p.gStart = 12; p.gEnd = 24;
  // —— 身高：剩余空间完全由发育类型决定 ——
  p.h0 = p.height; p.hF = p.height; p._hProg = 0;
  p.legs0 = p.legs; p.legF = p.legs;
  p.boneAge0 = p.boneAge;
  var remain = Math.max(0, (p.closeSeason!=null?p.closeSeason:12) - 12);   // 高中段还剩几季发育窗口
  var room;
  if(p.matType==='late')      room = 7 + r()*8;              // 晚熟：高中三年还能长 7~15cm
  else if(remain>0)           room = remain*0.85 + r()*3;    // 普通：按剩余窗口折算
  else                        room = 0;                       // 早熟：初二就长完了
  p.hPot0 = p.height + room;
  p.hTarget = Math.round(p.hPot0);
  if(p.matType==='late'){ p.baClose = p.boneAge0 + 99; p.baFull = clamp(2.6 + r()*0.8, 1.0, 5.0); p.baRate = clamp((p.baFull+0.25)/14, 0.035, 0.95); }
  else { p.baFull = clamp(p.baClose - p.boneAge0, 0.05, 6); }
  // —— 战力：技术打磨在高中继续，发育类型 / 先天特征决定还能涨多少 ——
  p.ovr0 = p.ovr; p.ovrF = p.ovr; p._oProg = 0; p.potMul = 1; p.ovrMul = 1;
  p.growF = 0; p.growFSum = 0;
  var up = 5 + (p.talent||0)*0.14 + r()*6;
  if(p.matType==='late')  up += 6 + r()*7;     // 晚熟：高中才真正长开，涨幅最猛
  if(p.matType==='early') up -= 1 + r()*2;     // 早熟：身体红利吃完了，只剩技术
  if(p.ptrait==='genius') up += 6 + r()*6;
  if(p.ptrait==='horse')  up += 6 + r()*9;     // 黑马：三年后判若两人
  p.ovrTarget = Math.round(p.ovr0 + Math.max(2, up) + room*0.5);
  // —— 腿长随身高同步 ——
  p.legsTarget = Math.round(p.hPot0 * clamp(p.legRatio1!=null?p.legRatio1:(p.legRatio||0.48), 0.42, 0.56));
  var minLeg = p.legs0 + Math.max(0, Math.round(room*0.35));
  if(p.legsTarget < minLeg) p.legsTarget = minLeg;
  p.legShare = clamp((p.legsTarget-p.legs0)/Math.max(1, room), 0.30, 0.62);
  p.spurtM = clamp((p.spurtM!=null?p.spurtM:0.5) - 0.05 + r()*0.1, 0.15, 0.85);
  p.closed = (p.matType!=='late') && (p.boneAge >= p.baClose);
  p._fitFor = null; p.fitMul = 1; p.sleeperMul = null;   // 换了学校 → 适应性与黑马红利重算
  p.prevOvr = null; p.prevH = null; p.prevLegs = null; p.prevBA = null;
  return p;
}
/* 生成一名国际学生（高一插班）：整体比本土同龄人更成熟、身体条件更极端，技术风格也更两极 */
function genIntlPlayer(r, idx){
  var nm = INTL_NAMES[Math.floor(r()*INTL_NAMES.length)];
  var q = r();
  var pos = q<0.32? '后卫' : (q<0.66? '前锋' : '中锋');
  var h = Math.round((pos==='中锋'?191:pos==='前锋'?183:176) + gaussR(r)*6.5);   // 比本土高一截
  var talent = gaussR(r)*11 + 4;
  var pt = rollPTrait(r);
  var ovr = Math.round(Math.max(20, 52 + r()*16 + talent + (pt.ovrD[0] + r()*(pt.ovrD[1]-pt.ovrD[0]))));
  var lr = 0.470 + r()*0.065;                                   // 腿长占比整体更高
  var lg = Math.round(h*lr);
  var ba0 = 15.4 + gaussR(r)*1.0;
  var p = {
    uid:'I'+idx+'-'+Math.floor(r()*1e6).toString(36), intl:true, natio:nm.c,
    ptrait:pt.id, ptraitN:pt.n, ptraitTag:pt.tag, ptraitD:0,
    name:nm.n, pos:pos, ovr:ovr, ovr0:ovr, height:h, h0:h, hF:h,
    legs:lg, legs0:lg, legF:lg, legRatio:lr, legRatio1:lr+gaussR(r)*0.012,
    boneAge:ba0, boneAge0:ba0, baFull:clamp(2.6+gaussR(r)*0.6,1.0,5.0), closed:false,
    potMul:1, ovrMul:1, growF:0, growFSum:0,
    talent:Math.round(talent), pgrowth:'avg',
    talentG: clamp(talent/90 + gaussR(r)*0.05, -0.16, 0.22),
    spurtM: 0.30 + r()*0.42, spurtK: 1.2 + r()*1.9,
    mateVar: 0.85 + r()*0.30, gStart:12, gEnd:24, _hProg:0, _oProg:0
  };
  rollMaturity(p, r, 'high');
  if(r() < 0.08){ p.matType='late'; p.lateBloom=true; p.closeSeason = 25 + Math.floor(r()*4); }
  calibrateBone(p, 12);
  if(p.lateBloom) p.baClose = p.boneAge0 + 99;
  var remain = Math.max(0, p.closeSeason - 12);
  var room = p.lateBloom ? (8 + r()*8) : (remain>0 ? remain*0.9 + r()*3 : 0);
  p.hPot0 = h + room; p.hTarget = Math.round(p.hPot0);
  var pt0 = PTRAIT_BY[p.ptrait];
  p.ovrTarget = Math.round(ovr + 6 + talent*0.16 + r()*7 + room*0.5 + (pt0? pt0.tgtD[0]+r()*(pt0.tgtD[1]-pt0.tgtD[0]) : 0));
  p.legsTarget = Math.round(p.hPot0 * clamp(p.legRatio1, 0.42, 0.56));
  p.legShare = clamp((p.legsTarget-p.legs0)/Math.max(1, room), 0.30, 0.62);
  return p;
}
/* 执行进级：重建 G.allHigh 的全部阵容。返回一份统计供播报使用。 */
function promoteToHigh(){
  if(G._promoted) return G.promoteInfo;
  var r = mulberry32((hashStr('promote'+(G.seed||0))+G.season*7919)>>>0);
  var highs = G.allHigh||[], mids = G.allMid||[];
  if(!highs.length || !mids.length) return null;

  // ① 汇总初中在校球员：你自己校队取 G.teammates（带真实成长与关系），其余取各校 roster
  var pool=[], tingMid=null;
  mids.forEach(function(s){
    if(s.isTing){ tingMid = s; return; }                        // 婷婷队原班直升，不进分流池
    var roster = (s.name===G.school && G.teammates && G.teammates.length) ? G.teammates : (s.roster||[]);
    roster.forEach(function(p){ if(p) pool.push(p); });
  });
  var midTotal = pool.length + ((tingMid&&tingMid.roster)?tingMid.roster.length:0);

  // ② 末位淘汰：战力最低的 30 人无缘高中联赛
  pool.sort(function(a,b){ return (b.ovr||0)-(a.ovr||0); });
  var cut = pool.splice(Math.max(0, pool.length - CUT_COUNT), CUT_COUNT);
  var cutMax = cut.length? Math.max.apply(null, cut.map(function(p){return p.ovr||0;})) : 0;

  // ③ 注入 20~40 名国际学生
  var nIntl = 20 + Math.floor(r()*21);
  var intl=[]; for(var ii=0; ii<nIntl; ii++) intl.push(genIntlPlayer(r, ii));

  // ④ 分流：为 31 所非婷婷高中造名额，名额按「档位 + 强随机扰动」排序后与球员实力排序对齐。
  //    扰动标准差接近档位间距 → 弱校完全可能抢到顶级新生，强校也可能收一堆平庸之辈。
  var targets = highs.filter(function(t){ return !t.isTing; });
  var everyone = pool.concat(intl);
  for(var sh=everyone.length-1; sh>0; sh--){ var j=Math.floor(r()*(sh+1)); var tp=everyone[sh]; everyone[sh]=everyone[j]; everyone[j]=tp; }
  everyone.sort(function(a,b){ return (b.ovr||0)-(a.ovr||0); });

  var tierRank = {strong:0, mid:1, weak:2};
  var nT = targets.length;
  var floorPer = 8;                                  // 每校保底 8 人，绝不允许掉到 8 以下
  // 人数不足以保底时，用国际学生补足缺口（保证每校至少 8 人）
  var deficit = floorPer*nT - everyone.length;
  if(deficit > 0){
    for(var di=0; di<deficit; di++){ var np=genIntlPlayer(r, intl.length); intl.push(np); everyone.push(np); }
    nIntl = intl.length;
    everyone.sort(function(a,b){ return (b.ovr||0)-(a.ovr||0); });   // 补入的国际生按战力并入排序
  }
  // 先给每校固定 floorPer 个保底名额
  var slots=[];
  var perSchool=new Array(nT).fill(0), idxs=[]; for(var ii2=0;ii2<nT;ii2++) idxs.push(ii2);
  // 余下名额（每校额外 0~3 个 → 最终 8~11）随机撒到各校，弱校凭扰动仍可能抢到顶薪新生
  var extra = everyone.length - floorPer*nT, eg=0, cap=3;
  while(extra > 0 && eg++ < 9000){
    var avail=idxs.filter(function(i){ return perSchool[i]<cap; });
    if(!avail.length) break;                         // 全部触顶（极端情况），后续不再加
    var pk=avail[Math.floor(r()*avail.length)]; perSchool[pk]++; extra--;
  }
  while(extra > 0){ var pk2=idxs[Math.floor(r()*nT)]; perSchool[pk2]++; extra--; }  // 兜底：超出 cap 也尽量分配
  targets.forEach(function(t,i){
    var n = floorPer + perSchool[i];
    for(var k=0;k<n;k++) slots.push({t:t, pri:(tierRank[t.tier]!=null?tierRank[t.tier]:1) + gaussR(r)*0.9});
  });
  slots.sort(function(a,b){ return a.pri-b.pri; });

  var byTeam={}; targets.forEach(function(t){ byTeam[t.name]=[]; });
  everyone.forEach(function(p, i){
    var sl = slots[i]; if(!sl) return;
    byTeam[sl.t.name].push(p);
  });

  // ⑤ 落位 + 高中段基线化
  var intlSet={}; intl.forEach(function(p){ intlSet[p.uid]=true; });
  targets.forEach(function(t){
    var list = byTeam[t.name]||[];
    list.forEach(function(p){ if(!intlSet[p.uid]) rebaseForHigh(p, r); else { p.gStart=12; p.gEnd=24; } });
    list.sort(function(a,b){ return (b.ovr||0)-(a.ovr||0); });
    t.roster = list;
  });
  // 婷婷队：原班人马直升（她的班底本就是全联盟最强，宿敌关系延续到高中）
  var tingHigh = highs.filter(function(t){ return t.isTing; })[0];
  if(tingHigh && tingMid && tingMid.roster && tingMid.roster.length){
    tingHigh.roster = tingMid.roster.map(function(p){ return rebaseForHigh(p, r); });
  }
  // 重置各校「球星加成」基准，使高中段从 0 起算
  highs.forEach(function(t){
    var so=0, cnt=(t.roster||[]).length;
    (t.roster||[]).forEach(function(p){ p.gStart=t.gStart; p.gEnd=t.gEnd; so+=p.ovr0!=null?p.ovr0:p.ovr; });
    t.rosterOvr0 = cnt? so/cnt : 50;
  });
  // 高中段的「预计涌现人数」按实际升上来的这批人重算
  var cnt={tallC:0, topC:0, strongG:0, strongC:0};
  highs.forEach(function(t){ (t.roster||[]).forEach(function(p){ if(cnt[p.pgrowth]!=null) cnt[p.pgrowth]++; }); });
  PLAYER_EXPECT.high = cnt;

  var mat={early:0, normal:0, late:0}, ptc={};
  highs.forEach(function(t){ (t.roster||[]).forEach(function(p){
    if(mat[p.matType]!=null) mat[p.matType]++;
    ptc[p.ptrait]=(ptc[p.ptrait]||0)+1;
  }); });
  G._promoted = true;
  G.promoteInfo = {midTotal:midTotal, cut:cut.length, cutMax:cutMax, intl:nIntl,
                   promoted:pool.length, highTotal:everyone.length + ((tingHigh&&tingHigh.roster)?tingHigh.roster.length:0),
                   mat:mat, ptc:ptc,
                   cutNames:cut.slice(0,6).map(function(p){return p.name;})};
  return G.promoteInfo;
}

/* 体力成长：每季按各自 stamGrow 提升上限（每人不同），当前体力不超过上限 */
function growStamina(p){
  if(p.stamMax==null) p.stamMax = Math.round(82 + (p.ovr||50)*0.2);
  if(p.stam==null) p.stam = p.stamMax;
  if(p.stamGrow==null) p.stamGrow = 0.02;
  p.stamMax = Math.round(clamp(p.stamMax*(1+p.stamGrow), 50, 240));
  p.stam = Math.min(p.stam, p.stamMax);
}

/* 生成 32 支虚拟球队的逻辑见 genSchools（含特性与阵容） */

function heightMult(age){
  if(age<13) return 1.0;
  if(age<15) return 2.2;   // 青春期猛长期
  if(age<16) return 1.3;
  return 0.5;              // 生长板趋近闭合
}
/* 骨龄生长系数：生长板未闭合前释放，闭合后归零（无硬上限，由骨龄自然封顶）。
   骨龄越接近闭合（约 18 岁），可增长空间越小——这就是“复合上限”。 */
function boneGrowMul(){
  var ba = (G.bio && G.bio.boneage!=null) ? G.bio.boneage : G.age;
  var ge = G.growEnd || 18;          // 生长板闭合骨龄：开局掷骰（晚发育体质 19.2~20.6，早熟 17.5~18.6）
  if(ba >= ge) return 0;
  return clamp((ge - ba)/6, 0, 1);   // 闭合点→0，越年轻越接近 1
}
/* 本季自然身高增长：按骨龄的发育曲线释放（童年缓长→青春猛长→成年趋缓），
   生长板闭合即停止——不再有 200cm 的硬上限，最终身高由骨龄走势自然决定。 */
function heightGrowthThisSeason(){
  var ba = (G.bio && G.bio.boneage!=null) ? G.bio.boneage : G.age;
  var ge = G.growEnd || 18;
  if(ba >= ge) return 0;
  var perYear = ba < 13 ? 7.2 : (ba < 15 ? 4.8 : 2.4);
  // 晚发育体质：单季涨幅更平缓，但因为骨龄慢、闭合晚，整条曲线拖得更长 → 总量反而更多
  if(G.lateBloom) perYear = perYear*0.72 + 0.8;
  var apt = (G.apt && G.apt.height) ? G.apt.height : 1;
  var pot = (G.pot && G.pot.height) ? (0.70 + G.pot.height*0.30) : 1;
  return perYear/4 * apt * pot * (G.growMul||1);
}
function power(s){
  return s.height*0.85 + s.skill*2.4 + s.stamina*1.0 + s.strength*1.05
       + s.agility*1.1 + s.pop*1.7 + s.study*0.4 + s.conf*1.3;
}
/* 你所在校队的综合实力（随个人养成成长 + 队友强度 + 全队士气） */
function avgMateOvr(){
  if(!G.teammates || !G.teammates.length) return 50;
  var s=0; G.teammates.forEach(function(t){ s += (t.ovr||50); });
  return s/G.teammates.length;
}
/* ===================== 阵容管理（主力 + 替补，可手动调整） ===================== */
function defaultLineup(){
  if(!G.teammates || !G.teammates.length) return [];
  return G.teammates.slice().sort(function(a,b){ return (b.ovr||0)-(a.ovr||0); }).slice(0,4).map(function(p){ return p.uid; });
}
function lineupTeammates(){
  if(!G.teammates) return [];
  var ids = (G.lineup && G.lineup.length) ? G.lineup : defaultLineup();
  var arr = G.teammates.filter(function(p){ return ids.indexOf(p.uid) >= 0; });
  if(arr.length < 1 || arr.length > 5) arr = G.teammates.slice().sort(function(a,b){ return (b.ovr||0)-(a.ovr||0); }).slice(0,4);
  return arr;
}
/* 首发组合（你 + 4 队友）按位置产生 内线/外线/防守/速度 加成 */
function lineupBuffs(){
  var roster = lineupTeammates();
  var pos = {G:0, F:0, C:0};
  var myPos = G.template==='guard'?'G':(G.template==='center'?'C':'F');
  pos[myPos]++;
  roster.forEach(function(p){ var c = p.pos==='中锋'?'C':(p.pos==='前锋'?'F':'G'); pos[c]++; });
  var inside  = pos.C*9 + pos.F*3;                       // 内线：中锋/前锋多 → 篮下强
  var outside = pos.G*9 + pos.F*3;                       // 外线：后卫/前锋多 → 投射强
  var defense = (pos.C+pos.F)*4 + roster.filter(function(p){return p.ptrait==='iron';}).length*3; // 铁人/内线多 → 防守硬
  var speed   = pos.G*9 + pos.F*2;                       // 后卫多 → 速度快
  return {inside:inside, outside:outside, defense:defense, speed:speed,
          mul: 1 + (inside+outside+defense+speed)/520};  // 综合微加成（约 +0~12%）
}
/* 一组球员的体力系数（用于把“疲劳”折算进战力） */
function avgStaminaFactor(players){
  if(!players || !players.length) return 1;
  var s=0,n=0;
  players.forEach(function(p){ var mx=p.stamMax||100, cur=p.stam!=null?p.stam:mx; s += clamp(cur/mx,0,1); n++; });
  return clamp(s/n, 0.55, 1.05);
}
/* 确保对手阵容存在，并给其初始体力打上“本场并非满血”的折扣（按队名+赛季稳定，体现对手也有赛程消耗） */
function ensureOppRoster(opp){
  if(!opp) return;
  if(!opp.roster) opp.roster = genRoster(opp.name, opp.base, hashStr(opp.name)%97);
  if(!opp._oppStamSet){
    var f = 0.62 + (hashStr(opp.name+(G.season||0))%38)/100;   // 0.62~1.00
    opp.roster.forEach(function(p){ p.stam = Math.round((p.stamMax||100)*f); });
    opp._oppStamSet = true;
  }
}
function oppStarters(opp){
  ensureOppRoster(opp);
  return (opp.roster||[]).slice().sort(function(a,b){ return (b.ovr||0)-(a.ovr||0); }).slice(0,5);
}
/* 替补体力消耗倍率：按“替补人数”决定（阵容越深，每人消耗越低，体现轮换休息） */
function benchStamMul(benchCount){
  if(benchCount >= 8) return 0.40;   // 8 人以上
  if(benchCount >= 5) return 0.50;   // 5~7 人
  return 0.70;                       // 小于 4 人
}
/* 一名“上场主力”的标准消耗（100% 基准）：上场时间 + 策略额外消耗 */
function starterStamCost(youMins, strat){
  return Math.round((youMins/2)*0.85 + (strat.staminaCost>0 ? strat.staminaCost*0.6 : 0));
}
/* 比赛体力消耗（双方共享同一套规则）：
   主力 = 100%；替补 = 按“替补人数”70%/50%/40%（阵容越深，每人消耗越低）；
   铁人特性再 -10%；不再有“恢复/回血”（仅赛后有少量回复）。 */
function applyMatchStamina(youMins, stratKey, opp){
  var strat = STRATS[stratKey] || STRATS.balanced;
  var gameMin = 40;                                  // 一场比赛队友/对手均打满约 40 分钟
  var baseC = starterStamCost(gameMin, strat);       // 主力 100% 基准（满场）
  // —— 我方 ——
  var st = lineupTeammates();
  var bench = (G.teammates||[]).filter(function(p){ return st.indexOf(p) < 0; });
  var bMul = benchStamMul(bench.length);
  st.forEach(function(p){
    var mx=p.stamMax||100, cur=p.stam!=null?p.stam:mx, c=Math.round(baseC*(1+(G.matchStamMod||0)));   // 个人强度选择 → 队友消耗 -20% ~ +5%（不上场 +25%）
    if(p.ptrait==='iron') c = Math.round(c*0.9);
    p.stam = clamp(cur - c, 0, mx);
  });
  bench.forEach(function(p){
    var mx=p.stamMax||100, cur=p.stam!=null?p.stam:mx, c=Math.round(baseC*bMul*(1+(G.matchStamMod||0)));
    if(p.ptrait==='iron') c = Math.round(c*0.9);
    p.stam = clamp(cur - c, 0, mx);
  });
  // 主角（固定首发）：上场时间消耗已在 pickMinutes 扣过，这里补扣“策略消耗”并应用铁人 -10%
  if(youMins>0){
    var sc = stamCap(), scur = G.stats.stamina;
    var pc = Math.round(strat.staminaCost>0 ? strat.staminaCost*0.6 : 0);
    if(G.ptrait==='iron') pc = Math.round(pc*0.9);
    G.stats.stamina = clamp(scur - pc, 0, sc);
  }
  // —— 对手（共享同一规则）——
  var oppSt = oppStarters(opp);
  var oppBench = (opp.roster||[]).filter(function(p){ return oppSt.indexOf(p) < 0; });
  var obMul = benchStamMul(oppBench.length);
  oppSt.forEach(function(p){
    var mx=p.stamMax||100, cur=p.stam!=null?p.stam:mx, c=baseC;
    if(p.ptrait==='iron') c = Math.round(c*0.9);
    p.stam = clamp(cur - c, 0, mx);
  });
  oppBench.forEach(function(p){
    var mx=p.stamMax||100, cur=p.stam!=null?p.stam:mx, c=Math.round(baseC*obMul);
    if(p.ptrait==='iron') c = Math.round(c*0.9);
    p.stam = clamp(cur - c, 0, mx);
  });
}
function teamPower(){
  var base = power(G.stats)*0.7 + 20;
  var allAvg = avgMateOvr();
  var st = lineupTeammates();
  var stAvg = st.length ? (st.reduce(function(s,p){return s+(p.ovr||50);},0)/st.length) : allAvg;
  var bench = (G.teammates && G.teammates.length && G.teammates.length>st.length)
      ? G.teammates.filter(function(p){ return st.indexOf(p)<0; })
      : [];
  var benchAvg = bench.length ? (bench.reduce(function(s,p){return s+(p.ovr||50);},0)/bench.length) : allAvg;
  var mate = 1 + ((stAvg*0.8 + benchAvg*0.2) - 50)/350;   // 首发主导，替补深度补强
  var mor  = 1 + (G.teamMorale||0)*0.02;
  var lb = lineupBuffs();
  var sf = avgStaminaFactor(st.concat([{stam:G.stats.stamina, stamMax:stamCap()}]));
  return base * mate * mor * lb.mul * sf;
}
/* 全队士气对“总实力”的额外加成：最高 +50%（士气3→约1.45x），负值额外降低（士气-3→约0.55x） */
function moraleStrMul(){ return clamp(1 + (G.teamMorale||0)*0.15, 0.5, 1.5); }
/* 身体数据：绝对数值，随年龄自然生长（每季有“基础成长值”） */
function initBio(age){
  var h = G.stats.height;
  return {
    height: h,
    wingspan: h*1.04,
    leglen: h*0.46,
    shoesize: Math.round(h*0.228*10)/10,
    weight: clamp(((h-110)*0.92 + (age-12)*2.4 + 8) * (G._wJit||1), 26, 130),   // 初始体重也随机（±8%）
    boneage: age + (G.boneDiff||0)
  };
}
/* 训练/事件让身高变化时，同步带动臂展、腿长、鞋码，保持身体比例协调 */
function growBodyFromHeight(dh){
  if(!G.bio) return;
  G.bio.wingspan += dh*1.04;
  G.bio.leglen  += dh*0.46;
  G.bio.shoesize+= dh*0.228;
}
/* 每季末自然生长：身高/体重/臂展/腿长/鞋码/骨龄 各自的基础成长值（青春期猛长、成年趋缓） */
function growBio(){
  var a=G.age;
  function rate(young,mid,late,adult){ return a<14?young:(a<16?mid:(a<18?late:adult)); }
  var g = {
    height:  heightGrowthThisSeason(),
    wingspan:rate(1.9,1.3,0.6,0.1),
    leglen:  rate(1.0,0.7,0.35,0.05),
    shoesize:rate(0.35,0.30,0.15,0.05),
    weight:  rate(1.5,1.3,1.0,0.4),
    boneage: rate(0.25,0.25,0.25,0.20) * (G.baRateMul||1)   // 晚发育体质骨龄推进只有常人的 6 成
  };
  var bgm = boneGrowMul();   // 骨骼生长（身高/臂展/腿长/鞋码）同样受骨龄封顶
  var gm = (G.growMul||1);    // 成长天赋倍率：同步放大身体围度，保持比例协调
  G.stats.height  += g.height;
  G.bio.wingspan += g.wingspan * bgm * gm;
  G.bio.leglen   += g.leglen   * bgm * gm;
  G.bio.shoesize += g.shoesize * bgm * gm;
  G.bio.weight    = Math.max(26, G.bio.weight + g.weight);
  G.bio.boneage  += g.boneage;
  G.lastBioGrowth = g;
  G.heightHist.push(G.stats.height);
}
function bioStats(){
  var b=G.bio;
  return {
    height: Math.round(G.stats.height), weight: Math.round(b.weight),
    wingspan: Math.round(b.wingspan), legLen: Math.round(b.leglen),
    shoe: Math.round(b.shoesize*10)/10, boneAge: Math.round(b.boneage*10)/10
  };
}
/* 不同学年，虚拟队的“当前强度”会随赛制难度提升一点点（学段内每年 +4%，跨学段由 base 抬升承担） */
function fieldFactor(year){ var y = year>3 ? year-3 : year; return 1 + (y-1)*0.04; }
/* 13–15 岁为瓶颈/低谷期：成长放缓，且婷婷会暂时领先——这是“艰难时刻” */
function inSlump(season){ return season>=9 && season<=13; }

/* 当前学年（1..6）与学段 */
function curYear(){ return Math.floor(G.season/4)+1; }
function isHigh(){ return curYear()>=4; }

function computeRank(){
  var yp = teamPower();
  var above = 0;
  G.curTeams.forEach(function(t){ if(oppEff(t, false) > yp) above++; });
  G.rank = above + 1;  // 1..32
  if(G.rank < G.bestRank) G.bestRank = G.rank;
}

function stageLabel(age){

function checkMilestones(){

/* 婷婷 随季成长 */
function tingGrow(){
  var t = G.ting, hm = heightMult(G.age);
  t.height = t.height + (0.9 + (G.season%3===0?0.4:0))*hm;   // 婷婷同样按青春曲线生长，无硬上限
  t.skill   = Math.max(0, t.skill + 1.1 + rng()*0.7);
  t.stamina = Math.max(0, t.stamina + 0.4);
  t.strength= Math.max(0, t.strength + 0.8);
  t.agility = Math.max(0, t.agility + 0.6);
  t.pop     = Math.max(0, t.pop + 0.6);
  t.study   = Math.max(0, t.study + 0.9);
  t.conf    = Math.max(0, t.conf + 0.6);
}
function tingPower(){ return power(G.ting) + (G.ting.offset||0) + (G.ting.form||0); }
function balanceTing(){
  var pp = power(G.stats);
  if(inSlump(G.season)){ G.ting.offset = 26 * diffCfg().ting; }
  else { G.ting.offset = clamp(G.ting.offset*0.65 - 4, -22, 10); }
  var target = pp + G.ting.offset;
  var tp = power(G.ting);
  var diff = target - tp;
  G.ting.skill = Math.max(0, G.ting.skill + diff/2.4);
}
/* 各项活动对“状态/士气”的影响（波折核心）：硬练会累、休养心理回血 */
var FORMDELTA = {rest:1.1, mental:0.65, idol:0.5, match:0.25, meal:0.25, sleep:0.25, supp:0.2, study:0.15, street:0.0, stretch:-0.1, train:-0.28, gym:-0.28};
/* 每项活动贡献的“奋斗值”（低谷期硬练额外加成，由 choose 计算） */
var EFFORT = {meal:1, sleep:1, train:1.6, gym:1.6, stretch:1, match:1.4, study:1.1, street:1.2, mental:1, supp:0.9, rest:0.4, idol:0.8};

function teammateAvgRel(){
  if(!G.teammates || !G.teammates.length) return 50;
  var s=0; G.teammates.forEach(function(t){ s += (t.rel!=null?t.rel:50); });
  return s/G.teammates.length;
}
function friendAxis(){
  var f = G.friends || {xiaotong:0, coach:0};

function pushAxisFeed(kind, val, label){

function advanceWorld(){
  G.curTeams = isHigh() ? G.highTeams : G.midTeams;
  G.rivals.forEach(function(rv){ if(!rv.isTing) rv.power += rv.growth; });
  tingGrow();
  balanceTing();
  var damp = (G.season>=22)?0.25:1;
  G.ting.form = clamp(G.ting.form*0.6 + (rng()-0.5)*13*damp, -13, 13);
  var ahead = power(G.stats) >= tingPower();
  if(G._lastTingAhead!=null && ahead!==G._lastTingAhead){ G.tingLeadChanges++; }
  G._lastTingAhead = ahead;
}

/* 里程碑 / 成长类检测（并入 checkMilestones 统一调用，避免同名函数被后者覆盖） */
