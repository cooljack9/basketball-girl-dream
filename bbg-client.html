    G.milestones.dunk=true; G.banner='人生第一次扣篮！全场欢呼。'; addHighlight('💥 暴力美学：第一次扣篮！'); unlock('a_dunk');
  }

  if(!G.milestones.sponsor && st.pop>=60){ G.milestones.sponsor=true; G.banner='人气破 60，登上本地杂志封面！'; unlock('a_pop'); }
  if(!G.milestones.study && st.study>=65){ G.milestones.study=true; unlock('a_study'); }
  if(!G.milestones.mvp && st.skill>=55 && G.lastLeague && G.lastLeague.avg>=22){ G.milestones.mvp=true; unlock('a_mvp'); }
  /* 才能开花（觉醒）触发点：技术 / 身体的质变瞬间 */
  if(!G.milestones.awSkill && st.skill>=70){ G.milestones.awSkill=true; queueAwaken('aw_skill','aw_skill','技术开花·觉醒'); }
  if(!G.milestones.awBody && st.height>=180){ G.milestones.awBody=true; queueAwaken('aw_body','aw_body','身体觉醒'); }
  if(G.rank===1 && !G.achievements.a_rank){ unlock('a_rank'); }
  // 战力 / 技术 质变（变强的爽点）
  var pw=power(G.stats);
  if(!G.milestones.pw300 && pw>=300){ G.milestones.pw300=true; queueFanfare('💪','战力突破 300！','你已是同年龄段顶尖好手', 'power'); }
  if(!G.milestones.pw400 && pw>=400){ G.milestones.pw400=true; queueFanfare('💥','战力突破 400！','联盟顶级，谁敢小觑', 'power'); }
  if(!G.milestones.sk70 && st.skill>=70){ G.milestones.sk70=true; queueFanfare('🎯','技术值 70 质变！','动作行云流水，招牌绝活成型', 'power'); }
  if(!G.milestones.sk80 && st.skill>=80){ G.milestones.sk80=true; queueFanfare('⭐','技术值 80 大师级！','教科书般的存在', 'power'); }
  checkHeightMilestones();
}

function coachLine(){

  if(inSlump(G.season)) return '到了瓶颈期别慌——这是每个巨星都要跨过的坎，挺过去就蜕变。';

/* =========================================================================
 * 成长模型 · 回归《人体全周期耦合生长发育》论文框架
 * 用四项“可计算效应”让成长过程更科学（数值上显式体现）：
 *   ① 训练边际递减 — 对立统一算子 𝒟 的饱和分支：属性越高，单次训练的边际收益越低
 *                    （取 Michaelis–Menten 饱和 p/(p+v)，恒为正，满足论文“更多投入不更差”）
 *   ② 疲劳与状态   — 系统负荷 B1 / 机械过载 B4：连续训练累积 trainLoad，load 越高收益越低；
 *                    休息/心理/睡眠/偶像类活动清空 load（映射“恢复不足→过载节流”）
 *   ③ 年龄成长曲线 — temporalWeight wᵢ(age)：每条属性只在自身年龄窗口高效，峰值为青春期，
 *                    远端衰减（低龄/青春期增益高、高龄趋缓）
 *   ④ 比赛经验加成 — 运动综合周期 + R2 竞争性变体：实战直接涨经验，对手越强、上场越久收益越高，
 *                    且整体高于同量纯训练（“以赛代练”）
 * 所有因子均为“乘法叠加、恒为正、封底不为 0”，与论文不变量（中性≡1、更多投入不更差）一致。
 * ========================================================================= */
var GROWTH_PEAK = {skill:85, strength:95, agility:80, stamina:120, conf:65, pop:75, study:90, height:400};
var AGE_WIN = {
  skill:   {pk:14.0, sig:3.0, lo:0.80, hi:1.20},  // 技术：少年期最佳
  agility: {pk:13.5, sig:2.6, lo:0.78, hi:1.22},  // 敏捷：低龄最佳
  strength:{pk:15.5, sig:2.8, lo:0.70, hi:1.30},  // 力量：青春期突增最猛
  stamina: {pk:15.0, sig:3.2, lo:0.82, hi:1.15},
  conf:    {pk:14.5, sig:4.0, lo:0.88, hi:1.12},
  pop:     {pk:14.5, sig:4.0, lo:0.88, hi:1.12},
  study:   {pk:13.0, sig:3.5, lo:0.85, hi:1.15},
  height:  null   // 身高由 heightMult(G.age)*boneGrowMul() 单独处理，不重复乘年龄窗口
};
/* ① 训练边际递减：属性越高边际收益越低（恒为正） */
function dimRet(k, v){
  // 潜力上限 pot[k] 直接放大边际递减阈值：潜力越高，同一属性堆到很高时仍能继续吃到收益
  var p = (GROWTH_PEAK[k]||100) * ((G.pot && G.pot[k]) ? G.pot[k] : 1);
  return p/(p + Math.max(0,v));
}
/* ③ 年龄成长曲线：以峰值年龄为中心的高斯钟形，峰 hi、远端 lo（平滑、不突变） */
function ageWin(k, age){
  var w = AGE_WIN[k]; if(!w) return 1;
  var g = Math.exp(-((age - w.pk)*(age - w.pk))/(2*w.sig*w.sig));
  return w.lo + (w.hi - w.lo)*g;
}
/* ② 疲劳与状态：trainLoad 累计(0~130)，越高节流越重，封底 0.45（不为 0，效率降但“不更差”） */
function fatigueFactor(){ return clamp(1 - (G.trainLoad||0)/220, 0.45, 1.0); }
/* ② 每次活动的负荷增量：训练/比赛/体能累加；休息/心理/睡眠/偶像清零；营养微量减负 */
function actLoadDelta(id){
  if(id==='rest'||id==='mental'||id==='sleep'||id==='idol') return -45;
  if(id==='meal'||id==='supp') return -12;
  return (EFFORT[id]||1)*6.5;
}
/* 统一成长写入：把“裸收益”经 ①+③(+可选②) 折算后落属性（训练与实战共用，保证一致） */
function applyGrowth(bonus, opts){
  opts = opts||{};
  var st = G.stats, age = G.age;
  for(var k in bonus){
    var raw = bonus[k]; if(raw===0) continue;
    var v = raw * dimRet(k, st[k]) * ageWin(k, age);
    if(opts.fatigue) v *= fatigueFactor();
    if(opts.gameMul) v *= gameGrowthMul();
    if(k==='height'){ st.height = st.height + v; growBodyFromHeight(v); }
    else if(k==='strength'){ st[k] = Math.max(0, st[k] + v); G.bio.weight = Math.max(26, G.bio.weight + v*0.25); }
    else if(k==='stamina'){ st[k] = clamp(st[k] + v, 0, stamCap()); if(v>0) G.stamCapBonus = Math.min(40, (G.stamCapBonus||0) + v*0.12); }
    else st[k] = Math.max(0, st[k] + v);
  }
}
/* ④ 比赛经验加成：对手越强、上场越久→经验越多（映射 R2 竞争性变体“与强敌对抗→变强渴望”） */
function matchExpGain(box, win, oppE, minutes){
  var oppK = clamp(0.9 + (oppE-180)/350, 0.9, 2.0);          // 强敌放大，弱旅收敛
  var minK = clamp(0.20 + minutes/40*0.95, 0.20, 1.15);       // 40min≈1.0、12min≈0.45
  var base = 3.0 * oppK * minK * (win ? 1.10 : 1.0);
  return { skill:base*0.90, agility:base*0.55, conf:base*0.55 + (win?1.2:0.5),
           strength:base*0.35, stamina:base*0.25 };
}
/* ④ 把一场比赛的经验直接写入属性（实战本身刷新状态，不叠加训练疲劳节流） */
function applyMatchExperience(box, win, oppE, minutes){
  var save = G.trainLoad; G.trainLoad = 0;        // 临时清零，使 fatigueFactor≡1
  var _mg = matchExpGain(box, win, oppE, minutes); for(var _mk in _mg){ _mg[_mk] *= (G.growMul||1); } applyGrowth(_mg, {gameMul:true});
  G.trainLoad = save;
  G.lastMatchExp = {oppE:oppE, minutes:minutes, win:win, gain:matchExpGain(box, win, oppE, minutes)};
}

/* 选择一项养成活动 */
/* 应用单个活动（用于多选：可连续应用，连携检测串联到上一项） */
function applyOne(id, chainRef){
  var a = ACTS[id]; if(!a) return;
  var st = G.stats, GAIN = 1.4, tpl = TEMPLATES[G.template];
  var smod = (G.schoolMod||{}), formMul = 1 + G.form*0.08;
  // 成长资质 apt[k]（开局掷骰，±30% 零和）与职业训练倍率、学校特性倍率一并作用在基础效果上
  // 适应性成长：先天特征与所在【高中】特性契合时，全部养成收益额外 +3~5%
  var fitM = (isHigh() ? (G.fitMul||1) : 1);
  var eff = {}; for(var k in a.eff){ eff[k]=a.eff[k]*GAIN*formMul*(tpl.train[k]||1)*(smod[k]||1)*((G.apt&&G.apt[k])?G.apt[k]:1)*fitM*(G.growMul||1); }
  if(eff.height) eff.height *= heightMult(G.age) * boneGrowMul();
  // 连携：与“上一季最后一项 / 本季已选的第一项”配对 → 加成
  var syn = null;
  if(chainRef.v){
    PAIRS.forEach(function(p){
      if((p.a===chainRef.v&&p.b===id)||(p.b===chainRef.v&&p.a===id)){
        for(var kk in p.bonus) eff[kk]=(eff[kk]||0)+p.bonus[kk];
        syn=p.label;
      }
    });
  }
  var slumpMul = inSlump(G.season) ? 0.70 : 1.0;
  G.form = clamp(G.form*0.66 + (FORMDELTA[id]||0) + (rng()-0.5)*0.5, -3, 3);
  // ② 疲劳与状态：累计本季训练负荷（休息类在 actLoadDelta 内为负，自动清零）
  G.trainLoad = clamp((G.trainLoad||0) + actLoadDelta(id), 0, 130);
  // 休息/心理/睡眠/偶像类活动为恢复，不受疲劳节流；其余活动按 trainLoad 效率折算
  var fatF = (id==='rest'||id==='sleep'||id==='mental'||id==='idol'||a.recover) ? 1 : fatigueFactor();
  if(syn){
    G.flow++;
    if(G.flow>=3 && !G.flowAwarded){
      eff.skill=(eff.skill||0)+1.5; eff.pop=(eff.pop||0)+1.5; eff.conf=(eff.conf||0)+1.5;
      G.flowAwarded=true; G.banner='⚡ 连携爆发 ×'+G.flow+'！状态全开，全面加成';
      unlock('a_flow');
    }
  } else { G.flow=0; G.flowAwarded=false; }
  for(var k in eff){
    // 单独效果随机化：±30%~+40%（训练有惊喜也有失常）；体力长期过低时被压到 0.8~0.95
    var rf = growthRandom();
    var gm = (G.motivation && G.motivation[k]) ? G.motivation[k] : 0;   // 该项数据的“分项成长激励”
    // ① 训练边际递减 × ③ 年龄成长曲线 × ② 疲劳效率（三效应叠加，恒为正）
    var v = eff[k]*slumpMul*rf*(1+gm)*gameGrowthMul() * dimRet(k, st[k]) * ageWin(k, G.age) * fatF;
    if(k==='height'){ st.height = st.height + v; growBodyFromHeight(v); }
    else if(k==='strength'){ st[k] = Math.max(0, st[k] + v); G.bio.weight = Math.max(26, G.bio.weight + v*0.25); }
    else if(k==='stamina'){ st[k] = clamp(st[k] + v, 0, stamCap()); if(v>0) G.stamCapBonus = Math.min(40, (G.stamCapBonus||0) + v*0.12); }
    else st[k] = Math.max(0, st[k] + v);
  }
  if(a.risk && rng()<a.risk){
    st.stamina = clamp(st.stamina-8,0,stamCap());
    diary(secLabel(), '一场硬仗后有点疲惫，体力小损。');
  }
  var efGain = (EFFORT[id]||1) * (inSlump(G.season)?1.4:1);
  G.axes.effort += efGain;
  pushAxisFeed('effort', efGain, a.name);
  chainRef.v = id;
  return syn;
}
/* 成长随本赛季比赛数缩放：基础成长数 ×(1+0.01×比赛数)× 扰动(0.7~1.55) */
function gameGrowthMul(){ return (1 + 0.01*(G.seasonGames||0)) * (0.85 + rng()*0.65); }
/* 提交所选活动（1 项或本季的 2 项），随后进入赛事/事件链 */function commit(ids){
  if(G.screen!=='main') return;
  if(!ids || !ids.length) return;
  G.seasonGames = 1;   // 每季初：联赛焦点战计 1 场，杯赛每场再累加
  G.prevStats = {}; for(var k in G.stats){ G.prevStats[k]=G.stats[k]; }
  var chain = {v:G.lastAct};
  ids.forEach(function(id){ applyOne(id, chain); });
  G.lastAct = ids[ids.length-1];
  G.sel = [];
  G.pendingComp = true;            // 本季活动已确认，等待玩家在主菜单点「进入本季赛事」
  G.committedActs = ids.slice();
  // 事件树解析：先叙事，再进赛事（本季末的联赛/杯赛）
  var doneSeason = G.season;
  if(doneSeason===10 && !G.crisisShown){ G.crisisShown=true; G.event=getNode('crisis'); G.eventIsStory=true; G.pendingSeason=doneSeason; G.screen='event'; render(); return; }
  var spineId = SPINE[doneSeason];
  if(spineId && !G.shownStory[doneSeason]){
    G.shownStory[doneSeason]=true; G.event=getNode(spineId); G.eventIsStory=true; G.pendingSeason=doneSeason; G.screen='event'; render(); return;
  }
  if(G.eventQueue.length){
    var qid = G.eventQueue.shift();
    G.event=getNode(qid); G.eventIsStory=false; G.pendingSeason=doneSeason; G.screen='event'; render(); return;
  }
  // 注：羁绊阈值事件已于 postSeason 内统一触发（见 postSeason 末段），此处不再处理，避免被主线叙事/事件队列长期挤掉
  if(rng()<0.5){
    // 优先保证“各类支线”都能被体验：只要还有未开启的支线，就优先开它
    var pend = BRANCH_OPENERS.filter(function(id){
      if(G.branchesStarted[id]) return false;
      if(NODES[id]._gate && !NODES[id]._gate()) return false;
      return true;
    });
    if(pend.length){
      var bid = rollOpener();
      if(bid){ G.event=getNode(bid); G.eventIsStory=false; G.pendingSeason=doneSeason; G.screen='event'; render(); return; }
    }
    var mid = pickMeme();
    if(mid){ G.event=getNode(mid); G.eventIsStory=false; G.pendingSeason=doneSeason; G.screen='event'; render(); return; }
    var oid = rollOpener();
    if(oid){ G.event=getNode(oid); G.eventIsStory=false; G.pendingSeason=doneSeason; G.screen='event'; render(); return; }
  }
  // 更衣室关系互动：一定概率触发——队友做出带正负效果的动作，需要玩家回应（有取舍）
  if(G.teammates && G.teammates.length && rng()<0.30){
    pickLockerEvent(); return;
  }
  // 没有更多事件：回到主菜单，由玩家点「进入本季赛事」正式开打（避免剧情后直接跳进比赛、跳过主菜单）
  G.screen='main'; render();
}
function proceedToMatch(){ if(G.screen!=='main' || !G.pendingComp) return; G.pendingComp=false; enterCompetition(G.season); }
function choose(id){ if(G.screen!=='main') return; commit([id]); }
function toggleOffer(id){
  if(G.screen!=='main') return;
  if(!G.sel) G.sel=[];
  var i = G.sel.indexOf(id);
  if(i>=0) G.sel.splice(i,1);
  else { if(G.sel.length>=2) return; G.sel.push(id); }
  render();
}
function confirmChoice(){ if(G.screen!=='main') return; if(!G.sel || G.sel.length!==2) return; commit(G.sel.slice()); }

/* 本季末赛事：block 0/1/2 = 联赛焦点战；block 3 = 校队杯 */
function enterCompetition(season){
  G.pendingComp=false;
  if(season===12 && !G.highChosen){
    // 升学：先把初中这批人分流进 32 所高中（末位淘汰 + 国际生插班），再让玩家挑学校
    var pi = promoteToHigh();
    if(pi){
      addHighlight('🎓 升学分流：初中 '+pi.midTotal+' 人中，战力垫底的 '+pi.cut+' 人无缘高中联赛（'+pi.cutNames.slice(0,3).join('、')+'… 战力≤'+pi.cutMax+'）');
      addHighlight('🌍 '+pi.intl+' 名国际学生插班高中联赛，格局重新洗牌（现役 '+pi.highTotal+' 人：早熟 '+pi.mat.early+' · 普通 '+pi.mat.normal+' · 晚熟 '+pi.mat.late+'）');
      storyLine(secLabel(), '【升学】同一批人升上了高中，只是有人留下、有人离开，还有一群说着不同语言的新面孔。');
    }
    G.screen='school2'; render(); return;   // 高一：选择想进的高中
  }
  G.curTeams = isHigh() ? G.highTeams : G.midTeams;
  G.pendingSeason = season;
  if(season%4===3){ startCup(); }
  else { setupLeague(); beginPrematch(); }
}

/* ===== 联赛：32 队单循环，模拟后出名次 ===== */
function expPts(s){ return 55 + s*0.6; }
/* 命中率模型：本方每回合命中率 = 基础命中(随本方实力) − 对手干扰防守(随对手实力) + 噪声；
   命中率再换算成每回合期望得分(ppp)。差距拉大时落后方组织不了像样进攻→分差越拉越大。 */
function baseHit(e){ return clamp(0.45 + (e-55)/300, 0.28, 0.70); }   // 实力越强基础命中越高
function interference(e){ return clamp((e-55)/420, 0, 0.20); }        // 防守干扰随对手实力增强
function effHit(attE, defE, noise){ return clamp(baseHit(attE) - interference(defE) + (noise||0), 0.10, 0.85); }
function pppFromHit(eh){ return eh*3.2 + 0.45; }                       // eh≈0.45 → 1.89 分/回合（吻合 24 秒节奏）
/* 基于回合权(possessions)的单场比分模型（整场 4 节，逐节模拟）：
   全场约 54~58 次攻击（遵循 24 秒时限的高强度节奏）；命中率由实力差(基础命中 vs 干扰防守)与胜率偏向决定。
   逐节带入“势头(momentum)”：累计分差越大，领先方越顺、落后方越打不进，从而产生巨大差距。
   四节不设硬上限（单节上限 108、加罚球 2+1 可达 132）；强队总分可远超 134。返回 {y:你方总分, o:对方总分, win}。 */
/* 单场胜率平滑映射：线性 pa 经轻微 S 形曲线映射为胜率，避免“强队碾压到 90%+ / 均势玄学翻转”的两极体验。
   pa=0.5→0.5，pa=0.6→≈0.65，pa=0.7→≈0.79，pa=0.95→≈0.97 */
function matchWinProb(yE, oE, pa){
  if(pa==null){ var s=yE+oE; pa = s>0? clamp(yE/s,0.05,0.95):0.5; }
  pa = clamp(pa, 0.05, 0.95);
  return clamp(1/(1+Math.exp(-6*(pa-0.5))), 0.04, 0.96);
}
function genGame(yE, oE, pa, oOffMul, oDefMul){
  if(oOffMul==null) oOffMul=1; if(oDefMul==null) oDefMul=1;
  var pWin = matchWinProb(yE, oE, pa);
  // 期望分差随胜率温和放大（封顶），保留真实感但不滚雪球成离谱大比分
  var expDiff = (pWin-0.5)*16;                 // 0.65→+2.4；0.95→+7.2
  var curY=0, curO=0;
  for(var q=0;q<4;q++){
    var yq = 24 + expDiff/4 + (rng()-0.5)*16;
    var oq = 24 - expDiff/4 + (rng()-0.5)*16;
    // 对手特性方向性攻防：仅做轻微修正，不引入碾压
    yq *= (1 + (oDefMul>1 ? -(oDefMul-1)*0.3 : (oDefMul-1)*0.3));
    oq *= (1 + (oOffMul>1  ?  (oOffMul-1)*0.3 : (oOffMul-1)*0.3));
    curY += clamp(Math.round(yq), 6, 60);
    curO += clamp(Math.round(oq), 6, 60);
  }
  var win = curY>curO;
  // 轻度纠偏：把整体胜率拉向 pWin（强队≈pWin、均势≈0.5），保证难度平滑可预期
  if((win && rng()>pWin) || (!win && rng()<pWin)){
    if(rng()<0.5){ curY++; } else { curO++; }
    win = curY>curO;
  }
  if(curY===curO){ if(rng()<pWin){ curY++; } else { curO++; } win = curY>curO; }
  return {y:curY, o:curO, win:win};
}
function simScore(yE, oE, pa, oOffMul, oDefMul){ return genGame(yE, oE, pa, oOffMul, oDefMul); }
function simLeague(){
  var youE = teamPower()*moraleStrMul();   // 全队士气对总实力的额外加成（最高 +50%）
  var ff = fieldFactor(curYear());
  var field = G.curTeams.map(function(t){return {name:t.name, base:t.base, isTing:t.isTing, you:false};});
  field.unshift({name:G.school, you:true});
  var W={}, D={}; field.forEach(function(t){ W[t.name]=0; D[t.name]=0; });
  var youW=0, youL=0, youDiff=0, youPts=0;
  for(var i=0;i<field.length;i++) for(var j=i+1;j<field.length;j++){
    var a=field[i], b=field[j];
    var sa = a.you? youE : oppEff(a, false);
    var sb = b.you? youE : oppEff(b, false);
    var pa = clamp(Math.pow(sa,1.9)/(Math.pow(sa,1.9)+Math.pow(sb,1.9)) + (rng()-0.5)*0.07, 0.06, 0.94);
    var aWin = rng()<pa;
    var bTr = TRAIT_BY[b.trait] || TRAIT_BY.allround;   // 本对中 b 为“对手”，施加其特性方向性攻防
    var g = genGame(sa, sb, pa, bTr.offMul||1, bTr.defMul||1);
    var saScore = g.y, sbScore = g.o;
    if(aWin){ W[a.name]++; D[a.name]+=saScore-sbScore; D[b.name]+=sbScore-saScore;
      if(a.you){youW++;youDiff+=saScore-sbScore;youPts+=saScore;} else if(b.you){youL++;youDiff-=saScore-sbScore;youPts+=sbScore;} }
    else { W[b.name]++; D[b.name]+=sbScore-saScore; D[a.name]+=saScore-sbScore;
      if(b.you){youW++;youDiff+=sbScore-saScore;youPts+=sbScore;} else if(a.you){youL++;youDiff-=saScore-sbScore;youPts+=saScore;} }
  }
  var standings = field.map(function(t){ return {name:t.name, w:W[t.name], d:D[t.name], you:t.you, isTing:t.isTing}; });
  standings.sort(function(x,y){ return (y.w-x.w) || (y.d-x.d); });
  var pos = standings.findIndex(function(s){ return s.you; }) + 1;
  var games = youW+youL;
  var avg = Math.round(youPts/Math.max(1,games) * (0.6 + G.stats.skill/150));
  var res = {standings:standings, pos:pos, w:youW, l:youL, diff:youDiff, avg:avg, period:periodName()};
  if(pos===1){ unlock('a_league'); addHighlight('🏆 '+secLabel()+' 联赛夺冠！'); }
  else if(pos<=3){ addHighlight('🥉 '+secLabel()+' 联赛第'+pos+'，登上领奖台'); }
  return res;
}

/* 随机赛程：混合强/中/弱队，乱序；联赛偶尔遭遇婷婷队 */
function genSchedule(){
  var pool = G.curTeams.filter(function(t){ return !t.isTing; });
  var arr = pool.map(function(t){
    return {name:t.name, base:t.base, isTing:false, trait:t.trait, roster:t.roster,
      injMul:(rng()<0.16?0.82:1), moraleMul:(rng()<0.30?(rng()<0.5?1.12:0.9):1)};
  });
  arr.sort(function(a,b){ return b.base-a.base; });
  var n=arr.length;
  var strong=arr.slice(0, Math.floor(n*0.25));
  var weak=arr.slice(Math.floor(n*0.70));
  var mid=arr.slice(Math.floor(n*0.25), Math.floor(n*0.70));
  var picks=[];
  picks.push(strong[Math.floor(rng()*strong.length)]);
  picks.push(weak[Math.floor(rng()*weak.length)]);
  while(picks.length<5) picks.push(mid[Math.floor(rng()*mid.length)]);
  if(rng()<0.30){ // 联赛也可能遭遇婷婷队（额外 rivalry）
    var ting=G.curTeams.filter(function(t){return t.isTing;})[0];
    if(ting) picks[Math.floor(rng()*picks.length)] = {name:ting.name, base:ting.base, isTing:true, trait:ting.trait, roster:ting.roster,
      injMul:(rng()<0.16?0.82:1), moraleMul:(rng()<0.30?(rng()<0.5?1.12:0.9):1)};
  }
  for(var i=picks.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=picks[i]; picks[i]=picks[j]; picks[j]=t; }
  return picks;
}
function setupLeague(){
  G.ctx='league';

/* 当前可选手策略（根据对手强弱/自身状态上下文筛选 4 个） */
function currentStrats(opp){
  var strong = (oppEff(opp, G.ctx==='cup') > teamPower()*1.06) || opp.isTing;
  var arr = ['balanced'];
  arr.push(strong ? 'focus' : 'aggro');
  arr.push('defense'); arr.push('tempo');
  if(G.injury || G.stats.stamina<38){
    arr = arr.filter(function(x){ return x!=='aggro'; });
    if(arr.indexOf('save')<0) arr.push('save');
  }
  // 保证能“克制”对手本场策略的那套个人策略始终可选
  if(opp.activeStrat && arr.indexOf(opp.activeStrat.counter)<0){
    var c = opp.activeStrat.counter;
    var idx = arr.indexOf('aggro');
    if(idx>=0) arr[idx]=c; else if(arr.length<4) arr.push(c); else arr[arr.length-1]=c;
  }
  return arr.slice(0,4);
}

/* 个人技术统计（得分/篮板/助攻/抢断/盖帽/失误/命中率）
   oppStrat 为对手本场随机策略：会改变你的得分环境（如铁桶压制得分、紧逼制造失误）。
   forcePts：强制个人得分（用于逐节合成后的总分，且必 <= 全队总分）。 */
function genBox(strat, win, oppStrat, forcePts){
  var st=G.stats, w=TEMPLATE_BOX[G.template];
  var oS = oppStrat||null;
  var off=(strat.ptsMul||1)*(oS?(oS.pPtsMul||1):1)*(win?1.04:0.96);
  var fat = (st.stamina<40)? 0.8 : 1;   // 体力不足 20% 能力削弱
  var fgPct=clamp(0.30 + st.skill*0.0045 + st.conf*0.002 + (strat.offMul-1)*0.22, 0.24, 0.68);
  var pts=Math.round(clamp((8 + (st.skill*0.10 + st.agility*0.03 + st.conf*0.03 + st.height*0.02)*off*(0.8+rng()*0.45)), 0, 9999)*fat);
  if(forcePts!=null) pts = forcePts;
  // 约束：个人得分不得超过全队总分
  var capYS = (G.curMatch && G.curMatch.ys!=null) ? G.curMatch.ys : 9999;
  if(pts>capYS) pts = capYS;
  var reb=Math.round((1.5 + st.height*0.05 + st.strength*0.035) * w.reb * (0.8+rng()*0.4) * fat);
  var ast=Math.round((0.8 + st.skill*0.05 + st.agility*0.03) * w.ast * (strat.astMul||1) * (0.7+rng()*0.6) * fat);
  var stl=Math.round((0.4 + st.agility*0.035) * w.stl * (strat.stlMul||1) * (oS?(oS.pStlMul||1):1) * (0.6+rng()*0.8) * fat);
  var blk=Math.round((0.25 + st.height*0.03 + st.strength*0.03) * w.blk * (strat.blkMul||1) * (oS?(oS.pBlkMul||1):1) * (0.5+rng()*0.9) * fat);
  var tov=Math.round(clamp((3.2 - st.skill*0.02 - st.agility*0.012) * (strat.tovMul||1) * (oS?(oS.pTovMul||1):1) * (0.7+rng()*0.6), 0, 12));
  var fga=Math.round(pts*0.85 + 4 + rng()*5);
  var fgm=Math.round(clamp(fga*fgPct, 0, fga));
  if(pts>0 && fgm===0) fgm=1;
  return {pts:pts, reb:reb, ast:ast, stl:stl, blk:blk, tov:tov, fgm:fgm, fga:fga};
}
function accStats(box, win){
  var s=G.seasonStats, c=G.careerStats;
  ['pts','reb','ast','stl','blk','tov','fgm','fga'].forEach(function(k){ s[k]+=box[k]; c[k]+=box[k]; });
  s.g++; c.g++; if(win){ s.w++; c.w++; } else { s.l++; c.l++; }
}
/* 比赛完美数据 → 额外成长激励：不同表现类型给不同属性的“分项成长激励”（自信抬升 + 对应属性成长基数抬升，单项封顶 6%） */
function applyPerfMotivation(box, win){
  var M = G.motivation || (G.motivation={skill:0,strength:0,agility:0,pop:0,conf:0,stamina:0});
  var CAP = 0.06;
  function add(key, amt){ if(M[key]!=null) M[key]=Math.min(CAP, M[key]+amt); }
  var cats=[box.pts,box.reb,box.ast,box.stl,box.blk];
  var dd=cats.filter(function(v){return v>=10;}).length;   // 达到两双/三双门槛的项数
  var confAdd=0, motList=[];
  // 各类表现 → 不同属性成长激励
  if(box.pts>=28){ add('skill',0.0025); motList.push('爆分·技术'); }
  if(box.reb>=12){ add('strength',0.0025); motList.push('篮板·力量'); }
  if(box.ast>=10){ add('agility',0.0018); add('pop',0.0018); motList.push('助攻·敏捷/人气'); }
  if(box.stl>=5){ add('agility',0.0018); motList.push('抢断·敏捷'); }
  if(box.blk>=4){ add('strength',0.0018); motList.push('盖帽·力量'); }
  // 综合型数据额外全面激励
  if(dd>=3){ ['skill','strength','agility','pop'].forEach(function(k){ add(k,0.0015); }); confAdd=6; motList.push('三双·全面'); }
  else if(dd===2){ ['skill','strength','agility','pop'].forEach(function(k){ add(k,0.001); }); confAdd=3; }
  else if((box.stl+box.blk)>=6){ confAdd=2; motList.push('防守大闸'); }
  else if(dd===1){ confAdd=1.5; motList.push((box.pts>=10?'得分':box.reb>=10?'篮板':box.ast>=10?'助攻':box.stl>=10?'抢断':'盖帽')+'上双'); }
  if(confAdd>0){
    G.stats.conf=Math.max(0, G.stats.conf+confAdd);
    var pctTxt = ['skill','strength','agility','pop','stamina'].filter(function(k){return (M[k]||0)>0;})
                   .map(function(k){ return ({skill:'技术',strength:'力量',agility:'敏捷',pop:'人气',stamina:'体力'}[k]) + ' +'+(M[k]*100).toFixed(1)+'%'; }).join(' ');
    var label = motList.join(' · ');
    addHighlight('⭐ '+secLabel()+' '+label+'！自信 +'+confAdd+(pctTxt?('，成长激励 '+pctTxt):'')+'（训练中生效）');
    diary(secLabel(), '完美数据：'+label+'。分项成长激励 → '+pctTxt+'。');
  }
}
function maybeInjury(strat, win){
  if(G.resting) return;   // 休战不上场，不触发受伤
  if(G.injury){ G.injury.gamesLeft--; if(G.injury.gamesLeft<=0) G.injury=null; return; }
  // 体力越低越易伤：<40 风险×1.6，<20 再×1.9（约 3 倍）
  var risk=(strat.risk||0) * (G.stats.stamina<40?1.6:1) * (G.stats.stamina<20?1.9:1) * (G.age<14?1.2:1);
  if(rng()<risk){
    var sev=1+Math.floor(rng()*2), games=1+Math.floor(rng()*3);
    G.injury={gamesLeft:games, sev:sev};
    diary(secLabel(), '比赛中意外受伤（伤情 '+sev+'/2），预计休战 '+games+' 场。');
    addHighlight('🩹 意外受伤！后续比赛状态与数据将受影响');
  }
}
function genPostChoices(win, opp){
  var pool=POST_POOL.slice(), out=[];
  if(opp.isTing){ var t=pool.find(function(c){return c.onlyTing;}); if(t) out.push(t); }
  while(out.length<3 && pool.length){
    var i=Math.floor(rng()*pool.length), c=pool.splice(i,1)[0];
    if(c.onlyTing && !opp.isTing) continue;
    out.push(c);
  }
  return out;
}
function applyPostChoice(ch){
  var st=G.stats, e=ch.eff, fr=ch.fr;
  // 仅影响短期状态与友情，不叠加永久养成属性，保持平衡
  if(e.stamina) st.stamina=clamp(st.stamina+e.stamina,0,stamCap());
  if(e.morale) G.teamMorale=clamp((G.teamMorale||0)+e.morale,-3,3);
  if(e.form) G.form=clamp(G.form+e.form+(rng()-0.5)*0.2,-3,3);
  if(e.rel) G.flags.relTing=clamp((G.flags.relTing||0)+e.rel,-3,3);
  if(fr) for(var fk in fr){
    var fv=fr[fk];
    if(fk==='ting'){ G.flags.relTing=clamp((G.flags.relTing||0)+fv,-3,3); }
    else if(G.friends && G.friends[fk]!=null){ G.friends[fk]=clamp(G.friends[fk]+fv,0,100); }
    pushAxisFeed('friend', fv, FR_NAME[fk]||fk);
  }
  syncAxes();
}

/* 进入下一场（赛前策略界面） */
function beginPrematch(){
  G.resting=false; G.matchStamMod=0;   // 每场重置“休战”标记与强度选择，避免上一场残留
  if(G.ctx==='cup'){
    if(G.cup.advanced===false){ endCup(); return; }
    if(G.cup.idx>=G.cup.playerPath.length){ endCup(); return; }
    G.curOpp=G.cup.playerPath[G.cup.idx];
  } else {
    if(G.league.idx>=G.league.schedule.length){ endLeague(); return; }
    G.curOpp=G.league.schedule[G.league.idx];
  }
  G.prematchStep='time'; G.minutes=0;
  ensureOppRoster(G.curOpp);   // 预生成对手阵容并设定其本场初始体力（非满血）
  rollOppStrat(G.curOpp);   // 开赛前：从对手的两套相互克制策略里随机抽一套
  G.screen='prematch'; render();
}

/* 赛前选择上场时间：每 2 分钟消耗 1 点体力，打满全场（40 分钟）额外消耗，共 30 点 */
function pickMinutes(mins){
  if(G.screen!=='prematch' || G.prematchStep!=='time') return;
  var cost = Math.floor(mins/2);   // 每 2 分钟耗 1 点体力：48→24, 36→18, 24→12, 12→6
  G.stats.stamina = clamp(G.stats.stamina - cost, 0, stamCap());
  G.minutes = mins;
  G.prematchStep='strat';
  render();
}

/* 本场“投入强度”选择：个人越拼，队友消耗越多（-20% / -5% / 0 / +5%；不上场 +25% 由 rest 处理） */
var MATCH_INTEN = [
  {key:'easy',    n:'养生',     mod:-0.20, hint:'你少出力，队友省着打'},
  {key:'light',   n:'省着打',   mod:-0.05, hint:'保守消耗，队友略省力'},
  {key:'balance', n:'均衡',     mod:0,     hint:'正常节奏'},
  {key:'hard',    n:'拼尽全力', mod:0.05,  hint:'你冲在前，队友跟着拼命'}
];
function setMatchIntensity(key){
  if(G.screen!=='prematch' || G.prematchStep!=='time') return;
  var it = MATCH_INTEN.filter(function(x){return x.key===key;})[0]; if(!it) return;
  G.matchStamMod = it.mod; render();
}
/* 赛前决策：上场 / 休息。休息 = 本场休战，恢复体力、避免受伤，但队伍战力下降、你无个人数据 */
function prematchDecision(mode){
  if(G.screen!=='prematch' || G.prematchStep!=='time') return;
  if(mode==='rest'){
    G.resting=true; G.minutes=0; G.matchStamMod=0.25;   // 不上场 → 队友多扛，消耗 +25%
    G.stats.stamina = clamp(G.stats.stamina + stamCap()*0.18, 0, stamCap());   // 休战恢复约 18% 体力
    G.prematchStep='strat';
    prematchPick('balanced'); return;   // 以稳健策略模拟本场（你作壁上观）
  }
  render();   // mode==='play'：留在时间选择步，自行选上场时间
}
/* 选策略 → 模拟本场 → 赛果界面 */
function prematchPick(key){
  if(G.screen!=='prematch') return;
  var strat=STRATS[key]; if(!strat) return;
  var isCup=(G.ctx==='cup'), opp=G.curOpp;
  var formMul=1+G.form*0.05, moraleMul=moraleStrMul();
  var injMul=G.injury?(1-G.injury.sev*0.12):1;
  // 对手本场策略：抬升/压低其战力，并可在你“恰好克制”它时给一点加成
  var oStrat = opp.activeStrat||null;
  var oOffMul = oStrat ? (oStrat.offMul||1) : 1;
  var matchup = (oStrat && oStrat.counter===key) ? 1.05 : 1;   // 选对克制策略 → 战力 +5%
  // 对手学校特性方向性攻防：进攻倾向 oppOffMul（>1 其得分涨）、防守强度 oppDefMul（>1 你得分被压）
  var oppTr = TRAIT_BY[opp.trait] || TRAIT_BY.allround;
  var oppOffMul = oOffMul * (oppTr.offMul||1);
  var oppDefMul = (oppTr.defMul||1);
  if(isCup && G.cup.isTwoLeg){
    // 初中杯两回合 = 两场四节制比赛（单节上限 108、罚球 132，四节不设硬上限；逐场、逐节均满足 个人<全队）
    var restMul = G.resting?0.72:1;
    var youE_2 = teamPower()*strat.offMul*formMul*moraleMul*injMul*matchup*(G.stats.stamina<40?0.8:1)*restMul;
    var oppE_2 = oppEff(opp,true)*(opp.injMul||1)*(opp.moraleMul||1)*oOffMul;
    applyMatchStamina(G.resting?0:G.minutes, key, opp);
    youE_2 *= avgStaminaFactor(lineupTeammates().concat([{stam:G.stats.stamina, stamMax:stamCap()}]));
    oppE_2 *= avgStaminaFactor(oppStarters(opp));
    var tl=simTwoLeg(youE_2, oppE_2, oppOffMul, oppDefMul);
    // 逐场装饰：生成个人数据 + 四节分布（个人每节 < 全队每节）
    G.curMatch={ys:9999};                 // 临时占位，避免 genBox 误用上一场的 cap
    tl.l1 = decorateTwoLegLeg(tl.l1, strat, oStrat);
    tl.l2 = decorateTwoLegLeg(tl.l2, strat, oStrat);
    G.curMatch=null;
    // 汇总（展示用）：四节相加；个人汇总分 < 全队汇总分
    var aggBox={}; ['pts','reb','ast','stl','blk','tov','fgm','fga'].forEach(function(k){ aggBox[k]=tl.l1.box[k]+tl.l2.box[k]; });
    var res={win:tl.win, ys:tl.ay, os:tl.ao, twoleg:tl, opp:opp.name, isTing:!!opp.isTing, p:0.5, box:aggBox};
    if(G.resting){ ['pts','reb','ast','stl','blk'].forEach(function(k){ aggBox[k]=Math.round(aggBox[k]*0.25); }); }   // 休战：个人数据大幅缩水
    res.qy=[0,0,0,0]; res.qo=[0,0,0,0]; res.qpts=[0,0,0,0];
    for(var qi=0;qi<4;qi++){ res.qy[qi]=tl.l1.qy[qi]+tl.l2.qy[qi]; res.qo[qi]=tl.l1.qo[qi]+tl.l2.qo[qi]; res.qpts[qi]=tl.l1.qpts[qi]+tl.l2.qpts[qi]; }
    applyPerfMotivation(aggBox,res.win);
    applyMatchExperience(aggBox, res.win, oppEff(opp,true), G.minutes);   // ④ 实战直接涨经验（两回合合计）
    res.strat=key; res.stratName=strat.name;
    accStats(aggBox,res.win);
    checkBoxStats(tl.l1.box); checkBoxStats(tl.l2.box); checkMilestones();
    maybeInjury(strat,res.win);
    G.teamMorale=clamp((G.teamMorale||0)+(res.win?0.3:-0.35)+(rng()-0.5)*0.4,-3,3);
    var comm=commentary(res);
    if(res.win && aggBox.pts>=24){ addHighlight('🔥 '+secLabel()+' 两回合狂砍 '+aggBox.pts+' 分率队晋级！'); queueFanfare('🔥','两回合狂砍 '+aggBox.pts+' 分！','淘汰赛火力全开', 'win'); }
    else if(res.win && Math.abs(res.ys-res.os)>=20){ queueFanfare('🏆','两回合净胜 '+Math.round(res.ys-res.os)+' 分！','碾压级晋级', 'win'); }
    else if(!res.win && Math.abs(res.ys-res.os)<=3) addHighlight('😤 '+secLabel()+' 两回合一分惜败，虽败犹荣');
    G.curMatch=res; G.curMatchComm=comm; G.curMatchChoices=genPostChoices(res.win,opp);
    G.matchQuarter=0; res.moments=genMoments(res,key,opp);
    G.screen='match'; render();
    return;
  }
  // 【联赛 / 高中杯 BO5：逐节生成骨架】—— 比分与数据在每节 reveal 时生成，第 4 节 finalize
  var restMul = G.resting?0.72:1;
  var youBaseE = teamPower()*formMul*moraleMul*injMul*(G.stats.stamina<40?0.8:1)*restMul;
  var oppBaseE = oppEff(opp,isCup)*(opp.injMul||1)*(opp.moraleMul||1)*oOffMul;
  applyMatchStamina(G.resting?0:G.minutes, key, opp);
  youBaseE *= avgStaminaFactor(lineupTeammates().concat([{stam:G.stats.stamina, stamMax:stamCap()}]));
  oppBaseE *= avgStaminaFactor(oppStarters(opp));
  var youE0 = youBaseE*strat.offMul*matchup;
  var oppE0 = oppBaseE;
  var p = clamp(Math.pow(youE0,1.8)/(Math.pow(youE0,1.8)+Math.pow(oppE0,1.8)) + (strat.winBonus||0) + (rng()-0.5)*0.08, 0.08, 0.92);
  G.curMatch = {
    strat:key, stratName:strat.name, opp:opp.name, isTing:!!opp.isTing, oppRef:opp, oStrat:oStrat,
    youBaseE:youBaseE, oppBaseE:oppBaseE, p:p, oppOffMul:oppOffMul, oppDefMul:oppDefMul,
    qy:[0,0,0,0], qo:[0,0,0,0], qpts:[0,0,0,0], qinten:['hold','hold','hold','hold'],
    ys:0, os:0, win:false, box:null, moments:null
  };
  // 逐节独立生成：单节上限 108（罚球 2+1 达 132），四节不设硬上限（具体见 revealQuarter）
  G.matchQuarter=0; G.screen='match'; render();
}
/* 赛后统一回复：主角 / 队友 / 对手，全部按“自身体力上限的 RECOVER_PCT”回复 —— 恢复规则与主角完全一致 */
var RECOVER_PCT = 0.05;
function recoverAfterMatch(){
  G.stats.stamina = clamp(G.stats.stamina + stamCap()*RECOVER_PCT, 0, stamCap());   // 主角：固定首发，按主角体力上限回复
  (G.teammates||[]).forEach(function(p){ var mx=p.stamMax||100; p.stam = clamp((p.stam!=null?p.stam:mx) + mx*RECOVER_PCT, 0, mx); });
  if(G.curOpp && G.curOpp.roster){ G.curOpp.roster.forEach(function(p){ var mx=p.stamMax||100; p.stam = clamp((p.stam!=null?p.stam:mx) + mx*RECOVER_PCT, 0, mx); }); }
}
/* 赛后交流 → 推进（下一场 / 赛季总结 / 杯赛下一轮） */
function matchContinue(idx){
  if(G.screen!=='match') return;
  var ch=G.curMatchChoices[idx]; if(ch) applyPostChoice(ch);
  recoverAfterMatch();   // 所有人（主角/队友/对手）按同一规则恢复，与主角一致
  // 成果轴：赢球积累成果（双婷对决额外加分）
  var m0=G.curMatch;
  if(m0){
    if(m0.win){
      var rGain = 1 + (m0.isTing?2:0);
      G.axes.result += rGain;
      pushAxisFeed('result', rGain, m0.isTing?'双婷对决获胜':(G.ctx==='cup'?'杯赛晋级':'比赛获胜'));
      // 挫折后的崛起（才能开花）：上一场崩盘后，这场干脆利落赢回来
      if(G.chokeActive){ G.chokeActive=false; queueAwaken('rise','rise','低谷崛起·觉醒'); }
    } else {
      // 关键战崩盘（挫折）：一定概率触发，埋下“崛起”伏笔
      if(!G.chokeActive && rng()<0.22){
        G.chokeActive=true;
        G.setbacks.push({y:G.year, t:'关键战崩盘'});
        G.eventQueue.push('choke');
      }
    }
  }
  if(G.ctx==='cup'){
    var c=G.cup;
    G.seasonGames = (G.seasonGames||0) + 1;   // 本赛季比赛数 +1（用于成长缩放）
    if(c.isTwoLeg){
      // 【初中杯两回合：单场即定胜负，逻辑不变】
      c.youLog.push(buildCupEntry(G.curMatch, G.curOpp, c.roundNames[c.idx]));
      if(G.curMatch.win){ if(G.curOpp.isTing) unlock('a_ting'); queueAwaken('aw_ting','aw_ting','宿敌终结·觉醒'); c.idx++; }
      else { c.youElim=c.roundNames[c.idx]; c.idx=999; }
      G.curMatch=null; G.curMatchChoices=null; G.curMatchComm=null;
      if(c.idx>=c.playerPath.length || c.youElim || c.advanced===false){ endCup(); }
      else beginPrematch();
    } else {
      // 【高中杯五局三胜：逐场交互系列赛】每场都是四节，先到 3 胜晋级
      c.seriesGames = c.seriesGames||[];
      c.seriesGames.push({ys:G.curMatch.ys, os:G.curMatch.os, win:G.curMatch.win, box:G.curMatch.box,
                          qy:G.curMatch.qy.slice(), qo:G.curMatch.qo.slice(), qpts:G.curMatch.qpts.slice()});
      if(G.curMatch.win) c.seriesY=(c.seriesY||0)+1; else c.seriesO=(c.seriesO||0)+1;
      G.curMatch=null; G.curMatchChoices=null; G.curMatchComm=null;
      if(c.seriesY>=3){ if(G.curOpp.isTing) unlock('a_ting'); queueAwaken('aw_ting','aw_ting','宿敌终结·觉醒'); c.youLog.push(buildCupEntrySeries(c)); c.idx++; c.seriesY=0; c.seriesO=0; c.seriesGames=[]; if(c.idx>=c.playerPath.length || c.advanced===false) endCup(); else beginPrematch(); }
      else if(c.seriesO>=3){ c.youElim=c.roundNames[Math.min(c.idx,c.roundNames.length-1)]; c.youLog.push(buildCupEntrySeries(c)); c.idx=999; endCup(); }
      else beginPrematch();   // 系列赛未分胜负 → 下一场
    }
  } else {
    var m=G.curMatch;
    G.seasonGames = (G.seasonGames||0) + 1;   // 本赛季比赛数 +1
    G.league.games.push({opp:G.curOpp.name, isTing:!!G.curOpp.isTing, win:m.win, ys:m.ys, os:m.os, box:m.box, strat:m.stratName});
    G.league.idx++;
    G.curMatch=null; G.curMatchChoices=null; G.curMatchComm=null;
    if(G.league.idx>=G.league.schedule.length) endLeague();
    else beginPrematch();
  }
}
function endLeague(){
  var L=G.league, s=G.seasonStats;
  var avg=s.g?Math.round(s.pts/s.g):0;
  G.lastLeague={pos:G.rank, w:s.w, l:s.l, diff:0, avg:avg, period:periodName(), games:L.games.slice()};
  if(s.w===s.g && s.g>0) addHighlight('🏆 '+secLabel()+' 联赛全胜！场均 '+avg+' 分');
  else if(s.w>=Math.ceil(s.g*0.6)) addHighlight('💪 '+secLabel()+' 联赛 '+s.w+'胜'+s.l+'负，渐入佳境');
  if(G.rank===1){ G.axes.result+=4; pushAxisFeed('result',4,'联赛夺冠'); addTrophy('🥇', periodName()+'联赛冠军'); }
  else if(G.rank<=3){ G.axes.result+=2; pushAxisFeed('result',2,'联赛上游'); }
  if(s.g>0 && s.w===s.g) addTrophy('💯', periodName()+'全胜之师');
  G.screen='league'; render();
}
function commentary(m){
  var b=m.box, lines=[];
  if(m.win){
    if(b.pts>=26) lines.push('今天她彻底杀疯了，狂砍 '+b.pts+' 分，率队拿下关键胜利！');
    else if(b.pts>=16) lines.push('稳扎稳打，她用 '+b.pts+' 分的表现带走比赛。');
    else lines.push('虽然数据不炸，但她用防守和团队配合笑到了最后。');
  } else {
    if(Math.abs(m.ys-m.os)<=4) lines.push('惜败！最后时刻就差一口气，但她的 '+b.pts+' 分依旧亮眼。');
    else lines.push('这场被对手压制，'+b.pts+' 分难救主，回去得好好总结。');
  }
  if(b.stl>=4) lines.push('全场比赛她送出 '+b.stl+' 次抢断，防守端存在感拉满。');
  if(b.ast>=6) lines.push(b.ast+' 次助攻盘活全队，是进攻发动机。');
  if(b.blk>=3) lines.push(b.blk+' 次火锅守护篮下，威慑力十足。');
  if(b.tov>=6) lines.push('不过 '+b.tov+' 次失误也提醒她：节奏还得再稳一点。');
  return lines[Math.floor(rng()*lines.length)] || '一场激烈的较量。';
}
/* 三轴成长轨迹曲线（每季末快照：奋斗/成果/友情 三条线） */
function axisTrajectorySVG(){
  var L=G.axisLog; if(!L||!L.effort||L.effort.length<2) return '';
  var n=L.effort.length;
  var eMax=Math.max.apply(null, L.effort.concat([40]));
  var rMax=Math.max.apply(null, L.result.concat([30]));
  function line(arr,max,col,lw){
    var pts=arr.map(function(v,i){
      var x=12+(i/(n-1))*(300-24);
      var y=118-6-(clamp(v/max,0,1))*(118-22);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="'+(lw||2.2)+'" stroke-linejoin="round"/>';
  }
  return '<svg viewBox="0 0 300 124" width="100%">'+
    line(L.effort,eMax,'#e89a2a')+line(L.result,rMax,'#6fae46')+line(L.friend,100,'#e8609a')+'</svg>';
}
/* 技术统计条形图（场均） */
function statsChartSVG(s){
  if(!s||!s.g) return '';
  var a={pts:s.pts/s.g, reb:s.reb/s.g, ast:s.ast/s.g, stl:s.stl/s.g, blk:s.blk/s.g};

  var max=Math.max(a.pts,a.reb,a.ast,a.stl,a.blk,1), w=300,h=130,bw=42,gap=(w-keys.length*bw)/(keys.length+1);
  var bars=keys.map(function(k,i){

  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%">'+bars+'</svg>';

function boxScoreHTML(box){

/* ===== 校队杯：初中=32强两回合淘汰；高中=32进16小组赛+三局两胜淘汰 ===== */
function cupYouEff(){
  return teamPower() * (1 + G.form*0.05) * (0.9 + G.stats.conf/300) * (0.88 + G.stats.stamina/400);
}
function oppEff(t, isCup){
  var ff = fieldFactor(curYear());
  if(t.isTing){
    // 婷婷队以“校队 base”为实力基准（430~550，始终高于所有普通强队），保证她是真正的终极 BOSS、
    // 决赛永远是最硬的一战；若对象未带 base（极少见）则回退到个人战力换算。
    var base = (typeof t.base==='number') ? t.base : (tingPower()*0.7 + 20);
    // 初中杯她略收一格（给认真培养的玩家留窗口）；高中杯是终极关卡，大赛加成拉满
    var cupK = isHigh() ? 1.18 : 1.06;
    return base * (isCup ? cupK : 1.02) * ff;
  }
  return (t.base + rosterBonus(t))*ff;
}
/* 固定种子签表：你的校队 = 上半区 1 号位，婷婷队 = 下半区 1 号位。
   两强各守半区，一路赢下去就必然在决赛上演“双婷对决”。 */
/* 标准种子签位：玩家=1号种子、婷婷=2号（决赛BOSS），其余队按实力升序填入签位。
   这样玩家每轮对手由弱到强、决赛才遇婷婷，难度平滑且“努力就能走到决赛”的体验可控。 */
function bracketSlotOrder(n){
  if(n===32) return [1,32,17,16,9,24,25,8,5,28,21,12,13,20,29,4,3,30,19,14,11,22,27,6,7,26,23,10,15,18,31,2];
  return [1,16,9,8,5,12,13,4,3,14,11,6,7,10,15,2]; // 16 强淘汰
}
function seedField(teams, youName, bossName, bossObj){
  // teams：不含 you/boss 的对手数组；按 oppEff 升序 → seed3=最强, seedN=最弱（玩家路径由弱到强）
  var opp = teams.map(function(t){ return {ref:t, eff:oppEff(t,true)}; })
                  .sort(function(a,b){ return a.eff-b.eff; });
  var bySeed={};
  bySeed[1]={name:youName, you:true, isTing:false, base:0};
  // BOSS（婷婷）固定为 2 号种子、且以真实校队 base 为实力基准，确保她是总决赛最难的一战
  var bossBase = (bossObj && typeof bossObj.base==='number') ? bossObj.base
               : (teams[0]&&teams[0].base!=null ? Math.max.apply(null,teams.map(function(t){return t.base||0;}))*1.15 : 470);
  bySeed[2]={name:bossName, isTing:true, you:false, base:bossBase};
  var N=opp.length+2;
  for(var s=3;s<=N;s++){ bySeed[s]=opp[N-s].ref; }   // s=3→opp[last]最强, s=N→opp[0]最弱
  var so=bracketSlotOrder(N);
  return so.map(function(sd){ return bySeed[sd]; });
}
function seededField(){
  var others=[], ting=null;
  G.curTeams.forEach(function(t){
    if(t.isTing){ ting=t; }
    // 排除玩家自己的校队：它已作为 1 号种子，不应再作为普通对手（否则会自我对战、且签表尺寸错乱）
    else if(!(t.you || t.name===G.school)) others.push(t);
  });
  // 防御：若玩家误选了婷婷队当主队，curTeams 中会缺少婷婷队——此处补一个，避免 null 进入签表导致崩溃
  if(!ting){ ting={name:'实验中学·婷婷队', base:430, isTing:true, you:false}; }
  return seedField(others, G.school, ting.name, ting);
}
/* 非玩家对局：
   - 婷婷队是剧本里的终极 BOSS——她在玩家之外的对局里永远晋级（确定性），确保“双婷决战”成为固定终章；
   - 其余对局按实力决定性晋级（确定性），避免冷门打乱“由弱到强”的难度曲线；
   玩家自己的比赛仍由 genGame 真实模拟，保留不确定性与翻盘可能。 */
function simOtherPair(a, b){
  if(a.isTing || b.isTing){
    if(a.isTing && b.isTing) return rng()<0.5 ? a : b;   // 双婷对决（理论上不会触发）
    return a.isTing ? a : b;
  }
  var we=oppEff(a, true), oe=oppEff(b, true);
  return we>=oe ? a : b;
}
/* 按签表顺序两两配对（不再洗牌），胜者按原顺序进入下一轮，保持半区结构 */
function pairSeq(cur){
  var pairs=[];
  for(var i=0;i<cur.length;i+=2){
    var a=cur[i], b=cur[i+1];
    if(a.you||b.you) pairs.push({hasYou:true, you:a.you?a:b, opp:a.you?b:a});
    else pairs.push({hasYou:false, a:a, b:b});
  }
  return pairs;
}
function simTwoLeg(youE, oppE, oOffMul, oDefMul){
  var l1=simScore(youE,oppE,null,oOffMul,oDefMul), l2=simScore(youE,oppE,null,oOffMul,oDefMul);
  var ay=l1.y+l2.y, ao=l1.o+l2.o;
  var win = ay>ao || (ay===ao && rng() < (0.5 + G.stats.conf/400));
  return {l1:l1, l2:l2, ay:ay, ao:ao, win:win};
}
function simBO3(youE, oppE, oOffMul, oDefMul){
  var games=[]; var yw=0, ow=0;
  for(var i=0;i<3 && (yw<2 && ow<2); i++){
    var s=simScore(youE,oppE,null,oOffMul,oDefMul); games.push(s); if(s.win) yw++; else ow++;
  }
  return {games:games, yw:yw, ow:ow, win: yw>ow};
}
function simBO5(youE, oppE, oOffMul, oDefMul){
  var games=[]; var yw=0, ow=0;
  for(var i=0;i<5 && (yw<3 && ow<3); i++){
    var s=simScore(youE,oppE,null,oOffMul,oDefMul); games.push(s); if(s.win) yw++; else ow++;
  }
  return {games:games, yw:yw, ow:ow, win: yw>ow};
}

/* 初中杯：32 强两回合（主客场）淘汰。玩家固定上半区 1 号位，婷婷下半区 1 号位。
   干跑整张签表（玩家默认晋级）以确定玩家每一轮的对手，保证双婷在决赛相遇。 */
function startCupMid(){
  var field=seededField();
  field.forEach(function(t){ if(!t.you){ t.injMul=(rng()<0.14?0.82:1); t.moraleMul=(rng()<0.30?(rng()<0.5?1.12:0.9):1); } });
  var cur=field, path=[];

/* 高中杯：32 进 16 小组赛 + 三局两胜淘汰。小组赛自动模拟并展示，玩家 3 场小组战为焦点；
   之后 16 强淘汰（玩家固定上半区、婷婷下半区）走交互流程。 */
function startCupHigh(){
  var field=seededField();
  field.forEach(function(t){ if(!t.you){ t.injMul=(rng()<0.14?0.82:1); t.moraleMul=(rng()<0.30?(rng()<0.5?1.12:0.9):1); } });
  var groups=[]; for(var i=0;i<32;i+=4) groups.push(field.slice(i,i+4));
  var grpNames=['A','B','C','D','E','F','G','H'];
  var adv=[], playerGroup=null, playerAdvanced=false;
  groups.forEach(function(g,gi){
    var tbl=groupTable(g, teamPower());
    var ti=-1; for(var k=0;k<tbl.length;k++){ if(tbl[k].isTing){ ti=k; break; } }
    if(ti>1){ var tmp=tbl[1]; tbl[1]=tbl[ti]; tbl[ti]=tmp; }
    if(gi===0 && g[0].you){
      playerGroup={grp:grpNames[gi], rows:tbl.map(function(r){return {name:r.name,you:r.you,isTing:r.isTing,w:r.w};}),
                   pos:tbl.findIndex(function(r){return r.you;})+1};
      playerAdvanced=playerGroup.pos<=2;
    }
    adv.push(tbl[0].team); adv.push(tbl[1].team);
  });
  // 16 强交叉配对改为“标准升序种子”：玩家=1号、婷婷=2号（决赛），其余由弱到强，难度平滑
  var youObj=null, ting16=null, others16=[];

  var ko = seedField(others16, G.school, ting16.name, ting16);

  while(cur.length>1){
    var pairs=pairSeq(cur), next=[], youOpp=null;
    pairs.forEach(function(p){ if(p.hasYou){ youOpp=p.opp; next.push({you:true,name:G.school}); } else next.push(simOtherPair(p.a,p.b)); });
    if(youOpp) path.push(youOpp);
    cur=next;
  }
  G.cup={isHigh:true, isTwoLeg:false, playerPath:path, idx:0, youLog:[],
         roundNames:['16强','八强','四强','决赛'].slice(0,path.length),
         champion:cur[0].name, dryChamp:cur[0].name, youChamp:false, youElim:null,
         advanced:playerAdvanced, group:playerGroup,
         seriesY:0, seriesO:0, seriesGames:[]};
  if(!playerAdvanced) G.cup.youElim='小组赛';
  G.teamMorale=clamp((G.teamMorale||0)+(rng()-0.5)*0.6,-2,2);
  beginPrematch();
}

function runCupTwoLeg(field, youE){
  var roundNames=['32强','16强','八强','四强','决赛'];

      if(p.hasYou){
        var tr2 = TRAIT_BY[p.opp.trait] || TRAIT_BY.allround;
        var res=simTwoLeg(youE, oppEff(p.opp, true), tr2.offMul||1, tr2.defMul||1);
        G.cup.youLog.push({type:'twoleg', round:roundNames[rd], opp:p.opp.name, isTing:!!p.opp.isTing, l1:res.l1, l2:res.l2, ay:res.ay, ao:res.ao, win:res.win});
        if(res.win){ next.push({you:true, name:G.school}); if(p.opp.isTing) unlock('a_ting'); queueAwaken('aw_ting','aw_ting','宿敌终结·觉醒'); }
        else { G.cup.youElim=roundNames[rd]; next.push(p.opp); }
      } else {
        next.push(simOtherPair(p.a, p.b));
      }
    });
    cur=next; rd++;

  var cur=[firsts[0],seconds[1], firsts[1],seconds[0], firsts[2],seconds[3], firsts[3],seconds[2],

        if(res.win){ next.push({you:true, name:G.school}); if(p.opp.isTing) unlock('a_ting'); queueAwaken('aw_ting','aw_ting','宿敌终结·觉醒'); }
        else { G.cup.youElim=roundNames[rd]; next.push(p.opp); }
      } else {

  else addHighlight('😣 高中杯止步'+G.cup.youElim);

function groupTable(g, youE){
  var W={}; g.forEach(function(t){ W[t.name]=0; });
  for(var i=0;i<g.length;i++) for(var j=i+1;j<g.length;j++){
    var a=g[i], b=g[j];
    var sa=a.you?youE:oppEff(a, true), sb=b.you?youE:oppEff(b, true);
    var s=simScore(sa,sb);
    if(s.win) W[a.name]++; else W[b.name]++;
  }
  return g.map(function(t){ return {name:t.name, w:W[t.name], you:t.you, isTing:t.isTing, team:t}; })
          .sort(function(x,y){ return y.w-x.w; });

/* 每赛季评选：MVP（综合评分高且胜率够）与进步奖（较上季明显提升） */

    G.stats.conf=Math.max(0,G.stats.conf+3); G.stats.pop=Math.max(0,G.stats.pop+2);
    G.stamCapBonus=Math.min(40,(G.stamCapBonus||0)+2); G.stats.stamina=stamCap();
    G.axes.result+=2; pushAxisFeed('result',2,'进步奖');
    addHighlight('📈 荣获进步奖！自信 +3，体力上限 +2，越来越多人看到你的成长');
    diary(secLabel(),'你拿下了本赛季的进步奖——一步一个脚印，越来越强。');
  }
  G.lastSeasonAvg=avg;
}
function postSeason(){
  // —— 成长回顾快照：记录本季初值，季末用于展示“个人+团队成长”的满足感 ——
  var _pre = {skill:G.stats.skill, strength:G.stats.strength, agility:G.stats.agility, stamina:G.stats.stamina,
              height:G.stats.height, power:power(G.stats), teamOvr:avgMateOvr(), rank:G.rank};
  G.season++; G.age = 12 + G.season*0.25; G.year = 2010 + Math.floor(G.season*0.25);
  G.specialStage=G.season; G.specialEvents={};   // 每个新阶段重置“每队友 2 段特殊剧情”的额度
  applySchoolGrowth(G.season);   // 各校按“成长剧本”在本季推进实力，联赛格局随之演变
  applyPlayerGrowth(G.season);   // 球员个人（含你校队友）逐季成长：战绩激励 + 随机基础成长
  growBio();   // 每季自然生长（身高/体重/臂展/腿长/鞋码/骨龄 的基础成长值）
  // 赛季“基础成长”：即便本季只做了少量训练，一个赛季的实战与日常也会让核心篮球属性稳步提升，
  // 避免中段（尤其 13–15 岁低谷期）出现“成长停滞感”，让能力曲线持续向上、成就感更扎实。
  (function(){
    var bg = {skill:0.6, strength:0.6, agility:0.6, stamina:0.4};
    var bgMul = (inSlump(G.season)?diffCfg().slump:1) * (1 + G.form*0.05);
    // ③ 年龄成长曲线 + ① 边际递减：低龄/青春期被动成长快、高龄趋缓；属性越高增益越小
    for(var bk in bg){
      var v = bg[bk]*bgMul * dimRet(bk, G.stats[bk]) * ageWin(bk, G.age);
      G.stats[bk] = Math.max(0, G.stats[bk] + v);
    }
  })();
  G.stats.stamina = stamCap();   // 休赛期充分休整，体力回到当前上限
  (G.teammates||[]).forEach(function(p){ if(p.stamMax!=null) p.stam = p.stamMax; });   // 队友：同样休赛期满血
  if(G.curOpp && G.curOpp.roster){ G.curOpp.roster.forEach(function(p){ if(p.stamMax!=null) p.stam = p.stamMax; }); } // 对手：同样休赛期满血
  G.trainLoad = 0;              // ② 休赛期恢复：清零赛季内累积的训练负荷
  advanceWorld();
  computeRank();
  computeSeasonStory();   // 本季战力风云（崛起/掉队），让联赛格局随成长剧本逐季演变、可见可感
  computePlayerStory();   // 联盟球星涌现（巨人中锋长成 2m+ 等）高光提示
  checkMilestones();
  evaluateSeasonAwards();   // 每季末评选 MVP / 进步奖
  // —— 本季成长回顾（个人属性 + 全队平均 OVR + 联赛排名环比），供主界面“成长回顾”卡片展示 ——
  G.lastGrowthRecap = {
    skill:+(G.stats.skill-_pre.skill).toFixed(1),
    strength:+(G.stats.strength-_pre.strength).toFixed(1),
    agility:+(G.stats.agility-_pre.agility).toFixed(1),
    stamina:+(G.stats.stamina-_pre.stamina).toFixed(1),
    height:+(G.stats.height-_pre.height).toFixed(1),
    power:Math.round(power(G.stats)-_pre.power),
    teamOvr:Math.round(avgMateOvr()-_pre.teamOvr),
    rank:G.rank, prevRank:_pre.rank,
    powerNow:Math.round(power(G.stats)), teamOvrNow:Math.round(avgMateOvr())
  };
  if(!G.banner && G.prevRank!=null && G.rank < G.prevRank){
    G.banner = '↑ 校队联赛上升 '+(G.prevRank-G.rank)+' 位，现第 '+G.rank+'/32';
  }
  G.prevRank = G.rank;
  if(G.rank < G.bestRank) G.bestRank = G.rank;
  // 日常羁绊生长（赛马娘式“一起训练”的累积）：让关系网在自然相处中稳步加深，
  // 即使玩家不刻意经营，羁绊阈值事件也会在中段陆续触发，保证“关系网影响结局”的厚度
  if(G.friends.xiaotong!=null) G.friends.xiaotong = clamp((G.friends.xiaotong||0)+3, 0, 100);
  if(G.friends.coach!=null) G.friends.coach = clamp((G.friends.coach||0)+2.5, 0, 100);
  if(G.friends.senpai!=null) G.friends.senpai = clamp((G.friends.senpai||0)+3.5, 0, 100);
  if(G.friends.kouhai!=null) G.friends.kouhai = clamp((G.friends.kouhai||0)+3.5, 0, 100);
  // 美少女梦工厂式·年度反思：每跨过一个学年，在赛季结算处直接回望一次。
  // 放在 postSeason（每季必执行）而非依赖 commit 槽，彻底杜绝“被其他事件吞掉而遗漏”。
  var newYr = Math.floor(G.season/4);
  if(newYr > (G.lastReflectYr||0) && G.season < G.total){
    G.lastReflectYr = newYr;
    G.event = getNode('yearReflect'); G.eventIsStory=false; G.pendingSeason=G.season;
    G.screen='event'; render(); return;
  }
  // 赛马娘式“羁绊裂痕”/美少女梦工厂式“关系波动”：关系熟络即触发一次矛盾→化解弧。
  // 同样放在 postSeason 这处可靠出口，保证中段必有摩擦与和解的戏剧起伏（独立于 commit 空闲槽）。
  var cd = conflictDue();
  if(cd && G.season < G.total){
    G.conflictFired[cd]=true;
    G.event = getNode(cd); G.eventIsStory=false; G.pendingSeason=G.season;
    G.screen='event'; render(); return;
  }
  // 赛马娘式“羁绊阈值事件”：关系跨档即触发（每档一次），与矛盾弧共用 postSeason 这处可靠出口。
  // 旧实现把它放在 commit() 内、位于主线叙事与事件队列之后，导致每个赛季的空闲事件槽都被占满，
  // 羁绊阈值事件几乎从不触发（且连带 sp_b3/kb_b3 的“传承/榜样”觉醒也失踪）。现改在 postSeason 触发，
  // 保证即便玩家不刻意经营，羁绊阈值事件也会在中段陆续冒出来。
  if(fireBondOrYear(G.season)) return;
  var ahead = power(G.stats) >= tingPower();
  if(G.prevTingAhead===false && ahead && !inSlump(G.season)){ G.banner='你反超了婷婷！她咬紧牙关，决心反超。'; queueFanfare('🔥','实力反超婷婷！','你压过了头号死对头，登顶在望', 'power'); }
  G.prevTingAhead = ahead;
  // 蜕变：跨过 13–15 岁低谷后，在 15 岁（season 14）触底反弹
  if(G.season>=14 && !G.breakDone){ transformBreak(); }
  // 三轴轨迹快照（每季末记录一次，用于结局的成长曲线）
  syncAxes();
  G.axisLog.effort.push(G.axes.effort);
  G.axisLog.result.push(G.axes.result);
  G.axisLog.friend.push(G.axes.friend);
  checkMilestones();   // 季末复核：更衣室之魂 / 全明星 / 传奇女王 等综合成就
  if(G.season>=G.total){ G.screen='ending'; }
  else { G.screen='main'; genOffer(); }
  render();
}

/* 蜕变：低谷后触底反弹 */
function transformBreak(){
  var st=G.stats, big=G.crisisHandled;
  var burst = big
    ? {height:2.5, skill:12, strength:9, agility:8, conf:9, stamina:6, pop:5}
    : {height:0.8, skill:4, strength:3, agility:3, conf:3};
  applyEff(burst);
  G.breakDone=true;
  addHighlight(big? '🌟 低谷蜕变！全面进化，强势归来' : '🌱 慢慢找回了状态');
  if(big){
    G.banner='🌟 蜕变！她跨过了瓶颈期，技术、力量、自信全面暴涨，一举反超婷婷！';
    unlock('a_break');
    storyLine(secLabel(),'那段瓶颈期没有白熬——她像换了个人，全面进化，反超了婷婷。');
  }
}

var MEMES = ['meme_fanti','meme_weibo','meme_juhuatao','meme_weixin','meme_manjing','meme_shenma','meme_jiangnan','meme_geili','meme_chaojinv','meme_duang','meme_zhuyao','meme_xiaopingguo','meme_nozuo','meme_xianrou','meme_bilibili','meme_lanshou','meme_honghuang','meme_youyi','meme_geyou','meme_chigua'];
function pickMeme(){
  var cand = MEMES.filter(function(id){
    if(G.seen[id]) return false;
    return Math.abs((NODES[id].yr||0) - G.year) <= 1;
  });
  if(!cand.length) cand = MEMES.filter(function(id){ return !G.seen[id]; });
  if(!cand.length) return null;
  var id = cand[Math.floor(rng()*cand.length)];
  G.seen[id] = true;
  return id;
}
var SPINE = {1:'s1', 4:'s4', 7:'s7', 13:'s13', 16:'s16', 19:'s19', 22:'s22'};
var OPENERS = ['m1','sc1','st1','bday','sick','idol','trans','injury','ting_surge','cold','hot',
               'frd_train','frd_coach','frd_fight','frd_slump',
               'fan','parent','social','rival3','charity','exam','oldfriend','pressure',
               'sp_meet','sp_train','kb_meet','kb_train','choke'];
/* 各类“支线”的开局节点：保证它们在一次通关里都能被开启，支线剧情才可完整体验 */
var BRANCH_OPENERS = ['m1','sc1','st1','frd_train','frd_coach','frd_fight','frd_slump'];
var REPEAT = {bday:1, sick:1, idol:1, trans:1, injury:1, ting_surge:1, cold:1, hot:1,
              frd_train:1, frd_coach:1, frd_fight:1, frd_slump:1,
              fan:1, social:1, charity:1, pressure:1,
              sp_meet:1, sp_train:1, kb_meet:1, kb_train:1, choke:1};
function getNode(id){ return NODES[id]; }
function rollOpener(){
  // 优先保证各类支线都能被体验：未开启的支线开局节点优先抽取
  var pending = BRANCH_OPENERS.filter(function(id){
    if(G.branchesStarted[id]) return false;
    if(NODES[id]._gate && !NODES[id]._gate()) return false;
    return true;
  });
  var pool = OPENERS.filter(function(id){
    if(NODES[id]._gate && !NODES[id]._gate()) return false;
    return REPEAT[id] || !G.seen[id];
  });
  var id;
  // 限时支线（带 _gate，如“低谷陪伴”只在瓶颈期开启）窗口短，优先抽
  var gatedPending = pending.filter(function(id){ return NODES[id]._gate; });
  var pickFrom = gatedPending.length ? gatedPending : pending;
  if(pending.length && rng() < 0.85){
    id = pickFrom[Math.floor(rng()*pickFrom.length)];
  } else {
    if(!pool.length) return null;
    id = pool[Math.floor(rng()*pool.length)];
  }
  G.branchesStarted[id] = true;   // 标记该支线已开启
  if(!REPEAT[id]) G.seen[id] = true;
  return id;
}

function applyEff(eff){
  for(var k in eff){
    var v = eff[k];
    if(k==='rel'){ G.flags.relTing = clamp(G.flags.relTing + v, -3, 3); }
    else if(k==='form'){ G.form = clamp(G.form + v, -3, 3); }
    else if(k.indexOf('t_')===0){
      var sk = k.slice(2);
      if(sk==='height') G.ting.height = G.ting.height + v;
      else G.ting[sk] = Math.max(0, G.ting[sk] + v);
    }     else if(k==='height'){
      G.stats.height = G.stats.height + v;
      growBodyFromHeight(v);
    } else if(k.indexOf('fr_')===0){
      var fk = k.slice(3);
      if(fk==='ting'){ G.flags.relTing = clamp(G.flags.relTing + v, -3, 3); }
      else if(G.friends && G.friends[fk]!=null){ G.friends[fk] = clamp(G.friends[fk] + v, 0, 100); }
      pushAxisFeed('friend', v, FR_NAME[fk]||fk);
    } else {
      G.stats[k] = Math.max(0, G.stats[k] + v);
    }
  }
  syncAxes();
}
function resolveEvent(idx){
  if(G.screen!=='event'||!G.event||!G.event.c) return;
  idx = Math.max(0, Math.min(idx|0, G.event.c.length-1));
  var ch = G.event.c[idx];
  if(!ch) return;
  if(ch.handled) G.crisisHandled = true;
  applyEff(ch.eff);
  if(ch.persona){ G.persona[ch.persona]=(G.persona[ch.persona]||0)+1; }   // 性格萌芽：由选择累积
  balanceTing();
  if(ch.next && NODES[ch.next]){
    // 矛盾的“化解”节点（_peace）紧跟在冲突之后当场呈现，不排队到未来赛季，
    // 避免被其它事件挤掉或游戏结束前来不及播放，保证“摩擦→和解”闭环一定完整。
    if(NODES[ch.next]._peace){ G.event=getNode(ch.next); G.eventIsStory=false; render(); return; }
    G.eventQueue.push(ch.next);
  }
  if(G.event._peace && G.peaceLog && G.peaceLog.indexOf(G.event._peaceName)<0) G.peaceLog.push(G.event._peaceName);
  storyLine(secLabel(), '【'+(G.eventIsStory?'剧情·':'事件·')+G.event.t+'】'+ch.l);
  diary(secLabel(), '【'+(G.eventIsStory?'剧情·':'事件·')+G.event.t+'】'+ch.l);
  G.event=null; G.eventIsStory=false;
  if(G.season>=G.total){ G.screen='ending'; computeRank(); render(); return; }
  if(G.pendingComp){ G.screen='main'; render(); return; }   // 本季活动已确认 → 回主菜单，等玩家点「进入本季赛事」
  G.screen='main'; genOffer(); render(); return;            // 赛季结算类事件（年度反思/矛盾/羁绊）→ 开启下一季
}

function recordAwaken(tag,label){
  if(G.awakened[tag]) return false;
  G.awakened[tag]=true;
  G.awakenings.push({tag:tag, label:label, y:G.year, age:Math.round(G.age*10)/10});
  return true;
}
function queueAwaken(tag,nodeId,label){
  if(recordAwaken(tag,label)){ G.eventQueue.push(nodeId); }
}
/* 矛盾节点：关系“熟络”到一定档位即触发一次冲突弧（每段关系最多一次）。
   直接从 postSeason 触发，与“年度反思”共用赛季结算的可靠出口，不依赖 commit 的空闲事件槽，
   因此中段一定会出现摩擦→化解的戏剧节点。返回应触发的节点 id（已触发过则返回 null）。 */
function conflictDue(){
  var f=G.friends||{}, fl=G.flags||{}, cf=G.conflictFired||{}, sb=(G.setbacks||[]);
  if((f.xiaotong||0)>=34 && !cf['xt_conf']) return 'xt_conf';
  if((f.coach||0)>=30    && !cf['co_conf']) return 'co_conf';
  if((f.senpai||0)>=28   && !cf['sp_conf']) return 'sp_conf';
  if((f.kouhai||0)>=28   && !cf['kb_conf']) return 'kb_conf';
  if((fl.relTing||0)>=1  && !cf['ting_conf']) return 'ting_conf';
  if(sb.length>=1        && !cf['self_conf']) return 'self_conf';
  return null;
}
/* 羁绊阈值事件：关系跨档时返回应触发的节点（每档一次） */
function bondDueNode(){
  var f=G.friends||{};
  var cand=[];
  function chk(who,thr,id){ if((f[who]||0)>=thr && !G.bondFired[id]) cand.push({thr:thr, id:id}); }
  chk('xiaotong',22,'xt_b1'); chk('xiaotong',48,'xt_b2');
  chk('coach',20,'co_b1');   chk('coach',44,'co_b2');
  chk('senpai',14,'sp_b1');  chk('senpai',36,'sp_b2'); chk('senpai',60,'sp_b3');
  chk('kouhai',14,'kb_b1');  chk('kouhai',36,'kb_b2'); chk('kouhai',60,'kb_b3');
  if((G.flags.relTing||0)>=2 && !G.bondFired['ting_bond']) cand.push({thr:0, id:'ting_bond'});
  if(!cand.length) return null;
  // 最低门槛优先：保证各角色（晓彤/教练/学姐/后辈/婷婷）的羁绊阈值事件都能轮到，
  // 而不是被排序靠前的角色一次性占满空闲事件槽
  cand.sort(function(a,b){ return a.thr - b.thr; });
  return cand[0].id;
}
/* 在每季末养成结算处调用：处理羁绊阈值事件（矛盾弧改由 postSeason 直接触发，见下） */
function fireBondOrYear(doneSeason){
  var bnd=bondDueNode();
  if(bnd){
    G.bondFired[bnd]=true;
    if(bnd==='sp_b3') recordAwaken('senpai','传承·觉醒');
    if(bnd==='kb_b3') recordAwaken('kouhai','榜样·觉醒');
    G.event=getNode(bnd); G.eventIsStory=false; G.pendingSeason=doneSeason; G.screen='event'; render(); return true;
  }
  // 年度反思：每满一年（4 季）回望一次，用“已反思到第几学年”保证不会被跳过
  var yr = Math.floor(doneSeason/4);
  if(yr>=1 && yr > (G.lastReflectYr||0)){
    G.lastReflectYr = yr;
    G.event=getNode('yearReflect'); G.eventIsStory=false; G.pendingSeason=doneSeason; G.screen='event'; render(); return true;
  }
  return false;
}

/* ===== 结局 ===== */
function ending(){

  else if(st.skill>=75) flavor='扎实到可怕的基本功（技术'+Math.round(st.skill)+'），是她最硬的底气；';
  else if(st.pop>=70) flavor='人气'+Math.round(st.pop)+'让她成了校园里的小明星；';
  else if(st.study>=68) flavor='学业'+Math.round(st.study)+'与技术兼修，前途不止于球场；';
  // ===== 梦想达成度（开局“梦想宣言”回扣） =====

  var dreamOk = false;

  else if(G.dreamKey==='ting') dreamOk = !!G.achievements.a_ting;
  else if(G.dreamKey==='star') dreamOk = !!G.achievements.a_pop;
  else if(G.dreamKey==='team') dreamOk = (G.axes.friend>=55 || !!G.achievements.a_loyal);
  else if(G.dreamKey==='legend') dreamOk = !!G.achievements.a_legend;

  // ===== 性格萌芽（由养成选择累积） =====

  if(pkArr[0][1]<1) pkW='率真自然';

  else if((f.xiaotong||0)>=30) bondLines.push('你和晓彤的友情愈发深厚，球场上是搭档、场下是姐妹');
  if((f.coach||0)>=60) bondLines.push('教练是你篮球路上最重要的引路人，那句“眼里有光”你记了一辈子');
  if((f.senpai||0)>=60) bondLines.push('高三学姐把队长臂章交到你手里，你接住了那份传承');
  else if((f.senpai||0)>=25) bondLines.push('学姐曾手把手带你入门，教你“篮球不只靠天赋”');
  if((f.kouhai||0)>=60) bondLines.push('你成了后辈眼里的大姐姐，看她长大像看曾经的自己');
  else if((f.kouhai||0)>=25) bondLines.push('有学妹把你当成了榜样，悄悄在周记里写“要像学姐一样”');
  var relT=G.flags.relTing||0;
  if(relT>=2) bondLines.push('你和婷婷从宿敌变成了场下会递水的“半个姐妹”');
  else if(beatTing) bondLines.push('你在校队杯亲手赢下了婷婷，那场较量有了答案');
  else bondLines.push('你和婷婷的较量从童年延续到毕业，谁也没服谁');

  var jny = '这一路，她立下志愿「'+dreamTxt+'」'+(dreamOk?'，并最终做到了——梦想没有落空':'，虽未完全达成，却也走出了属于自己的路')+'。';
  jny += '她'+pkW+'，一路跌跌撞撞却始终向前。';
  if(G.achievements.a_break) jny += '最难忘的是那个瓶颈期——她挺了过来，完成蜕变。';
  if(bondLines.length) jny += '陪她走过的人很多：'+bondLines.join('；')+'。';
  if(G.achievements.a_cup||G.achievements.a_cup_high) jny += '校队杯的奖杯，是她和队友一起拼来的。';
  if(G.achievements.a_ting) jny += '她最终在校队杯上亲手淘汰了老对手婷婷的球队。';
  var awList=(G.awakenings||[]).map(function(a){return a.label;});
  if(awList.length) jny += '她经历了 '+awList.length+' 次“才能开花”（觉醒）：'+awList.join('、')+'——每一个都是破茧的瞬间。';
  if((G.lastReflectYr||0)>=1) jny += '每过一年她都停下来回望一次（共 '+G.lastReflectYr+' 个年头的回眸），把汗水、笑闹与眼泪都收进了成长里。';
  var sbList=(G.setbacks||[]);
  if(sbList.length) jny += '她也跌倒过（'+sbList.length+' 次关键战崩盘），但每一次都咬着牙爬了起来。';
  var peace=(G.peaceLog||[]);
  if(peace.length) jny += '成长从不是一条直线——她与'+peace.join('、')+'都曾有过摩擦与误会，但每一次都选择了坐下来好好说开，那些裂痕反而让关系更结实。';
  else if((G.conflictFired&&Object.keys(G.conflictFired).length)) jny += '她和身边人也起过摩擦，只是有些隔阂没来得及说开，成了心里一点淡淡的遗憾。';
  var tingTxt = beatTing
    ? '你最终在个人实力上压过了老对手婷婷，这场从童年开始的较量，你赢了。'
    : '老对手婷婷依旧走在你前头——但你们的故事，还会继续。';
  var lg = Object.keys(G.achievements).length+'/'+Object.keys(ACH).length;
  var tail = '\n\n【梦想】'+dreamTxt+(dreamOk?' ✅ 已达成':' ❌ 未竟')+
    '\n【性格】'+pkW+
    '\n'+jny+'\n'+tingTxt+'\n\n'+(flavor?flavor+'\n':'')+
    '三轴轨迹 → 奋斗 '+Math.round(ePct)+' ｜ 成果 '+Math.round(rPct)+' ｜ 友情 '+Math.round(fPct)+
    '\n最终身高 '+Math.round(st.height)+'cm ｜ 校队联赛排名 第'+rk+'/32 ｜ 最好成绩 第'+G.bestRank+'/32 ｜ 模板 '+(TEMPLATES[G.template].name)+' ｜ 解锁成就 '+lg;
  // 生涯综合评分与评级：由三轴 + 成就完整度 + 超越婷婷 + 传奇 + 联赛登顶 综合给出
  var achN = Object.keys(G.achievements).length, achTotal = Object.keys(ACH).length;
  var beatTing = p >= tingPower();
  var gradeScore = Math.round(ePct*0.22 + rPct*0.30 + fPct*0.18 + (achN/achTotal)*100*0.16 + (beatTing?8:0) + (G.achievements.a_legend?16:0) + (G.bestRank===1?8:0));
  var grade, gradeTxt;
  if(gradeScore>=85){ grade='S'; gradeTxt='传奇级养成 · 载入校史'; }
  else if(gradeScore>=70){ grade='A'; gradeTxt='顶尖级 · 一代名将'; }
  else if(gradeScore>=55){ grade='B'; gradeTxt='优秀 · 令人骄傲'; }
  else if(gradeScore>=40){ grade='C'; gradeTxt='合格 · 稳扎稳打'; }
  else { grade='D'; gradeTxt='起步 · 来日方长'; }
  return {title:title, body:body+tail, ePct:ePct, rPct:rPct, fPct:fPct,
          grade:grade, gradeScore:gradeScore, gradeTxt:gradeTxt,
          achN:achN, achTotal:achTotal, beatTing:beatTing};
}

/* ===== 渲染 ===== */
var _avatarCache = { key:null, svg:'' };
var _avatarBuilds = 0;
function avatarSVG(){
  // —— 主角立绘 memoize：身高/年龄/是否持球(技能≥55)/是否拿书(学习≥60) 不变则复用，避免每次 render 重算 ——
  var _key = [Math.round(G.stats.height), G.age, (G.stats.skill>=55?1:0), (G.stats.study>=60?1:0)].join('#');
  if(_avatarCache.key===_key) return _avatarCache.svg;
  _avatarBuilds++;
  var H=G.stats.height;
  var t=clamp((H-138)/(192-138),0,1);
  var scale=0.72+t*0.5;
  var cx=110, baseY=300, unit=9*scale, stroke='#2e2433';
  var headSz=unit*2, torsoSz=unit*4, legSz=unit*5;
  var legY=baseY-legSz;
  var torsoY=legY-torsoSz-unit*0.1;
  var headCy=torsoY-headSz-unit*0.1;
  var skin='#f6c9a0', hair='#6b4a3a';
  var cloth=(G.age<15)?'#7bbf8a':(G.age<17?'#ff7da8':'#4aa3e8');
  var hasBall=G.stats.skill>=55, hasBook=G.stats.study>=60;
  function R(x,y,w,h,c){ return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+c+'" stroke="'+stroke+'" stroke-width="2" shape-rendering="crispEdges"/>'; }
  var s='<svg viewBox="0 0 220 320" width="100%" height="270" role="img" shape-rendering="crispEdges">';
  s+=R(cx-unit*0.9, legY, unit*0.8, legSz, skin);
  s+=R(cx+unit*0.1, legY, unit*0.8, legSz, skin);
  s+=R(cx-torsoSz/2, torsoY, torsoSz, torsoSz, cloth);
  s+=R(cx-torsoSz/2-unit*0.7, torsoY+unit*0.3, unit*0.6, torsoSz*0.7, skin);
  s+=R(cx+torsoSz/2+unit*0.1, torsoY+unit*0.3, unit*0.6, torsoSz*0.7, skin);
  s+=R(cx-headSz/2, headCy, headSz, headSz, skin);
  s+=R(cx-headSz/2-unit*0.2, headCy-unit*0.4, headSz+unit*0.4, unit*0.7, hair);
  s+=R(cx-headSz/2-unit*0.2, headCy, unit*0.5, headSz*0.55, hair);
  s+=R(cx-headSz*0.2, headCy+headSz*0.5, unit*0.4, unit*0.4, stroke);
  s+=R(cx+headSz*0.05, headCy+headSz*0.5, unit*0.4, unit*0.4, stroke);
  if(hasBall){
    var bx=cx+torsoSz/2+unit*1.2;
    s+=R(bx, torsoY+torsoSz*0.3, unit*1.6, unit*1.6, '#e8893a');
    s+='<line x1="'+bx.toFixed(1)+'" y1="'+(torsoY+torsoSz*0.3+unit*0.8).toFixed(1)+'" x2="'+(bx+unit*1.6).toFixed(1)+'" y2="'+(torsoY+torsoSz*0.3+unit*0.8).toFixed(1)+'" stroke="#b5641f" stroke-width="1.5"/>';
  }
  if(hasBook){
    s+=R(cx-torsoSz/2-unit*1.8, torsoY+torsoSz*0.2, unit*1.4, unit*1.8, '#caa23a');
  }
  s+='</svg>';
  _avatarCache.key=_key; _avatarCache.svg=s;
  return s;
}

function sparkSVG(){

function radarSVG(){
  var cx=120, cy=112, R=84, n=STATS.length;
  var grid='';
  [0.25,0.5,0.75,1].forEach(function(g){
    var gp=STATS.map(function(k,i){var ang=-Math.PI/2+i*2*Math.PI/n;return (cx+Math.cos(ang)*R*g).toFixed(1)+','+(cy+Math.sin(ang)*R*g).toFixed(1);}).join(' ');

  });
  var labels=STATS.map(function(k,i){var ang=-Math.PI/2+i*2*Math.PI/n;var lx=cx+Math.cos(ang)*(R+13), ly=cy+Math.sin(ang)*(R+13);return '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="9" fill="#8a8390" text-anchor="middle">'+SINFO[k].n+'</text>';}).join('');
  return '<svg viewBox="0 0 240 224" width="100%">'+grid+'<polygon points="'+pts.join(' ')+'" fill="rgba(232,96,154,.25)" stroke="#e8609a" stroke-width="2"/>'+labels+'</svg>';
}

/* 每季初随机生成培养方针（核心机制：每季随机出现 5~8 项，玩家从中勾选 2 项确认） */
function genOffer(){
  var keys=Object.keys(ACTS);
  var n = 5 + Math.floor(rng()*4);   // 每季随机出现 5~8 项，玩家从中勾选 2 项
  var arr=keys.slice();
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  arr=arr.slice(0,n);
  // 约 60% 概率保证含一个能恢复体力的选项
  var hasRest = arr.some(function(k){ return ACTS[k].eff.stamina && ACTS[k].eff.stamina>0; });
  if(!hasRest && rng()<0.6){
    var rk = keys.filter(function(k){ return ACTS[k].eff.stamina && ACTS[k].eff.stamina>0; });
    if(rk.length){ arr[Math.floor(rng()*arr.length)] = rk[Math.floor(rng()*rk.length)]; }
  }
  G.offer = arr; G.sel = [];
}

function lockerChoice(idx){
  if(G.screen!=='locker' || !G.lockerEvent) return;
  var le=G.lockerEvent, mate=le.mate, ev=le.ev;
  idx = Math.max(0, Math.min(idx|0, ev.choices.length-1));
  var ch = ev.choices[idx]; if(!ch) return;
  // 1) 动作本身的固有效果（已经发生，无论怎么回应都会结算）
  applyEff(ev.eff||{});
  // 2) 回应带来的额外取舍
  applyEff(ch.eff||{});
  // 3) 关系变化：作用于该队友 rel，并计入友情轴
  var fr = (ch.fr!=null)? ch.fr : 0;
  mate.rel = clamp((mate.rel!=null?mate.rel:50) + fr, 0, 100);
  if(fr) pushAxisFeed('friend', fr, mate.name);
  storyLine(secLabel(), '【更衣室·'+mate.name+'】'+ev.t+' — 你'+ch.l);
  diary(secLabel(), '【更衣室·'+mate.name+'】'+ev.t+' — 你'+ch.l);
  G.lockerEvent=null;
  if(G.season>=G.total){ G.screen='ending'; computeRank(); render(); return; }
  enterCompetition(G.pendingSeason);
}
/* 阵容表：每队 8~11 人，按战力排序后拆成“首发五人”与“替补席”，避免长名单糊成一片。
   同时展示身高与腿长（长人/长腿都是这套成长系统随机涌现出来的看点）。 */
function rosterHTML(roster, youPower, youName, youPos, startIds){
  var youIn = (youPower!=null);
  var startersN = youIn ? 4 : 5;   // 你占一个首发名额
  var startSet = {};
  var ordered = [];
  if(youIn && startIds && startIds.length){
    var want = {}; startIds.forEach(function(u){ want[u]=true; });
    var inLine = startIds.map(function(u){ return (roster||[]).find(function(p){ return p.uid===u; }); }).filter(Boolean);
    var bench = (roster||[]).filter(function(p){ return !want[p.uid]; }).slice().sort(function(a,b){ return (b.ovr||0)-(a.ovr||0); });
    inLine.forEach(function(p){ startSet[p.uid]=true; });
    ordered = inLine.concat(bench);
    startersN = inLine.length || startersN;
  } else {
    ordered = (roster||[]).slice().sort(function(a,b){ return (b.ovr||0)-(a.ovr||0); });
    ordered.slice(0,startersN).forEach(function(p){ startSet[p.uid]=true; });
  }
  function prow(p){
    var ht = (p.height!=null) ? (p.height>=200 ? (p.height/100).toFixed(2)+'m' : p.height+'cm') : '';
    var lg = (p.legs!=null) ? ('<span class="leg">腿'+p.legs+'</span>') : '';
    var tag = ({tallC:'🏔️',topC:'👑',strongC:'💪',strongG:'⚡'}[p.pgrowth]||'');
    // 先天特征（天才/黑马/速度型…）与发育类型（早熟已停长 / 晚熟仍在长）
    var pt = PTRAIT_BY[p.ptrait];
    var ptg = pt? '<span class="ftag t-'+p.ptrait+'" title="'+pt.n+'：'+pt.ds+'">'+pt.tag+pt.n+'</span>' : '';
    var mt = p.matType==='late' ? '<span class="mtag late" title="晚熟型：高三仍在长">🌱仍在长</span>'
           : (p.matType==='early' ? '<span class="mtag early" title="早熟型：初二已发育完毕">⏹已停长</span>' : '');
    var itag = p.intl? '<span class="itag" title="国际学生">'+(p.natio||'🌍')+'</span>' : '';
    // 体力条：每名球员当前体力/上限（铁人型上限更高）
    var sb = '';
    if(p.stam!=null){
      var sm = p.stamMax||100, fr = clamp(p.stam/sm,0,1), scol = fr<0.3?'#e0506a':(fr<0.5?'#e89a2a':'#6fae46');
      sb = '<span class="sbar" title="体力 '+Math.round(p.stam)+'/'+Math.round(sm)+(p.ptrait==='iron'?'（铁人 -10%消耗）':'')+'"><span style="width:'+Math.round(fr*100)+'%;background:'+scol+'"></span></span>';
    }
    // 首发/替补标记（仅你方显示，且依据 G.lineup）
    var stTag = youIn ? (startSet[p.uid]
        ? '<span class="sttag" title="本场首发">首发</span>'
        : '<span class="btag" title="本场替补">替补</span>') : '';
    return '<div class="rrow'+(youIn&&startSet[p.uid]?' st':'')+'">'+stTag+avatarTiny(p.uid||p.name)+'<span class="pos">'+p.pos+'</span><span class="nm">'+itag+p.name+'</span>'+
      (ht?'<span class="hgt'+(p.height>=200?' giant':'')+'">'+ht+'</span>':'')+ lg +
      ptg + mt +
      (tag?'<span class="ptag">'+tag+'</span>':'')+ sb +
      mateAttrChips(p) +
      '<span class="ovr">'+p.ovr+'</span></div>';
  }
  var rows='';
  if(youIn){
    rows += '<div class="rrow you">'+avatarTiny('YOU-'+youName)+'<span class="pos you">你</span><span class="nm">'+youName+'（'+youPos+'）· 首发</span><span class="ovr">'+Math.round(youPower)+'</span></div>';
  }

/* ===== 比赛分四节 + 逐节解说 ===== */
function splitTotalTo4(total){
  var q=[0,0,0,0], rem=total;
  for(var i=0;i<4;i++){
    if(i===3){ q[3]=rem; break; }
    var avg=rem/(4-i);
    var v=Math.round(avg*(0.55+rng()*0.95));
    if(v<0)v=0;
    if(v>rem-(4-i-1)) v=rem-(4-i-1);   // 给后面每节至少留 0
    q[i]=v; rem-=v;
  }
  for(var i=3;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=q[i]; q[i]=q[j]; q[j]=t; }
  return q;
}
function addQuarters(res){
  res.qy = splitTotalTo4(res.ys);
  res.qo = splitTotalTo4(res.os);
  if(res.box){ res.qpts = splitTotalTo4(res.box.pts); }
}
/* 把总分均摊成 4 节预算，保证每节都 >0（floor(total/4) 起步），用于交互比赛的逐节分配，
   杜绝“某节 0 分”。轻微打乱顺序，避免总是末节略高。 */
function evenSplit4(total){
  var q=[0,0,0,0]; if(total<=0) return q;
  var base=Math.floor(total/4), rem=total-base*4, i;
  for(i=0;i<4;i++){ q[i]=base+(i<rem?1:0); }
  for(i=3;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=q[i]; q[i]=q[j]; q[j]=t; }
  return q;
}
/* 初中杯两回合：把单回合（l1/l2）装饰成一场合规的四节制比赛
   —— 个人逐节得分 < 全队逐节得分（与交互式比赛同口径）；单节上限 108、罚球 2+1 达 132，四节不设硬上限 */
function decorateTwoLegLeg(leg, strat, oStrat){
  leg.qy = splitTotalTo4(leg.y).map(function(v){ return Math.min(v,132); });
  leg.qo = splitTotalTo4(leg.o).map(function(v){ return Math.min(v,132); });
  var frac = clamp(0.32 + G.stats.skill/500 - (strat.ptsMul-1)*0.08 + (rng()-0.5)*0.10, 0.10, 0.82);
  var qp=[0,0,0,0], sum=0;
  for(var i=0;i<4;i++){ qp[i]=Math.max(0, Math.min(leg.qy[i]-1, Math.round(leg.qy[i]*frac))); sum+=qp[i]; }
  leg.qpts = qp;
  var b = genBox(strat, leg.win, oStrat, null);
  b.pts = sum;                                   // 个人总分 = 逐节之和，已 < 全队单场总分
  b.fga = Math.max(sum, Math.round(sum*0.85 + 4));
  b.fgm = Math.round(b.fga * clamp(0.30 + G.stats.skill*0.0045 + G.stats.conf*0.002, 0.24, 0.68));
  if(b.pts>0 && b.fgm===0) b.fgm=1;
  leg.box = b;
  return leg;
}

var QINTEN = {

function revealQuarter(){

  var m=G.curMatch; if(!m) return;

  if(G.ctx==='cup' && G.cup && G.cup.isTwoLeg){
    if((G.matchQuarter||0) < 4){ G.matchQuarter=(G.matchQuarter||0)+1; render(); }
    return;
  }
  var qi = G.matchQuarter||0; if(qi>=4) return;
  var strat = STRATS[m.strat] || STRATS.balanced;   // 本节沿用赛前所选的"初始策略"
  var opp = m.oppRef, isCup=(G.ctx==='cup');

  var matchup = (oStrat && oStrat.counter===m.strat) ? 1.05 : 1;   // 选对克制策略 → 战力 +5%
  // 逐节"参与身份强度"策略：改变强度与体力，是初始策略的延续

  // 「单节上限 108 分，加罚球(2+1)实际可达 132」是【每节】的天花板；四节【不设】硬上限，
  // 因此绝不会出现“前三节吃满、第四节被逼成 0 分”的不科学局面。
  // 命中率 = 本方基础命中(随实力) − 对手干扰防守(随对手实力) + 噪声；累计分差形成“势头”，
  // 差距拉大时落后方组织不了像样进攻→分差越拉越大。
  var youE_q = m.youBaseE * strat.offMul * matchup;

  // 势头大幅收敛（>18 分才轻微失衡、上限 0.12），消除“领先就滚雪球”的离谱大比分
  var mom = Math.abs(agYO)>18 ? clamp((Math.abs(agYO)-18)/110, 0, 0.12)*(agYO>0?1:-1) : 0;

  if(G.matchQuarter>=4) finalizeMatch(m, opp, strat);
  render();
}
/* 第 4 节揭示后：结算本场（生成个人数据、累计统计、完美数据激励、士气、赛后选项） */
function finalizeMatch(m, opp, strat){
  m.ys = m.qy[0]+m.qy[1]+m.qy[2]+m.qy[3];
  m.os = m.qo[0]+m.qo[1]+m.qo[2]+m.qo[3];
  m.win = m.ys>m.os;
  try{ if(typeof Sfx!=='undefined' && Sfx) Sfx[m.win?'win':'lose'](); }catch(e){}
  var sumPts = m.qpts[0]+m.qpts[1]+m.qpts[2]+m.qpts[3];   // 逐节个人分之和（不设个人封顶，但始终 < 全队单场）
  m.box = genBox(strat, m.win, m.oStrat, sumPts);
  accStats(m.box, m.win);
  applyPerfMotivation(m.box, m.win);
  applyMatchExperience(m.box, m.win, oppEff(opp, G.ctx==='cup'), G.minutes);   // ④ 实战直接涨经验
  maybeInjury(strat, m.win);
  G.teamMorale = clamp((G.teamMorale||0)+(m.win?0.3:-0.35)+(rng()-0.5)*0.4, -3, 3);
  m.moments = genMoments(m, m.strat, opp);
  G.curMatchComm = commentary(m);
  if(m.win && m.box.pts>=24) addHighlight('🔥 '+secLabel()+' 狂砍 '+m.box.pts+' 分率队取胜！');
  else if(!m.win && Math.abs(m.ys-m.os)<=3) addHighlight('😤 '+secLabel()+' 一分惜败，虽败犹荣');
  if(m.win && (m.ys-m.os)>=20) queueFanfare('🏆','大胜 '+Math.round(m.ys-m.os)+' 分！','碾压级表现，全场为你沸腾', 'win');
  else if(m.win && m.box.pts>=30) queueFanfare('🔥','单场狂砍 '+m.box.pts+' 分！','火力全开，势不可挡', 'win');
  if(m.win && m.isTing) queueFanfare('👑','击败婷婷！','你亲手赢下了这场宿命对决', 'win');
  G.curMatchChoices = genPostChoices(m.win, opp);
  checkBoxStats(m.box); checkMilestones();
}

var _pxRAF=null;
function startPixelCourt(){
  try{
    var cv=document.getElementById('courtCanvas'); if(!cv) return;
    var ctx=(cv.getContext&&cv.getContext('2d'))||null; if(!ctx) return; // jsdom 无 canvas 实现，跳过
    if(_pxRAF) try{cancelAnimationFrame(_pxRAF);}catch(e){}
    var W=cv.width, H=cv.height;
    var m=G.curMatch||{ys:0,os:0,win:false,isTing:false};
    var t=0, shootT=0, hoopFlash=0, popList=[];
    function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h)); }
    function circle(cx,cy,r,c){ ctx.strokeStyle=c; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke(); }
    function drawCourt(){
      px(0,0,W,H,'#caa06a');
      for(var i=0;i<W;i+=8) px(i,0,1,H, ((i/8)%2)?'#c1925c':'#caa06a');
      ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(2.5,2.5,W-5,H-5);
      px(W/2-1,2,2,H-4,'#fff');
      circle(W/2,H/2,8,'#fff');
      px(3,H/2-6,3,12,'#f4f4f4'); px(1,H/2-3,2,6,'#ff5d6c');
      px(W-6,H/2-6,3,12,'#f4f4f4'); px(W-3,H/2-3,2,6,'#ff5d6c');
    }
    function drawPlayer(x,y,col,hasBall,pose){
      if(pose==='slump'){
        px(x-3,y-8,6,4,col); px(x-3,y-5,6,1,'#cfcfcf'); px(x-2,y-4,4,6,col);
        px(x-2,y+2,1,2,col); px(x+1,y+2,1,2,col);
        if(hasBall) px(x+4,y-1,3,3,'#ff9b2f');
        return;
      }
      px(x-3,y-11,6,5,col); px(x-3,y-7,6,1,'#ffe0c0'); px(x-2,y-6,4,7,col);
      px(x-2,y+1,1,3,col); px(x+1,y+1,1,3,col);
      if(pose==='cheer'){ px(x-4,y-13,1,3,col); px(x+3,y-13,1,3,col); }   // 举手庆祝
      if(hasBall) px(x+4,y-3,3,3,'#ff9b2f');
    }
    function frame(){
      t+=0.045; shootT+=0.05;
      drawCourt();
      var yx = W*0.30 + Math.sin(t*0.8)*W*0.10;
      var ox = W*0.70 - Math.sin(t*0.8+1)*W*0.10;
      if(m.win){
        // 胜利：你（粉）起跳庆祝，对手（蓝）垂头；你的半场撒绿彩
        var yj = (Math.sin(t*3.2)>0.55)? -5:0;
        drawPlayer(yx, H/2+yj, '#ff5d8f', true, 'cheer');
        drawPlayer(ox, H/2+2, '#3fa7e8', false, 'slump');
        if(shootT>0.5){ shootT=0; if(rng()<0.7){ hoopFlash=12; popList.push({x:W*0.16+rng()*W*0.24, y:H*0.20+rng()*16, txt:'+2', c:'#9bf0ad'}); } }
        if(t%1.4<0.04){ hoopFlash=14; }
      } else {
        // 失败：你（灰）垂头丧气，对手（蓝）起跳庆祝；对手半场撒蓝彩
        var oj = (Math.sin(t*3.2)>0.55)? -5:0;
        drawPlayer(yx, H/2+3, '#9a8a92', false, 'slump');
        drawPlayer(ox, H/2+oj, '#3fa7e8', true, 'cheer');
        if(shootT>0.5){ shootT=0; if(rng()<0.7){ hoopFlash=12; popList.push({x:W*0.58+rng()*W*0.24, y:H*0.20+rng()*16, txt:'+2', c:'#bfe0ff'}); } }
      }
      if(hoopFlash>0){ hoopFlash--; px(W/2-7,H/2-3,14,5, (hoopFlash>6?'#ffe27a':'#46c46b')); }
      popList=popList.filter(function(p){ p.t=(p.t||0)+1; return p.t<46; });
      popList.forEach(function(p){ ctx.fillStyle=p.c; ctx.font='bold 9px monospace'; ctx.fillText(p.txt, p.x, p.y-p.t*0.4); });
      ctx.font='bold 13px monospace'; ctx.textAlign='center';
      ctx.fillStyle = m.win? '#9bf0ad' : '#ff8a9a';
      ctx.fillText(m.win?'WIN!':'LOSE', W/2, H-5); ctx.textAlign='left';
      _pxRAF=requestAnimationFrame(frame);
    }
    frame();
  }catch(e){ /* 非浏览器/无 canvas 环境忽略 */ }
}

function render(){
  var app=$('app');
  if(!app) return;
  // 兜底：若状态缺失（极端情况下后端返回空/异常），重建一个标题态，绝不空屏
  if(!G || !G.screen){
    try{ if(!loadGame()){ newGame('小岚', Math.floor(Math.random()*1e9), pendingTemplate); } }catch(e){}
    if(!G || !G.screen) return;
  }
  if(_pxRAF && G.screen!=='match'){ try{cancelAnimationFrame(_pxRAF);}catch(e){} _pxRAF=null; }
  // 防白屏：任一屏的渲染异常都回退到标题屏，绝不让整页只剩背景
  var html='';
  try{
    if(G.screen==='title') html=titleHTML();
    else if(G.screen==='dream') html=dreamHTML();
    else if(G.screen==='school'||G.screen==='school2') html=schoolHTML();
    else if(G.screen==='transfer') html=schoolHTML();
    else if(G.screen==='main') html=mainHTML();
    else if(G.screen==='event') html=eventHTML();
    else if(G.screen==='locker') html=lockerHTML();
    else if(G.screen==='prematch') html=prematchHTML();
    else if(G.screen==='match') html=matchHTML();
    else if(G.screen==='league') html=leagueScreenHTML();
    else if(G.screen==='cup') html=cupScreenHTML();
    else if(G.screen==='ending') html=endingHTML();
    else if(G.screen==='lineup') html=lineupHTML();
    else html=titleHTML();
  }catch(e){
    showError('渲染「'+G.screen+'」时出错，已回退到标题：'+(e&&e.message||e));
    try{ G.screen='title'; html=titleHTML(); }catch(e2){ html='<div class="overlay"><div class="modal"><h2>出错了</h2><p>'+escapeHtml((e2&&e2.message)||'')+'</p></div></div>'; }
  }
  app.innerHTML=html;
  try{ if(G.screen==='match' && (G.matchQuarter||0)>=4) startPixelCourt(); }catch(e){}
  flushFanfares();
  try{ saveGame(); }catch(e){}
}

function growSliderMul(t){
  t = clamp(t,0,1);
  if(t<0.25) return 0.65 + (0.95-0.65)*(t/0.25);
  if(t<0.55) return 0.95 + (1.25-0.95)*((t-0.25)/0.30);
  if(t<0.80) return 1.25 + (1.60-1.25)*((t-0.55)/0.25);
  return 1.60 + (2.10-1.60)*((t-0.80)/0.20);   // 最右侧：全部成长明显比例放大
}
function growSliderLabel(t){
  if(t<0.25) return '普通女孩';
  if(t<0.55) return '运动女孩';
  if(t<0.80) return '天才';
  return '怪物天才';
}
function onGrowInput(v){
  pendingGrowT = clamp(parseFloat(v)/100 || 0, 0, 1);

  G.school=name; G.schoolTrait=obj.trait; G.schoolMod=TRAIT_BY[obj.trait].mod; G.schoolRoster=obj.roster;
  G.teammates=makeTeammates(obj.roster); G.schoolRoster=G.teammates; G.lineup=defaultLineup();
  G.highChosen=true; G.highTeams=fieldTeams(all,name); G.curTeams=G.highTeams;
  applySchoolBonus(TRAIT_BY[obj.trait].bonus);
  // 适应性成长：先天特征契合该校体系 → 高中三年所有养成收益 +3~5%
  G.fitMul = fitMulOf(G.ptrait, obj.trait, rng);
  if(G.fitMul>1){
    addHighlight('🧬 「'+G.ptraitN+'」体质与「'+TRAIT_BY[obj.trait].n+'」的体系高度契合，养成效率 +'+Math.round((G.fitMul-1)*100)+'%');
    storyLine(secLabel(), '【适应】第一堂训练课下来，她就知道自己选对了地方——这里的练法，天生就是为她这种人准备的。');
  }
  var nIn=(G.teammates||[]).filter(function(p){return p.intl;}).length;
  if(nIn) addHighlight('🌍 新队伍里有 '+nIn+' 名国际学生队友（'+G.teammates.filter(function(p){return p.intl;}).slice(0,3).map(function(p){return (p.natio||'')+p.name;}).join('、')+'）');
  computeRank(); G.prevRank=G.rank; G.bestRank=G.rank; G.prevTingAhead=(power(G.stats)>=tingPower());
  enterCompetition(12);
}
function restart(){ newGame('小岚', Math.floor(Math.random()*1e9), pendingTemplate); render(); }

/* ================= 存档 / 读档（GAP-01，P0） ================= */
var SAVE_KEY = 'bbg_save_v1';
var SAVE_VER = 5;   // 与“第五轮（体力/阵容/特性数值化）”架构绑定；旧版存档(saveVer 缺失或不同)一律弃用，避免不兼容导致空白页
function saveGame(){
  if(!G || !G.screen) return;
  // 仅持久化“稳定态”屏：标题前不落盘（避免覆盖旧存档），比赛中不落盘（避免半场残态）
  var OK = {dream:1,school:1,school2:1,transfer:1,main:1,event:1,locker:1,prematch:1,league:1,cup:1,ending:1};
  if(!OK[G.screen]) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); hasSave = true; try{ showSaveToast(); }catch(e){} }
  catch(e){ /* 隐私模式 / 配额超限：静默降级 */ }
}
function loadGame(){
  try{
    var s = localStorage.getItem(SAVE_KEY);
    if(!s) return false;
    var d = JSON.parse(s);
    if(!d || typeof d!=='object' || !d.screen) return false;
    if(d.saveVer !== SAVE_VER) return false;   // 旧版（含第四轮）存档结构与新版不兼容 → 弃用，开新局避免空白
    G = d;
    repairState(G);                            // 兜底补齐可能缺失的字段，绝不空白
    if(G.screen==='match') G.screen='main';   // 防御：比赛中断不续半场，回主菜单
    hasSave = true;
    return true;
  }catch(e){ return false; }
}
/* 兼容/兜底：补齐新版渲染所依赖的字段，使任何历史存档都不致渲染崩溃 */
function repairState(g){
  if(!g || typeof g!=='object') return;
  if(!g.lineup || !g.lineup.length) g.lineup = defaultLineup();
  if(g.stats && g.stats.stamina==null) g.stats.stamina = stamCap();
  if(!Array.isArray(g.teammates)) g.teammates = [];
  g.teammates.forEach(function(p){
    if(p.stamMax==null) p.stamMax = Math.round(82 + (p.ovr||50)*0.2);
    if(p.stam==null) p.stam = p.stamMax;
    if(p.stamGrow==null) p.stamGrow = 0.02;
  });
  if(g.curOpp && g.curOpp.roster){ g.curOpp.roster.forEach(function(p){
    if(p.stamMax==null) p.stamMax = Math.round(82 + (p.ovr||50)*0.2);
    if(p.stam==null) p.stam = p.stamMax;
  }); }
}
function hasSavedGame(){
  try{ var s = localStorage.getItem(SAVE_KEY); if(!s) return false; var d = JSON.parse(s); return !!(d && d.screen); }
  catch(e){ return false; }
}
function continueGame(){ if(loadGame()){ if(G.screen==='match') G.screen='main'; render(); } }
