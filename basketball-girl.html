是最特别的那个——因为你眼里有光。”",c:[{l:"把这句话藏心里",hint:"与教练羁绊 +3，自信 +3",eff:{fr_coach:3,conf:3},persona:"warm"}]},sp_b1:{t:"“这位置我罩你”",who:"学姐·队长",d:"学姐把你拉到一边：“以后内线有我顶，外线你放开打。这位置，我罩你。”",c:[{l:"“那我就不客气了”",hint:"与学姐羁绊 +3，自信 +2",eff:{fr_senpai:3,conf:2},persona:"passion"}]},sp_b2:{t:"交接的臂章",who:"学姐·队长",d:"毕业典礼上，学姐把队长臂章别在你胸前：“队伍交给你了。别让它丢人。”全场鼓掌。",c:[{l:"“我接住了”",hint:"与学姐羁绊 +3，自信 +4",eff:{fr_senpai:3,conf:4},persona:"calm"}]},sp_b3:{t:"觉醒·传承",who:"解说",d:"决赛最后时刻，你鬼使神差使出了学姐教你的那招“背身转身勾手”——全场炸了。你听见看台上学姐的喊声：“就是那样！”",awake:!0,c:[{l:"把这一球献给学姐",hint:"才能开花！技术 +3，自信 +3",eff:{skill:3,conf:3},persona:"warm"}]},kb_b1:{t:"“我也要像你”",who:"后辈·学妹",d:"学妹在周记里写：“我的目标是成为像学姐一样厉害的球员。”被你无意看到，心里一软。",c:[{l:"悄悄给她塞张鼓励纸条",hint:"与后辈羁绊 +3，自信 +2",eff:{fr_kouhai:3,conf:2},persona:"warm"}]},kb_b2:{t:"崩溃的那一刻",who:"后辈·学妹",d:"学妹在关键战失误，坐在地上哭到喘不过气。你蹲下去，像当年学姐对你那样。",c:[{l:"“没事，姐在”",hint:"与后辈羁绊 +3，自信 +2",eff:{fr_kouhai:3,conf:2},persona:"warm"}]},kb_b3:{t:"觉醒·榜样",who:"解说",d:"决赛读秒，学妹在你的防守牵制下完成绝杀，落地第一句喊的是你的名字。你忽然懂了“被需要”的重量。",awake:!0,c:[{l:"为她鼓掌到手红",hint:"才能开花！与后辈羁绊 +2，自信 +3",eff:{fr_kouhai:2,conf:3},persona:"warm"}]},team_bond:{t:"散场后的一瓶水",who:"队友",d:"一场恶战之后，队友们瘫在地板上，有人扔给你一瓶水：“你今天真的扛住了。”更衣室里全是笑。",c:[{l:"“下次还一起扛”",hint:"全队好感 +，自信 +2",eff:{rel:1,conf:2},persona:"passion"},{l:"“谢了，姐妹们”",hint:"全队好感 +，友情 +1",eff:{rel:1,fr_xiaotong:1},persona:"warm"}]},xt_conf:{t:"闺蜜的疏远",who:"晓彤",conflict:!0,d:"你最近训练太拼，和她约好的周末、放学后的奶茶局一推再推。今天她酸溜溜地甩来一句：“你心里现在只有篮球，没我这个朋友了。”",c:[{l:"放下训练，今天只陪她",hint:"暂停脚步，与晓彤羁绊 +3，温柔 +1",eff:{fr_xiaotong:3},persona:"warm",next:"xt_peace"},{l:"“比赛更重要，先顾球”",hint:"她更生气了，与晓彤羁绊 -2，自信 +1",eff:{fr_xiaotong:-2,conf:1},persona:"passion"}]},xt_peace:{t:"操场边的和解",who:"晓彤",_peace:!0,_peaceName:"晓彤",d:"你俩在操场边坐到天黑，她把头靠在你肩上：“我就知道，你心里还是有我的。”这一架，反而让你们更近了。",c:[{l:"“以后周末都归你”",hint:"与晓彤羁绊 +2，状态 +1",eff:{fr_xiaotong:2,form:1},persona:"warm"}]},co_conf:{t:"当众顶撞教练",who:"教练",conflict:!0,d:"战术板上你把主力位置换下，你不服，当着全队的面顶了回去：“凭什么总是我下来？”气氛一下僵住。",c:[{l:"赛后诚恳道歉并请教",hint:"与教练羁绊 +3，沉稳 +1",eff:{fr_coach:3},persona:"calm",next:"co_peace"},{l:"甩毛巾走人",hint:"教练寒了心，
